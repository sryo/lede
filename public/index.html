}
// Visitors per hour always cover 30 days, so today's pace and the usual crowd don't change with the period;
// the overview's hours card takes the period's days from the end (lastDays). One answer serves all three.
const HOURS={days:30};
const lastDays=(h,days)=>h&&h.days>days?{...h,start:h.start+(h.days-days)*86400,days,visitors:h.visitors.slice((h.days-days)*24)}:h;
const filterParams=f=>({path:f.path,referrer:f.referrer,channel:f.channel});
const FILTER_OF={path:'path',entry:'path',exit:'path',referrer:'referrer',channel:'channel'};

/* ---------- goals ---------- */
// Pages that count as a visitor doing something, saved by the Worker for everyone who opens the dashboard.
// The same answer carries the owner's notes on days ("Posted on Hacker News") and the funnels.
let GOALS=[],NOTES=[],FUNNELS=[],ICON=null,goalsReady=Promise.resolve();
// Runs alongside the stats; whatever needs the goals or notes waits on goalsReady. A reply for a site that is no
// longer showing is dropped, so one site's goals are never saved over another's.
function loadGoals(){
  const site=SITE;
  return goalsReady=api('goals',{},true).catch(()=>({})).then(b=>{if(site===SITE){GOALS=SHARED?[]:b.goals||[];NOTES=b.notes||[];FUNNELS=b.funnels||[];ICON=Number.isInteger(b.icon)?b.icon:null;setIcon()}});
}
// The tab's icon in the site's colourway (iconFor), so tabs for different sites tell apart at a glance.
const iconURL=i=>'data:image/svg+xml,'+encodeURIComponent(iconSVG(i));
function setIcon(){if(SITE)$('link[rel="icon"]').href=iconURL(iconFor(SITE,SITES,ICON))}
async function saveGoals(list){
  const before=GOALS;GOALS=list;
  let ok=false;
  try{const r=await fetch(`/api/goals?site=${encodeURIComponent(SITE)}`,{method:'PUT',body:JSON.stringify({goals:list})});if(!r.ok)throw new Error(r.status);ok=true}
  catch{GOALS=before;toast('Couldn’t save the goal. Check your connection, then try again.')}
  drawGoalLine();
  return ok;
}
const goalWhat=()=>GOALS.length===1?pageName(GOALS[0]):'a goal';
// A finish flag: grey outline for a page that isn't a goal, solid violet (the pages colour) for one that is.
const FLAG=on=>`<svg class="flag${on?' on':''}" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 14.5V1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.2 2.3h8.6l-2 3.2 2 3.2H4.2z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

// Under the home sentence: how many visits reached a goal, or, with none set, an offer to track a page that looks like one.
async function drawGoalLine(){
  const el=$('#goal-line');if(!el||!HOME||HOME.empty)return;
  if(SHARED){el.hidden=true;return}
  if(!GOALS.length){
    const g=suggestGoal(HOME.pageRows||[]);
    if(!g||store.get(`lede_goal_no:${SITE}`)===g){el.hidden=true;return}
    el.innerHTML=`<span>Is <b>${esc(pageName(g))}</b> a goal, a page you want visits to reach?</span>${goalSeg(g,null)}`;
    el.querySelector('[data-a="yes"]').onclick=()=>toggleGoal(g);
    el.querySelector('[data-a="no"]').onclick=()=>{store.set(`lede_goal_no:${SITE}`,g);el.hidden=true};
    el.hidden=false;return;
  }
  try{
    const conv=await api('conversions',{goal:GOALS});
    const html=goalStory(conv,GOALS,HOME.S.lead?.key);
    if(!html){el.hidden=true;return}
    const one=GOALS.length===1?GOALS[0]:null;
    el.innerHTML=`${one?`<button type="button" class="goal-t" data-path="${esc(one)}"></button>`:FLAG(true)}<span>${html}</span>`;
    const t=el.querySelector('.goal-t');
    if(t){paintGoalToggle(t);t.onclick=()=>toggleGoal(one)}
    el.hidden=false;
  }catch{el.hidden=true}
}

// Makes a page a goal, or stops tracking it, and updates every flag and goal line on screen.
async function toggleGoal(path){
  const on=GOALS.includes(path);
  const saved=await saveGoals(on?GOALS.filter(g=>g!==path):[...GOALS,path]);
  document.querySelectorAll('.goal-t').forEach(paintGoalToggle);
  document.querySelectorAll('.goal-card').forEach(c=>drawGoalCard(c,c.dataset.path));
  const name=path==='/'?'The home page':path;
  if(saved)announce(on?`${name} is no longer a goal`:`${name} is now a goal`);
}
function paintGoalToggle(b){
  const on=GOALS.includes(b.dataset.path);
  b.setAttribute('aria-pressed',on);b.innerHTML=FLAG(on);
  const p=b.dataset.path,name=p==='/'?'the home page':p;
  b.setAttribute('aria-label',on?`${name[0].toUpperCase()+name.slice(1)} is a goal. Stop tracking it`:`Track ${name} as a goal`);
  b.title=on?'A goal. Stop tracking it':'Track as a goal';
}

// At the foot of a page's view: what the page would show as a goal, before deciding.
async function drawGoalCard(card,path){
  if(SHARED)return;
  const on=GOALS.includes(path),no=!on&&store.get(`lede_not_goal:${SITE}:${path}`)==='1';
  let text='';
  try{text=goalStory(await api('conversions',{goal:[path]}),[path],HOME?.S?.lead?.key)||''}catch{text='Couldn’t load this. Check your connection, then reopen the page.'}
  card.innerHTML=`<div class="card-head"><div class="card-title">Is this page a goal?</div>${goalSeg(path,on?true:no?false:null)}</div>
    <p class="goal-text">${text||`Too few visits yet to say how often they reach ${esc(pageName(path))}.`}</p><p class="goal-text muted">A goal is a page you want visits to reach, like a sign-up or thank-you page.</p>`;
  card.querySelector('[data-a="yes"]').onclick=()=>{store.set(`lede_not_goal:${SITE}:${path}`,'');if(!on)toggleGoal(path)};
  card.querySelector('[data-a="no"]').onclick=()=>{store.set(`lede_not_goal:${SITE}:${path}`,'1');if(on)toggleGoal(path);else drawGoalCard(card,path)};
  card.hidden=false;
}

// Goal or not, as one segmented control like the period switch. state: true, false, or null for not answered yet.
const goalSeg=(path,state)=>`<div class="seg" role="group" aria-label="Is ${esc(path)} a goal?"><button type="button" data-a="yes" aria-pressed="${state===true}">${FLAG(state===true)}Goal</button><button type="button" data-a="no" aria-pressed="${state===false}">Not a goal</button></div>`;

/* ---------- formatting ---------- */
// Change against the previous period. Where lower is better (bounce), it says so in words.
function delta(c,p,inverse){
  if(c==null)return '<span></span>';
  if(!p)return c?'<span class="delta">new</span>':'<span></span>';
  const d=(c-p)/p,pct=Math.round(Math.abs(d)*100);
  if(!pct)return '<span class="delta">same</span>';
  return `<span class="delta">${d>0?'+':'−'}${pct}%${inverse?` <span class="muted">${d<0?'better':'worse'}</span>`:''}</span>`;
}
const change=(c,p)=>p?((c-p)/p>=0?'+':'−')+Math.round(Math.abs(c-p)/p*100)+'%':'new';
// For number rows: a change that rounds to 0% reads "same", as rates and lists already say; nothing then and now says nothing.
const changeWord=(c,p)=>!c&&!p?'':change(c,p).replace(/^[+−]0%$/,'same');
const CHEV='<svg class="chev" viewBox="0 0 7 12" aria-hidden="true"><path d="M1 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BACK='<svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M8 2L2 8l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const announce=msg=>{const el=$('#status');el.textContent='';setTimeout(()=>{el.textContent=msg},50)};
// A failure with nowhere of its own to show: a line at the foot of the window for a few seconds, read out too.
let toastAt=0;
const toast=msg=>{
  let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','alert');document.body.append(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastAt);toastAt=setTimeout(()=>{el.hidden=true},6000);
};
// An error says what went wrong and offers to try again.
function showError(el,e,retry){
  if(e.signIn)return;
  el.innerHTML=`<div class="state error"><b>Couldn’t load the stats</b><span>${esc(e.message)}</span>${retry?'<button type="button" class="retry">Try again</button>':''}</div>`;
  if(retry)el.querySelector('.retry').onclick=retry;
}
// Long paths keep their start and end: /blog/…-analytics.
const shorten=(s,max=22)=>s.length<=max?s:s.slice(0,Math.ceil(max/2)-1)+'…'+s.slice(-Math.floor(max/2));

/* ---------- drawing ---------- */
const ro=new ResizeObserver(es=>es.forEach(e=>e.target._draw&&e.target._draw()));
// A redraw replaces a chart's buttons; the one that had focus gets it back, found by its data-key.
function observe(el,fn){
  el._draw=()=>{
    const a=document.activeElement,k=a!==el&&el.contains(a)?a.dataset.key:undefined;
    fn();
    if(k!=null&&!el.contains(document.activeElement))[...el.querySelectorAll('[data-key]')].find(b=>b.dataset.key===k)?.focus({preventScroll:true});
  };
  el._draw();ro.observe(el);
}
// Stops watching charts inside root before it is replaced, so detached charts can be freed.
function release(root){for(const el of root.querySelectorAll('*'))if(el._draw){ro.unobserve(el);el._draw=null}}
function nice(mx){
  if(!(mx>0))return {step:1,n:1};
  const p=10**Math.floor(Math.log10(mx/5));
  for(const c of [1,2,2.5,5,10]){const step=c*p;if(mx/step<=5)return {step,n:Math.ceil(mx/step)}}
}
// Fill and text colour for a subject (time, src, page, bnc) solid, for the rest, or pale.
const fullOf=subj=>({color:`var(--${subj})`,on:`var(--on-${subj})`});
const tintOf=subj=>({color:`var(--${subj}-t)`,on:'var(--ink)'});
const paleOf=subj=>({color:`var(--${subj}-p)`,on:'var(--ink)'});
// Spreads label centres at least `gap` apart inside 0..H, keeping each as close to its node as it can.
function spread(ys,gap,H){
  if(gap*ys.length>H)return ys.map((_,i)=>(i+.5)*H/ys.length);
  ys=ys.slice();ys[0]=Math.max(ys[0],gap/2);
  for(let i=1;i<ys.length;i++)ys[i]=Math.max(ys[i],ys[i-1]+gap);
  ys[ys.length-1]=Math.min(ys[ys.length-1],H-gap/2);
  for(let i=ys.length-2;i>=0;i--)ys[i]=Math.min(ys[i],ys[i+1]-gap);
  return ys;
}
// A label anchored over position x (0-1) that stays inside the chart near either edge.
const anchorStyle=x=>`left:${(x*100).toFixed(1)}%;transform:translateX(${x<.3?-6:x>.7?-94:-50}%)`;

function squarify(vals,W,H){
  const total=vals.reduce((a,b)=>a+b,0);if(!total)return [];
  const k=W*H/total,areas=vals.map(v=>v*k),out=[];
  let x=0,y=0,w=W,h=H,row=[],i=0;
  const worst=(r,len)=>{let s=0,mx=0,mn=Infinity;for(const j of r){const a=areas[j];s+=a;mx=Math.max(mx,a);mn=Math.min(mn,a)}return Math.max(len*len*mx/(s*s),s*s/(len*len*mn))};
  const lay=r=>{
    const s=r.reduce((a,j)=>a+areas[j],0);
    if(w>=h){const cw=s/h;let cy=y;for(const j of r){const jh=areas[j]/cw;out[j]={x,y:cy,w:cw,h:jh};cy+=jh}x+=cw;w-=cw}
    else{const rh=s/w;let cx=x;for(const j of r){const jw=areas[j]/rh;out[j]={x:cx,y,w:jw,h:rh};cx+=jw}y+=rh;h-=rh}
  };
  while(i<areas.length){const len=Math.min(w,h);if(!row.length||worst([...row,i],len)<=worst(row,len)){row.push(i);i++}else{lay(row);row=[]}}
  if(row.length)lay(row);
  return out;
}
// A label's width in the blocks' bold face, from a canvas, kept per text and size.
const labelCanvas=document.createElement('canvas').getContext('2d'),labelWidths=new Map();
function labelWidth(t,f){
  const k=f+'|'+t;let v=labelWidths.get(k);
  if(v==null){labelCanvas.font=`700 ${f}px ${getComputedStyle(document.body).fontFamily}`;v=labelCanvas.measureText(t).width;labelWidths.set(k,v)}
  return v;
}
// items: [{label,value,color,on,sub?,onClick?}]
function treemap(el,items,{gap=4}={}){
  // The long tail goes last whatever its size, so it fills the far corner instead of leading.
  items=items.filter(it=>it.value>0).sort((a,b)=>(a.last?1:0)-(b.last?1:0)||b.value-a.value);
  if(!items.length){el.innerHTML='<div class="empty">No visitors yet</div>';return}
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const rects=squarify(items.map(it=>it.value),W,H);
    el.replaceChildren(...rects.map((r,i)=>{
      const it=items[i],b=document.createElement(it.onClick?'button':'div');
      b.className='blk';
      const w=r.w-gap,h=r.h-gap;
      Object.assign(b.style,{left:r.x+gap/2+'px',top:r.y+gap/2+'px',width:Math.max(0,w)+'px',height:Math.max(0,h)+'px',background:it.color,color:it.on});
      if(it.ring)b.classList.add('ring-blk');
      if(it.told)b.classList.add('told');
      // The name wraps at its joints, or turns to read up a tall block, at the biggest type that shows the most of it
      // (fitLabel); the change goes under it when a line is left. A block too small for three letters shows its short
      // tag or nothing: the title has the name.
      const pad=w<80?4:8,L=fitLabel(it.label,w,h,labelWidth,pad);
      b.style.padding=pad+'px';
      if(L){
        b.style.fontSize=L.f+'px';
        if(L.up)b.classList.add('tall');
        // A hyphen added to break a word is faded, so it isn't read as part of the address.
        b.innerHTML=`<b>${L.lines.map(esc).join('<br>').replaceAll('\u2010','<i class="hy">\u2010</i>')}</b>${L.room?`<span>${esc(it.sub??fmtN(it.value))}</span>`:''}`;
      }else if(w>28&&h>18&&it.short)b.innerHTML=`<b>${esc(it.short)}</b>`;
      b.title=`${it.label}: ${fmtInt(it.value)} visitors`;b.dataset.key=it.label;
      if(it.onClick){b.setAttribute('aria-label',`${it.label}, ${fmtInt(it.value)} visitors${it.sub?`, ${it.sub}`:''}. Open`);b.onclick=e=>{e.stopPropagation();it.onClick(b)}}
      return b;
    }));
  });
}

// Bars per day in a subject's colour (time unless `subj` says otherwise), with the previous period as a dashed step line over them.
// With `hot` days, those stay solid and the rest turn transparent; without, every bar is solid.
// o: {cur, prev?, start, aria, subj?, seg?:{day,top,subj}, hot?:Set, label?:{i,title,sub,swatch}, prevDot?, axis?, scale?, note?}
function dayBars(el,o){
  const {cur,start}=o,n=cur.length,prev=o.prev,day=i=>fmtDay(dayDate(start,i)),subj=o.subj||'time';
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const top=o.label?40:o.scale?10:4,padB=o.axis?20:o.scale?4:0,base=H-padB,padR=o.scale?40:0,peakV=Math.max(maxOf(cur),prev?maxOf(prev):0);
    // With a scale, the top gridline is a round number just above the tallest bar, and never a fraction of a person.
    const step=o.scale?Math.max(1,nice(peakV||1).step):0,max=o.scale?Math.ceil((peakV||1)/step)*step:peakV*1.04||1;
    if(base<top+8)return;
    const cw=(W-padR)/n,bw=Math.max(2,Math.min(cw*.66,28)),Y=v=>top+(base-top)*(1-v/max),x=i=>i*cw+(cw-bw)/2,r=Math.min(2,bw/2);
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria)}">`;
    if(o.scale)for(let k=1;k*step<=max+1e-9;k++){const v=k*step,y=Y(v);s+=`<line class="grid-l" x1="0" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${W}" y="${y+4}" font-size="12" fill="var(--muted)" text-anchor="end">${v>=1000?`${+(v/1000).toFixed(1)}k`:v}</text>`}
    cur.forEach((v,i)=>{
      if(o.seg&&o.seg.day===i){
        const y=Y(v),ym=Y(v-o.seg.top);
        s+=`<g><rect x="${x(i)}" y="${ym}" width="${bw}" height="${base-ym}" rx="${r}" fill="var(--${subj})"/><rect x="${x(i)}" y="${y}" width="${bw}" height="${ym-y}" rx="${r}" fill="var(--${o.seg.subj})"/></g>`;
      }else s+=`<rect x="${x(i)}" y="${Y(v)}" width="${bw}" height="${base-Y(v)}" rx="${r}" fill="var(--${subj}${o.hot&&!o.hot.has(i)?'-t':''})"/>`;
    });
    if(prev){
      let d=`M0,${Y(prev[0]).toFixed(1)}`;
      prev.forEach((v,i)=>{d+=`${i?`V${Y(v).toFixed(1)}`:''}H${((i+1)*cw).toFixed(1)}`});
      s+=`<path d="${d}" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      if(o.prevDot>=0)s+=`<circle cx="${(o.prevDot+.5)*cw}" cy="${Y(prev[o.prevDot])}" r="4" fill="var(--${subj})" stroke="var(--tile)" stroke-width="2"/>`;
    }
    // One strip per day, the full height, so a short bar or an empty day is as easy to point at as a tall one.
    // On a chart that takes notes, a day's hint says so, with the note already on it.
    const noted=i=>o.note&&NOTES.find(x=>x.day===dayKey(dayDate(o.start,i)));
    cur.forEach((v,i)=>{const nt=noted(i),h=dayHint(day(i),v,prev?.[i],DAYS)+(o.note?(nt?`\nYour note: ${nt.text}. Click to change it`:'\nClick to add a note'):'');
      s+=`<rect x="${i*cw}" y="${top}" width="${cw}" height="${base-top}" fill="transparent" data-hint="${esc(h)}"/>`});
    if(o.axis){
      const at=[0,...(o.label&&o.label.i>3&&o.label.i<n-4?[o.label.i]:[]),n-1];
      s+=at.map((i,k)=>`<text x="${k===0?x(i):k===at.length-1?x(i)+bw:x(i)+bw/2}" y="${H-4}" font-size="12" fill="var(--muted)" text-anchor="${k===0?'start':k===at.length-1?'end':'middle'}">${day(i)}</text>`).join('');
    }
    s+='</svg>';
    if(o.label){
      const L=o.label;
      s+=`<div class="peak" style="${anchorStyle((L.i+.5)*cw/W)}"><b>${esc(L.title)}</b>${L.sub?`<br><span${L.swatch?' class="told"':''}>${L.swatch?`<i class="sw" style="background:${L.swatch}"></i>`:''}${esc(L.sub)}</span>`:''}</div>`;
    }
    el.innerHTML=s;
  });
}

// A line per day against the previous period (dashed), with the peak labelled. A null day has no value: the line
// breaks there, and a day alone between two gaps is a dot.
// span: the least the axis covers, so a small wobble isn't drawn as a big swing.
function lines(el,{cur,prev,fmt,axis,start,peak,span=0}){
  const day=i=>fmtDay(dayDate(start,i)),vals=[...cur,...(prev||[])].filter(v=>v!=null);
  if(!vals.length){el.innerHTML='<div class="empty">No visits yet</div>';return}
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const padL=8,padR=40,padB=22,padT=peak?44:10,n=cur.length;
    let lo=Math.min(...vals),hi=Math.max(...vals);
    if(hi-lo<span){lo=Math.max(0,(lo+hi-span)/2);hi=lo+span}
    // Widen the step until no two gridlines get the same label (36%, 36%, 37% on a flat month).
    // A flat line (a period with no visits) starts from a step of a point, not a millionth, so the loop below doesn't
    // count ten million gridlines; and a line flat at 0 gets one step of room above it, not the whole 0–100%.
    let {step}=nice(Math.max(hi-lo,.01)),min,max;
    for(;;){
      min=Math.floor(lo/step)*step;max=Math.ceil(hi/step)*step||step;
      const labels=[];for(let v=min;v<=max+1e-9;v+=step)labels.push(axis(v));
      if(new Set(labels).size===labels.length)break;
      step*=2;
    }
    const X=i=>padL+i*(W-padL-padR)/Math.max(1,n-1),Y=v=>padT+(H-padT-padB)*(1-(v-min)/((max-min)||1));
    const path=a=>a.map((v,i)=>v==null?'':`${a[i-1]!=null?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    const alone=(a,color)=>a.map((v,i)=>v!=null&&a[i-1]==null&&a[i+1]==null?`<circle cx="${X(i)}" cy="${Y(v)}" r="2" fill="${color}"/>`:'').join('');
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(peak?.aria||'This period compared with the previous one')}">`;
    for(let v=min;v<=max+1e-9;v+=step){const y=Y(v);s+=`<line class="grid-l" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${W}" y="${y+4}" text-anchor="end">${axis(v)}</text>`}
    s+=`<text x="${X(0)}" y="${H-5}">${day(0)}</text><text x="${X(n-1)}" y="${H-5}" text-anchor="end">${day(n-1)}</text>`;
    if(prev)s+=`<path d="${path(prev)}" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/>${alone(prev,'var(--rule)')}`;
    s+=`<path d="${path(cur)}" fill="none" stroke="var(--bnc)" stroke-width="2.2" stroke-linejoin="round"/>${alone(cur,'var(--bnc)')}`;
    if(peak)s+=`<circle cx="${X(peak.i)}" cy="${Y(cur[peak.i])}" r="5" fill="var(--bnc)"/>`;
    s+=`<g class="guide" opacity="0"><line y1="${padT}" y2="${H-padB}" stroke="var(--muted)" stroke-width="1"/><circle r="4" fill="var(--bnc)"/></g>`;
    let html=s+'</svg><div class="tip" hidden></div>';
    if(peak)html+=`<div class="peak" style="${anchorStyle(X(peak.i)/W)}"><b>${esc(peak.title)}</b>${peak.sub?`<br><span>${esc(peak.sub)}</span>`:''}</div>`;
    el.innerHTML=html;
    const g=el.querySelector('.guide'),t=el.querySelector('.tip');
    el.onpointermove=e=>{
      const i=Math.round((e.clientX-el.getBoundingClientRect().left-padL)/((W-padL-padR)/Math.max(1,n-1)));
      if(i<0||i>=n){el.onpointerleave();return}
      const v=cur[i],at=v??(prev?.[i]??lo),said=x=>x==null?'no visits':fmt(x);
      g.setAttribute('opacity',1);g.querySelector('line').setAttribute('x1',X(i));g.querySelector('line').setAttribute('x2',X(i));
      const c=g.querySelector('circle');c.setAttribute('cx',X(i));c.setAttribute('cy',Y(at));c.setAttribute('opacity',v==null?0:1);
      t.hidden=false;t.innerHTML=`${day(i)}: <b>${said(v)}</b>${prev?`<br><span class="muted">${DAYS} days earlier: ${said(prev[i])}</span>`:''}`;
      t.style.left=Math.min(W-t.offsetWidth/2,Math.max(t.offsetWidth/2,X(i)))+'px';t.style.top=Y(at)+'px';
    };
    el.onpointerleave=()=>{g.setAttribute('opacity',0);t.hidden=true};
  });
}

// A waterfall from 0: each step starts where the last ended, then a total bar from 0.
// steps: [{kind:'named'|'mover'|'mix'|'else'|'total', label, value}]
// openOf(step): what clicking that step does (given the button), or null when it opens nothing. Each step that
// opens something gets a button over its bar and labels, as treemap blocks are buttons, so keys reach it too.
function drawSteps(el,steps,{fmt,aria,colorOf,openOf=()=>null}){
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const slot=W/steps.length,fit=Math.max(6,Math.floor(slot/6.6));
    // Names too long for their slot wrap onto a second line at a space, or before a dot ("google" / ".com").
    const names=steps.map(st=>{
      if(st.label.length<=fit)return [st.label];
      const sp=st.label.lastIndexOf(' ',fit),dot=st.label.lastIndexOf('.',fit),cut=sp>0?sp:dot>0?dot:st.label.indexOf(' ');
      return cut>0?[st.label.slice(0,cut),shorten(st.label.slice(cut+(cut===sp?1:0)),fit)]:[shorten(st.label,fit)];
    });
    const padT=26,padB=names.some(n=>n.length>1)?38:24;
    let acc=0;
    const geo=steps.map(s=>{if(s.kind==='total')return {a:0,b:s.value};const a=acc;acc+=s.value;return {a,b:acc}});
    const ends=geo.flatMap(g=>[g.a,g.b]),lo=Math.min(0,...ends),hi=Math.max(0,...ends),span=hi-lo||1;
    const Y=v=>padT+(H-padT-padB)*(hi-v)/span;
    const bw=Math.min(70,slot*.62),x=i=>i*slot+(slot-bw)/2;
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(aria)}"><line x1="0" x2="${W}" y1="${Math.round(Y(0))+.5}" y2="${Math.round(Y(0))+.5}" stroke="var(--rule)"/>`;
    geo.forEach((g,i)=>{
      const st=steps[i],y=Math.min(Y(g.a),Y(g.b)),h=Math.max(2,Math.abs(Y(g.a)-Y(g.b))),total=st.kind==='total';
      s+=`<rect x="${x(i)}" y="${y}" width="${bw}" height="${h}" rx="${h>6?3:0}" fill="${colorOf(st)}"><title>${esc(st.label)}: ${esc(fmt(st.value,total))}</title></rect>`;
      if(i<geo.length-1)s+=`<line x1="${x(i)+bw}" x2="${x(i+1)}" y1="${Y(g.b)}" y2="${Y(g.b)}" stroke="var(--rule)" stroke-dasharray="3 3"/>`;
      s+=`<text x="${x(i)+bw/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="700" fill="${st.kind==='else'?'var(--muted)':'var(--ink)'}">${esc(fmt(st.value,total))}</text>`;
      s+=`<text x="${x(i)+bw/2}" y="${H-padB+18}" text-anchor="middle" font-size="12" fill="${total?'var(--ink)':'var(--muted)'}"${total?' font-weight="600"':''}>${names[i].map((t,k)=>`<tspan x="${x(i)+bw/2}" dy="${k?14:0}">${esc(t)}</tspan>`).join('')}</text>`;
    });
    el.innerHTML=s+'</svg>';
    geo.forEach((g,i)=>{
      const st=steps[i],open=openOf(st);if(!open)return;
      const top=Math.max(0,Math.min(Y(g.a),Y(g.b))-26),b=document.createElement('button');
      b.type='button';b.className='step';b.dataset.key=st.key??st.channel??st.label;b.title=`${st.label}: ${fmt(st.value,st.kind==='total')}`;
      Object.assign(b.style,{left:x(i)-4+'px',top:top+'px',width:bw+8+'px',height:H-top+'px'});
      b.setAttribute('aria-label',`${b.title}. Open`);
      b.onclick=e=>{e.stopPropagation();open(b)};
      el.appendChild(b);
    });
  });
}

// Rows of ten squares: the filled share is how many of every 10 visits left after one page.
let clipN=0;
function squaresSVG(pct,size,gap,fill){
  const k=Math.max(0,Math.min(10,pct*10)),full=Math.floor(k),frac=k-full,r=Math.round(size*.18),w=10*size+9*gap;
  const at=i=>i*(size+gap);
  let s=`<svg width="${w}" height="${size}" aria-hidden="true">`;
  for(let i=0;i<10;i++)s+=`<rect x="${at(i)}" width="${size}" height="${size}" rx="${r}" fill="var(--bnc-p)"/>`;
  for(let i=0;i<full;i++)s+=`<rect x="${at(i)}" width="${size}" height="${size}" rx="${r}" fill="${fill}"/>`;
  if(frac>.02){const id=`sq${++clipN}`;s+=`<clipPath id="${id}"><rect x="${at(full)}" width="${(frac*size).toFixed(1)}" height="${size}"/></clipPath><rect x="${at(full)}" width="${size}" height="${size}" rx="${r}" fill="${fill}" clip-path="url(#${id})"/>`}
  return s+'</svg>';
}
// rows: [{pct, label, story, aria, open}]; pct null (no visits) shows a dash over empty squares.
function drawSquares(el,rows){
  el.innerHTML='<div class="sqs"></div>';
  const box=el.firstChild;
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    // Narrow boxes put the squares on their own line under the number, so they can use the full width.
    const under=W<320,stack=!under&&W<420,text=under?0:stack?72:140,n=rows.length,line=under?22:0;
    // Squares and their gaps shrink together; a gap is about a quarter of a square.
    const size=Math.max(6,Math.min(22,Math.floor((W-text-(under?0:12))/12.1),Math.floor((H-(n-1)*8)/n)-line)),gap=Math.max(2,Math.round(size*.23));
    box.style.gap=Math.min(20,Math.max(6,(H-n*(size+line))/(n+1)))+'px';
    box.replaceChildren(...rows.map(r=>{
      const b=document.createElement('button');b.type='button';b.className='sqrow'+(under?' under':stack?' stack':'');b.dataset.key=r.label;
      b.innerHTML=`<span class="sq-num"${under?'':` style="width:${text}px"`}><b${r.story?' class="told"':''}>${r.pct==null?'–':fmtPct(r.pct)}</b><span class="sq-label" title="${esc(r.label)}">${esc(r.label)}</span></span>${squaresSVG(r.pct||0,size,gap,r.fill||'var(--bnc)')}`;
      b.setAttribute('aria-label',r.aria);
      b.onclick=e=>{e.stopPropagation();r.open(b)};
      return b;
    }));
  });
}

/* ---------- zoom stack ---------- */
const win=$('#win');
const stack=[{el:$('#home'),title:''}];
let animating=false,skipMotion=false,pendingPop=false;

// Every period switch, on home and on each sub-page, does the same: every open view redraws for the new period.
const markPeriods=()=>document.querySelectorAll('.period button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.days)===DAYS));
function bindPeriod(el){
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const d=Number(b.dataset.days);if(d===DAYS)return;
    DAYS=d;markPeriods();
    history.replaceState(history.state,'',urlFor(stack[stack.length-1].vw||null));
    redrawAll(`Showing the last ${DAYS} days`);
  });
  markPeriods();
}
// Sub-pages read what home worked out (its story, its events), so they redraw once home has.
// Resolves true when this redraw is still the current one.
function redrawAll(message){
  const layers=stack.slice(1);
  layers.forEach(s=>s.el.querySelector('.layer-body').classList.add('busy'));
  return renderHome(stack.length>1?'':message).then(async current=>{
    layers.forEach(s=>s.el.querySelector('.layer-body').classList.remove('busy'));
    if(!current)return false;
    await Promise.all(stack.slice(1).map(s=>s.render?.(s.el.querySelector('.layer-body'))));
    if(stack.length>1&&message)announce(message);
    return true;
  });
}
const PERIOD='<div class="period" role="group" aria-label="Show the last"><button type="button" data-days="7">7 days</button><button type="button" data-days="30">30 days</button></div>';

function zoom(src,{title,render,chip,vw=null,instant=false,fromHistory=false}){
  if(animating)return;
  animating=true;
  grow(false);
  const parent=stack[stack.length-1].el;
  const crumb=stack.map(s=>s.title).join(' › ');
  const layer=document.createElement('section');
  layer.className='layer';
  layer.setAttribute('role','dialog');layer.setAttribute('aria-label',title);
  layer.innerHTML=`<div class="inner"><header class="layer-head"><button class="circle back" aria-label="Back">${BACK}</button>
    <div class="crumbs"><span>${esc(crumb)} ›</span><h2>${esc(title)}</h2></div>${chip?`<span class="chip">${esc(chip)}</span>`:PERIOD}</header>
    <div class="layer-body"></div></div>`;
  layer.style.visibility='hidden';
  win.appendChild(layer);
  layer.querySelector('.back').onclick=goBack;
  if(!chip)bindPeriod(layer.querySelector('.period'));
  stack.push({el:layer,src,title,render,vw});
  if(!fromHistory)history.pushState({depth:stack.length-1},'',urlFor(vw));
  skipMotion=instant;
  const ready=render(layer.querySelector('.layer-body'));
  // Wait briefly for the content, so the window takes its final height before the zoom starts
  // instead of jumping once the animation has ended.
  Promise.race([ready,new Promise(r=>setTimeout(r,300))]).then(()=>{
    // Closed before it showed (a site with no visits yet, opened at a view's address).
    if(!layer.isConnected){animating=false;return}
    layer.style.visibility='';
    const h0=win.offsetHeight;
    grow(true);
    run(parent,layer,src,true,h0);
  });
}
// Scrolls the page to the top smoothly and resolves when it gets there, so a view change never starts with a jump.
function scrollHome(){
  return new Promise(res=>{
    if(scrollY<1||motion.matches){scrollTo(0,0);res();return}
    scrollTo({top:0,behavior:'smooth'});
    const t0=performance.now(),check=()=>scrollY<1||performance.now()-t0>800?res():requestAnimationFrame(check);
    requestAnimationFrame(check);
  });
}
// The top sub-page leaves the window's fixed frame and takes the room its content needs.
// Home keeps its own height underneath, so it doesn't stretch while it zooms away.
function grow(on){
  for(const s of stack)s.el.classList.remove('grown'),s.el.style.minHeight='';
  win.classList.remove('grow');win.style.minHeight='';stack[0].el.style.height='';
  if(!on||stack.length<2)return;
  const homeH=win.offsetHeight,top=stack[stack.length-1].el;
  // On phones the window is as long as the home screen, so a sub-page only needs to fill the screen.
  const h=Math.min(homeH,Math.max(innerHeight-48,860));
  stack[0].el.style.height=homeH+'px';
  win.style.minHeight=top.style.minHeight=h+'px';
  win.classList.add('grow');top.classList.add('grown');
}
async function back(){
  if(animating||stack.length<2)return;
  animating=true;
  // Back to the top of the sub-page first, so the zoom out starts from what it looked like when it opened.
  await scrollHome();
  const h0=win.offsetHeight;
  const {el:layer,src}=stack.pop(),parent=stack[stack.length-1].el;
  layer.classList.remove('grown');layer.style.minHeight='';
  grow(true);
  parent.style.visibility='';parent.inert=false;
  run(parent,layer,src,false,h0);
}
// Tiles are not focusable themselves, so focus returns to their title button.
const focusTarget=src=>src.classList.contains('tile')?src.querySelector('.tile-title'):src;
// h0: the window's height before this change; it eases to the new height with the zoom instead of snapping.
function run(parent,layer,src,opening,h0){
  const done=()=>{
    animating=false;
    // The entry may be from before a period or site change; the address says what's on screen now.
    if(pendingPop){pendingPop=false;queueMicrotask(followHistory)}
    else if((history.state?.depth||0)===stack.length-1)history.replaceState(history.state,'',urlFor(stack[stack.length-1].vw||null));
    if(opening){parent.style.visibility='hidden';parent.inert=true;layer.querySelector('.back').focus({preventScroll:true});scrollHome()}
    else{
      release(layer);layer.remove();
      // The element that opened the layer may have been redrawn meanwhile; fall back to the layer below.
      const to=src.isConnected?focusTarget(src):parent.querySelector('.back')||parent.querySelector('.tile-title');
      to?.focus({preventScroll:true});
      // Back where the reader was, if the element they opened sits below the fold.
      if(to&&to.getBoundingClientRect().bottom>innerHeight)to.scrollIntoView({block:'center',behavior:motion.matches?'auto':'smooth'});
    }
  };
  if(motion.matches||skipMotion||!src.isConnected){skipMotion=false;done();return}
  animating=true;
  const wr=win.getBoundingClientRect(),r=src.getBoundingClientRect();
  const t=r.top-wr.top,l=r.left-wr.left,rr=wr.right-r.right,b=wr.bottom-r.bottom;
  const rad=parseFloat(getComputedStyle(src).borderRadius)||12;
  const ox=l+r.width/2,oy=t+r.height/2,dx=ox-wr.width/2,dy=oy-wr.height/2;
  const s=Math.max(.3,Math.min(r.width/wr.width,r.height/wr.height));
  const opt={duration:opening?560:480,easing:'cubic-bezier(.22,.9,.24,1)',direction:opening?'normal':'reverse',fill:'both'};

  // The tile's own preview grows and fades while the detail view fades in behind it.
  const ghost=src.cloneNode(true);
  ghost.removeAttribute('id');ghost.setAttribute('aria-hidden','true');ghost.classList.add('ghost');
  Object.assign(ghost.style,{left:l+'px',top:t+'px',width:r.width+'px',height:r.height+'px',right:'auto',bottom:'auto',transform:'none'});
  layer.appendChild(ghost);
  const inner=layer.querySelector('.inner');

  parent.style.transformOrigin=`${ox}px ${oy}px`;
  const anims=[
    layer.animate([{clipPath:`inset(${t}px ${rr}px ${b}px ${l}px round ${rad}px)`},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],opt),
    inner.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`},{transform:'none'}],opt),
    inner.animate([{opacity:0},{opacity:0,offset:.18},{opacity:1}],opt),
    ghost.animate([{transform:'none',opacity:1},{transform:`translate(${-dx}px,${-dy}px) scale(${1/s})`,opacity:0,offset:.55},{transform:`translate(${-dx}px,${-dy}px) scale(${1/s})`,opacity:0}],opt),
    parent.animate([{transform:'none',opacity:1},{transform:'scale(1.08)',opacity:.5}],opt),
  ];
  const h1=win.offsetHeight;
  if(h0&&h0!==h1)anims.push(win.animate([{height:h0+'px'},{height:h1+'px'}],{duration:opt.duration,easing:opt.easing}));
  anims[0].finished.then(()=>{anims.forEach(a=>a.cancel());ghost.remove();parent.style.transformOrigin='';done()});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});
// Zooming out goes through the browser's history, so the back button and the dashboard's own back agree.
function goBack(){if(animating||stack.length<2)return;if((history.state?.depth||0)>0)history.back();else back()}
// A Back pressed while a zoom is still moving waits for it to finish, so no press is lost.
function followHistory(){
  if(animating){pendingPop=true;return}
  const depth=history.state?.depth||0;
  if(depth<stack.length-1){
    // Several steps back at once: the layers in between go without a zoom of their own.
    while(stack.length-2>depth){const [s]=stack.splice(stack.length-2,1);release(s.el);s.el.remove()}
    back();
  }
  else if(depth>stack.length-1){const {view:vw}=urlToView(location.pathname,location.search);if(vw)openView(vw,stack[stack.length-1].el,{fromHistory:true})}
}
addEventListener('popstate',followHistory);

/* ---------- views ---------- */
// Each draw of a view gets a number; renderers check it after waiting, so an older, slower reply never
// overwrites a newer one (switching 7 → 30 → 7 days quickly, say).
const stale=(body,gen)=>gen!==body._gen;
async function view(body,fn){
  release(body);
  const gen=body._gen=(body._gen|0)+1;
  body.innerHTML='<div class="state">Loading…</div>';
  try{await fn(body)}catch(e){if(!stale(body,gen))showError(body,e,()=>view(body,fn))}
}

// subj colours the bar after each name (its length is the value against the largest row).
// goalable: rows are pages, and each gets a flag to track it as a goal.
// named: keys this page's own sentence names; they are bold, as in every list.
// share: how the share column is written (fmtShare, or a tenth of a point where every share is small).
function rowsInto(group,rows,{fmt=fmtInt,total,inverse=false,onClick,subj='time',goalable=false,named=new Set(),share=fmtShare}){
  if(!rows.length){group.innerHTML='<div class="muted">No visitors yet.</div>';return}
  const max=maxOf(rows.map(r=>r.value))||1;
  group.className='list';
  const head=document.createElement('div');head.className='lrow lhead';head.setAttribute('aria-hidden','true');
  head.innerHTML='<span></span><span></span><span>visitors</span><span>share</span><span>change</span><span></span>';
  const flagged=el=>{
    if(!goalable||SHARED)return el;
    const w=document.createElement('div');w.className='lwrap';
    const t=document.createElement(el===head?'span':'button');
    if(el!==head){t.type='button';t.className='goal-t';t.dataset.path=el.dataset.key;paintGoalToggle(t);t.onclick=()=>toggleGoal(t.dataset.path)}
    w.append(t,el);return w;
  };
  group.replaceChildren(flagged(head),...rows.map(r=>{
    const el=document.createElement(onClick?'button':'div');
    if(onClick)el.type='button';
    el.className='lrow';el.dataset.key=r.key;
    el.innerHTML=`<span class="name"><span class="lbl">${named.has(r.key)?`<b>${esc(r.label)}</b>`:esc(r.label)}</span>${r.sub?`<small>${esc(r.sub)}</small>`:''}</span>
      <span class="bar"><i style="width:${(r.value/max*100).toFixed(1)}%;background:var(--${subj})"></i></span>
      <span class="num">${fmt(r.value)}</span><span class="pct">${share(r.value,total)}</span>
      ${delta(r.value,r.prev,inverse)}${onClick?CHEV:'<span></span>'}`;
    if(onClick){el.setAttribute('aria-label',`${rowLabel(r.label,r.value,r.prev,total)}. Open`);el.onclick=()=>onClick(r,el)}
    return flagged(el);
  }));
}

// Rates as rows of ten squares, Lede's bounce mark, with last period's value beside them; the named one bold. Each
// row says its visits, so a high rate on a few visits reads as what it is.
function rateRows(group,rows){
  if(!rows.length){group.innerHTML='<div class="muted">No visitors yet.</div>';return}
  group.className='list';
  const head=document.createElement('div');head.className='lrow rate lhead';head.setAttribute('aria-hidden','true');
  head.innerHTML='<span></span><span></span><span>bounce</span><span>change</span><span></span>';

// Every view is described by a small object ({v:'bounce'}, {v:'filter',f:{path}}…) that routes.js turns into its
// address; all ways into a view go through openView, so each one gets its URL and a refresh reopens it.
function viewOptions(vw){
  switch(vw.v){
    case 'overview':return {title:'Overview',render:b=>view(b,x=>renderFilter(x,{}))};
    case 'bounce':return {title:'Bounce',render:b=>view(b,renderBounce)};
    case 'online':return {title:'Online',chip:'Live',render:b=>view(b,renderOnline)};
    case 'sources':case 'pages':return {title:vw.v[0].toUpperCase()+vw.v.slice(1),render:b=>view(b,x=>renderDim(x,vw.v))};
    case 'events':return {title:'What happened',render:b=>view(b,async x=>{await homeDrawn;const H=home();if(H)renderEvents(x,vw.pick?H.events.filter(vw.pick):H.events,H.ser);else x.innerHTML=''})};
    case 'filter':{
      const f=vw.f,source=(f.referrer!=null)!==(f.channel!=null)&&f.path==null;
      const title=vw.label||(f.path!=null?f.path:f.channel!=null?labelOf('channel',f.channel):labelOf('referrer',f.referrer));
      return {title:source?(f.channel!=null?labelOf('channel',f.channel):labelOf('referrer',f.referrer)):f.path==='/'&&f.referrer==null&&f.channel==null?'Home page':title,render:b=>view(b,x=>source?renderSource(x,f):renderFilter(x,f))};
    }
  }
  return null;
}
function openView(vw,src,opts={}){
  // A source with a channel beside it (/sources/google.com?channel=search) is the source's view: its numbers
  // are that source's, so naming the channel would credit them to every source in it.
  if(vw.v==='filter'&&vw.f.path==null&&vw.f.referrer!=null&&vw.f.channel!=null)vw={...vw,f:{referrer:vw.f.referrer}};
  const o=viewOptions(vw);if(o)zoom(src,{...o,vw,...opts});
}
const urlFor=vw=>viewToUrl(vw,{days:DAYS,site:SITES.length>1?SITE:null});
const openFilter=(f,label,src)=>openView({v:'filter',f,label},src);
const openOverview=src=>openView({v:'overview'},src);
const openBounce=src=>openView({v:'bounce'},src);
const openOnline=src=>openView({v:'online'},src);

// A card's switch between lists: names, the one on at first; pick(i) runs on a press.
const segHTML=(label,names,on=0)=>`<div class="seg" role="group" aria-label="${label}">${names.map((l,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===on}">${l}</button>`).join('')}</div>`;
function onSeg(sec,pick){
  const bs=[...sec.querySelectorAll('.seg button')];
  bs.forEach(bt=>bt.onclick=()=>{bs.forEach(x=>x.setAttribute('aria-pressed',x===bt));pick(+bt.dataset.i)});
}

// A card listing pages or sources for filter f; the full view adds a switch between ways of counting.
// boldKeys: the keys the page's sentence names (channels as ch:key, like the home sentence's).
// engagement: the pages' reading times (/api/engagement), for a list of pages viewed to say how long each is read.
function dimSection(sec,group,f,compact,boldKeys=null,engagement=null){
  const modes=group==='pages'?[['Viewed','path'],['Landed on','entry'],['Left on','exit']]:[['Sites','referrer'],['Channels','channel']];
  let mode=modes[0][1];
  sec.className='card';
  sec.innerHTML=`<div class="card-head">${compact?`<div class="card-title">${group==='pages'?'Pages':'Sources'}</div>`:''}
    ${compact?'':segHTML('Breakdown',modes.map(m=>m[0]))}</div>
    <div class="dim-body"></div>`;
  const body=sec.querySelector('.dim-body');
  let gen=0;
  const draw=()=>{const g=++gen;return view(body,async b=>{
    const [data,eng]=await Promise.all([api('breakdown',{...filterParams(f),dim:mode}),mode==='path'&&engagement?engagement:null]);
    if(g!==gen)return;
    const read=new Map((eng?.rows||[]).filter(e=>e.median!=null&&e.views>=20).map(e=>[e.key,`${fmtDur(e.median/1000)} read`]));
    // The full list of sites says which channel each is in, so search, social and AI readers can be told apart at a
    // glance; the list of pages viewed, how long half their readers stay, so a big page that isn't read shows.
    const rows=data.rows.map(r=>({key:r.key,dim:mode,label:labelOf(mode,r.key),value:r.visitors,prev:r.prev?.visitors,sub:mode==='referrer'&&!compact&&r.channel&&r.key?labelOf('channel',r.channel):read.get(r.key)||''}));
    const total=rows.reduce((a,r)=>a+r.value,0);
    const go=r=>el=>openFilter({...f,[FILTER_OF[r.dim]]:r.key},r.label,el);
    b.innerHTML='<div></div>';
    // A list with nothing of its own to bold, on a view with no filter, bolds what home's sentence names.
    const H=home(),overview=compact&&f.path==null&&f.referrer==null&&f.channel==null&&H;
    const named=new Set(boldKeys?rows.filter(r=>boldKeys.has(r.dim==='channel'?'ch:'+r.key:r.key)).map(r=>r.key)
      :overview?rows.filter(r=>r.dim==='channel'?H.T.told.has('ch:'+r.key):r.dim==='referrer'?H.T.told.has(r.key):r.key===H.T.page).map(r=>r.key):[]);
    rowsInto(b.firstChild,compact?rows.slice(0,8):rows,{total,subj:group==='pages'?'page':'src',goalable:group==='pages',named,onClick:(r,el)=>go(r)(el)});
    if(compact&&rows.length>8){
      const more=document.createElement('button');more.type='button';more.className='more-link';more.innerHTML=`<span>All ${rows.length} ${group}</span>${CHEV}`;
      more.onclick=()=>openView({v:group},more);
      b.appendChild(more);
    }
  })};
  onSeg(sec,i=>{mode=modes[i][1];draw()});
  return draw();
}

// The top of every slice: one big number, then the rest, straight on the page.
// With nothing before to compare with, the count stands alone rather than reading "visitors new"; so it does when
// only one period crosses a month start (unitOf), and the visits beside it carry the change.
const heroSub=t=>`visitors${t.prev.visitors&&unitOf(t)==='visitors'?` <b>${changeWord(t.cur.visitors,t.prev.visitors)}</b>`:''}`;
const heroHTML=t=>`<div class="nums"><div class="hero"><span class="big">${fmtInt(t.cur.visitors)}</span><span>${heroSub(t)}</span></div>${numsHTML(t.cur,t.prev)}</div>`;
// Links in a generated sentence open the slice they name.
function bindLinks(root){
  root.querySelectorAll('.link').forEach(b=>{
    b.onclick=()=>openFilter({[b.dataset.f]:b.dataset.k},b.textContent,b);
    // A link is a button, so a full stop right after it could wrap onto a line of its own; keep them together.
    const t=b.nextSibling,m=t?.nodeType===3&&t.data.match(/^[.,;:]/);
    if(m){const w=document.createElement('span');w.style.whiteSpace='nowrap';b.replaceWith(w);w.append(b,m[0]);t.data=t.data.slice(1)}
  });
}

// The overview, a page, or a channel: the sentence, the numbers, visitors per day, then what's inside.
async function renderFilter(body,f){
  const gen=body._gen,p=filterParams(f),overview=f.path==null&&f.referrer==null&&f.channel==null;
  // The hours are one card of many, so the overview draws without them.
  const [totals,ser,hourly,flows,all]=await Promise.all([api('summary',p),api('series',p),overview?api('hourly',HOURS).catch(()=>null):null,f.path!=null?api('flows',{referrer:f.referrer,channel:f.channel}):null,f.channel!=null?api('summary'):null,homeDrawn]);
  if(stale(body,gen))return;
  const H=home();
  const c=totals.cur,pr=totals.prev;
  const into=flows?flows.flows.filter(x=>x.page===f.path):[];
  // A single page's chart marks the events about that page, the way the overview marks all of them.
  const pick=e=>e.kind==='page'&&e.key===f.path,own=H&&f.path!=null&&f.referrer==null&&f.channel==null?H.events.filter(pick):[];
  // The overview's own lead is what stood out in the period, the list just under the chart; home already told its sentence.
  const say=overview?eventsSentence(H?.events||[],DAYS,ser.start):f.path!=null?pageStory(totals,into,f.path,DAYS,f.referrer==null&&f.channel==null&&H?{cur:H.S.c,prev:H.S.p}:null)
    :sourceStory(totals,ser,labelOf('channel',f.channel),DAYS).html+(all?' '+(channelShare(totals,all,labelOf('channel',f.channel))||''):'');

    <section class="card"><div class="card-head"><div class="card-title">Visitors per day${pr.visitors?`, against the ${DAYS} days before`:''}</div></div><div class="chart"></div>${overview&&H?'<div class="marks"></div>':own.length?'<div class="marks own"></div>':''}</section>
    ${overview&&H?`<section class="card"><div class="card-title">What happened</div>${H.events.length?'<div class="events-list"></div>':`<p class="muted" style="margin:0">Nothing unusual in the last ${DAYS} days.</p>`}</section>`:''}
    ${overview&&H?'<section class="card inout"></section>':''}
    ${f.path!=null?'<section class="card"><div class="card-title">Where readers came from, and where they went next</div><p class="cross-say"></p><div class="cross-k" aria-hidden="true"><span>visitors</span><span></span></div><div class="landed cross"></div><p class="say-sub landed-note"></p></section>':''}
    ${f.path!=null&&f.path!=='/'?'<section class="card goal-card" hidden></section>':''}
    ${f.path==null&&!overview?'<section data-group="pages"></section>':''}
    ${f.referrer==null&&f.path==null&&!overview?'<section data-group="sources"></section>':''}
    ${overview?'<section class="card kw" hidden></section><section class="card aud" hidden></section><section class="card"><div class="card-title heat-title">By weekday and hour</div><p class="card-say heat-say"></p><div class="chart"></div></section><section class="card funnels-card" hidden></section>':''}`;
  bindLinks(body.querySelector('.say'));
  const cur=ser.cur.visitors,busiest=cur.indexOf(maxOf(cur));
  // On the overview the markers row carries the dates, as on home.
  const marks=body.querySelector('.marks:not(.own)'),ownMarks=body.querySelector('.marks.own');
  if(marks){drawDays(body.querySelector('.chart'),H.S,H.ser,{scale:true,note:!SHARED});noteDays(body.querySelector('.chart'),H.ser)}
  else{
    const spike=findSpike(cur,ser.start),usual=median(cur);
    const label=spike>=0?{i:spike,title:`${fmtDate(dayDate(ser.start,spike))} · ${fmtInt(cur[spike])}`,sub:`${Math.round(cur[spike]/(usual||1))}× a usual day`}:null;
    dayBars(body.querySelector('.chart'),{cur,prev:pr.visitors?ser.prev.visitors:null,start:ser.start,axis:!ownMarks,scale:true,label,subj:f.path!=null?'page':f.channel!=null?'src':'time',
      aria:`Visitors per day. Busiest: ${fmtDate(dayDate(ser.start,busiest))} with ${fmtInt(cur[busiest])}.`});
  }
  if(ownMarks)drawMarks(ownMarks,own,H.ser,pick);
  if(overview&&H){
    const charts=body.querySelectorAll('.chart');
    if(drawHeat(charts[1],H.S,H.ser,lastDays(hourly,DAYS))&&H.S.spike>=0)
      body.querySelector('.heat-title').innerHTML+=` · <span class="ring"></span> hours when most visitors came on ${fmtDate(dayDate(H.ser.start,H.S.spike))}`;
  }
  if(overview)drawFunnels(body,gen);
  if(marks){

    body.querySelector('.events-list')?.replaceChildren(...H.events.map(e=>eventButton(e,H.ser,true)));

  if(f.path!=null){

    // Once its speed is known, whether the page is slow (see the engagement below).
    body._verdict=S=>{body.querySelector('.verdict').innerHTML=pageVerdict(S)||''};
    // The page's sentence names the source most of its visitors arrived from; that one is emphasised.
    const by=new Map();for(const x of into)by.set(x.source,(by.get(x.source)||0)+x.visitors);
    const lead=[...by].sort((a,b)=>b[1]-a[1])[0];
    const landed=sum(into.map(x=>x.visitors)),cross=body.querySelector('.cross'),note=body.querySelector('.landed-note');
    const from=cameFromItems(into,new Set(lead&&landed>=20?[lead[0]]:[]),c.visitors);

      if(stale(body,gen))return;

  }
  body.querySelectorAll('[data-group]').forEach(sec=>dimSection(sec,sec.dataset.group,f,true));

    const r=e.rows.find(x=>x.key===f.path);
    if(stale(body,gen)||!r?.views)return;
    const n=(k,v,sub,tip)=>`<div class="num" title="${tip}"><span class="k">${k}</span><span class="v">${v}</span><span class="delta">${sub}</span></div>`;
    // The middle view, when the answer has it: a few tabs left open for hours pull an average far from most readers.
    const mid=r.median!=null,time=x=>!x?null:mid?(x.median!=null?x.median/1000:null):x.time,t=time(r),was=time(r.prev);
    body.querySelector('.nums').insertAdjacentHTML('beforeend',
      n('Time on page',fmtDur(t),!r.prev?'new':was==null?'':changeWord(t,was),mid?'Half the views had this page open and in view for longer than this':'Average time people had this page open and in view')
      +n('How far down',fmtPct(r.scroll),r.prev?pts(r.scroll,r.prev.scroll):'new','How far down the page people got, on average'));
    drawReach(body,r,f.path);
    const S=speedStory(r,f.path,e.rows),V=!S&&vitalsLine(r);

  },()=>{});
  if(overview)api('audience').then(A=>{if(!stale(body,gen))drawAudience(body.querySelector('.aud'),A)},()=>{});
  if(overview)api('keywords').then(K=>{if(!stale(body,gen))drawKeywords(body.querySelector('.kw'),K)},()=>{});
  if(overview||f.path!=null)api('links',p).then(L=>{if(!stale(body,gen))drawLinks(body,L,c.visitors)},()=>{});
}

// The overview's sources and pages, one strip each, from the rows home already has: led by what home's sentence left
// out on each side, the row it names solid and the rest faded, as on the audience card; each label opens its row.
function drawInOut(sec,H){
  const src=findings(H.S,H.T.told,`the ${DAYS} days before`)[0],pg=pagesFinding(H.pageRows,H.T.page);
  const said=[src,pg].filter(Boolean).map(x=>x.html.replace(/\.?$/,'.')).join(' ');

  if(said)bindLinks(sec.querySelector('.card-say'));
  const io=sec.querySelector('.io');
  const sources=H.S.sources.filter(s=>s.value>0).sort((a,b)=>b.value-a.value);
  [[sources,'Sources','sources','referrer','src',src?.key],[H.pageRows.filter(r=>r.value>0),'Pages','pages','path','page',pg?.key]].forEach(([rows,title,group,f,subj,named])=>{
    const all=sum(rows.map(r=>r.value)),on=rows.find(r=>r.key===named),far=rows.indexOf(on)>3;
    const top=rows.slice(0,far?3:4).concat(far?[on]:[]),rest=all-sum(top.map(r=>r.value));
    io.insertAdjacentHTML('beforeend',`<span class="k">${title}</span><div class="strip" aria-hidden="true">${top.map(r=>`<i style="flex:${r.value};background:var(--${subj}${r===on?'':'-t'})" title="${esc(r.label)}"></i>`).join('')}${rest>0?`<i style="flex:${rest};background:var(--${subj}-p)"></i>`:''}</div><p></p>`);
    const p=io.lastChild;
    for(const r of top){
      const b=document.createElement('button');b.type='button';b.className='io-k';
      b.innerHTML=r===on?`<span class="sw" style="background:var(--${subj})"></span><b>${esc(r.label)}</b> ${fmtShare(r.value,all)}<small>${change(r.value,r.prev)}</small>`:`${esc(r.label)} ${fmtShare(r.value,all)}`;
      b.setAttribute('aria-label',`${rowLabel(r.label,r.value,r.prev,all)}. Open`);b.onclick=()=>openFilter({[f]:r.key},r.label,b);p.append(b);
    }
    const more=document.createElement('button');more.type='button';more.className='io-k io-more';more.textContent=`All ${rows.length} ${group} ›`;more.onclick=()=>openView({v:group},more);p.append(more);
  });
}
// How far down the page is read, over a picture of the page: darker further down where fewer still read, a
// violet line where the sentence names the drop. The sentence and the shares either side of the drop draw at once;
// the picture (or the page's share picture) takes their place when it comes, and without one they stay. Too few
// reads get the sentence alone.
function drawReach(body,r,path){
  const S=scrollStory(r),P=scrollPicture(r),N=scrollNumbers(r);if(!S)return;
  const sec=document.createElement('section');sec.className='card reach-card';

    <div class="reach-nums">${N.map(x=>`<div class="num"><span class="v${x.drop?' t-drop':''}">${x.value}</span><span class="k">${x.label}</span></div>`).join('')}</div>
    <div class="shotwrap" hidden><div class="shot" role="img" aria-label="${esc(P.aria)}"><div class="shade" style="background:${shade}"></div>${P.bands.map((t,i)=>`<i style="top:${i*10}%" title="${t}"></i>`).join('')}${P.drop?`<b style="top:${P.drop.at*100}%"></b>`:''}</div>
      <div class="ticks" aria-hidden="true"><span class="t-top" style="top:0">${P.top}</span>${P.drop?`<span class="t-drop" style="top:${P.drop.at*100}%">${P.drop.label}</span>`:''}<span class="t-end" style="top:100%">${P.end}</span></div></div>
    <figcaption class="say-sub">${pictureCaption({path,days:DAYS,kind:'wait'})}</figcaption></figure>`}</div>`;
  body.querySelector('.nums').after(sec);

// How fast the page loads, as a visit: waiting, then reading (see .wr). After the reading card when there is one.
function drawSpeed(body,S,path){
  const px=t=>Math.round(Math.min(10,t)*16)+'px',sec=document.createElement('section');sec.className='card speed-card';
  const aria=`Readers wait ${S.wait.toFixed(1)} seconds for the main content${S.moved?`, ${S.was.toFixed(1)} before`:''}, then read for ${fmtDur(S.read)}.`;

    <div class="wr" role="img" aria-label="${esc(aria)}" title="${esc(VITALS_HINT)}" style="--wait:${px(S.wait)};--was:${S.was!=null?px(S.was):'0px'}">

      <span class="wr-v"><b>${S.wait.toFixed(1)} s<span class="wr-rate">${S.rating}</span></b>${S.moved?`<span>${S.was.toFixed(1)} s before</span>`:''}</span><span class="wr-v"><b>${S.read>=1?fmtDur(S.read):'–'}</b></span>
    </div><p class="say-sub" title="${esc([S.layout,VITALS_HINT].filter(Boolean).join(' '))}">${S.note}</p>`;

// The day's picture of the page, kept by the Worker (src/shot.js). It keeps the page's shape: as tall as the
// column, or, for a short page, as wide as it may be.
async function showPicture(sec,path){
  const shot=sec.querySelector('.shot'),cap=sec.querySelector('figcaption'),site=SITE;
  const say=(kind,why)=>{cap.innerHTML=pictureCaption({path,days:DAYS,kind,why})};
  const place=(src,kind,why,failed)=>{
    const img=new Image();img.alt='';
    img.onload=()=>{
      if(!sec.isConnected)return;
      sec.querySelector('.reach-nums').remove();shot.parentNode.hidden=false;
      const h=shot.offsetHeight,w=Math.min(280,Math.max(40,h*img.naturalWidth/img.naturalHeight));
      shot.style.width=w+'px';shot.style.height=Math.min(h,w*img.naturalHeight/img.naturalWidth)+'px';
      shot.prepend(img);requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.add('in')));
      say(kind,why);
    };
    img.onerror=failed;img.src=src;
  };
  try{
    const res=await fetch(`/api/shot?${new URLSearchParams({site,path})}`);
    if(!sec.isConnected||site!==SITE)return;
    if((res.headers.get('Content-Type')||'').startsWith('image/'))return place(URL.createObjectURL(await res.blob()),'shot',null,()=>say('none','failed'));
    const b=await res.json();
    if(!res.ok)return say('none','failed');
    if(b.og)return place(b.og,'og',b.why,()=>say('none',b.why));
    say('none',b.why);
  }catch{if(sec.isConnected)say('none','failed')}
}

// Where readers are and what they use: the finding, then each list as one strip of shares, the row it names solid.

    const rows=A[dim].filter(r=>r.visitors),all=sum(rows.map(r=>r.visitors)),on=rows.find(r=>dim==S.dim&&r.key==S.key),far=rows.indexOf(on)>3;

// Links to other sites and files people clicked, as a share of the visitors; a switch when there are both.

// Sources open with where the change came from; pages with the page that moved most, and one slow for many readers.

// The overview's card: the first funnel's sentence, a chart per funnel, then the field to add one.
async function drawFunnels(body,gen){
  const sec=body.querySelector('.funnels-card');
  await goalsReady;
  const funnels=FUNNELS;let data;
  // A shared link shows the owner's funnels, but adds or removes none.
  if(SHARED&&!funnels.length){sec.hidden=true;return}
  try{data=await Promise.all(funnels.map(steps=>api('funnel',{steps})))}catch{return}
  if(stale(body,gen))return;
  const stories=data.map(f=>funnelStory(f,DAYS));
  sec.innerHTML=`<div class="card-title">Funnels</div><p class="card-say">${stories[0]?.html||FUNNEL_EMPTY}</p>
    ${data.map((f,i)=>`<div class="card-head fun-head"><span class="goal-text">${esc(funnelName(f.steps))}</span>${SHARED?'':'<button type="button" class="link goal-text">Remove</button>'}</div>${i?`<p class="goal-text">${stories[i].html}</p>`:''}<div class="steps"></div>`).join('')}
    ${funnels.length<5&&!SHARED?`<form novalidate><div class="add"><input name="steps" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="/pricing, /signup, /thanks" aria-label="Pages, in order"><button class="retry">Save</button></div><span class="err" role="alert"></span></form>`:''}`;
  sec.hidden=false;
  // Resolves to null once saved, else what went wrong: the server's reason, or a connection that failed.
  const save=async(list,done)=>{
    const r=await fetch(`/api/funnels?site=${encodeURIComponent(SITE)}`,{method:'PUT',body:JSON.stringify({funnels:list})}).catch(()=>null);
    if(!r?.ok)return (r&&(await r.json().catch(()=>({}))).error)||'Couldn’t save the funnel. Check your connection, then try again.';
    FUNNELS=list;announce(done);drawFunnels(body,gen);return null;
  };
  sec.querySelectorAll('.steps').forEach((el,i)=>drawFunnel(el,data[i],stories[i].drop));
  sec.querySelectorAll('.fun-head button').forEach((b,i)=>{
    b.setAttribute('aria-label',`Remove the funnel from ${funnelName([funnels[i][0]])} to ${funnelName([funnels[i].at(-1)])}`);
    b.onclick=async()=>{const e=await save(funnels.filter((_,j)=>j!==i),'Funnel removed');if(e)toast(e)};
  });
  const form=sec.querySelector('form');if(!form)return;
  const input=form.steps,err=form.querySelector('.err');
  input.value=funnelOffer(HOME?.pageRows||[],GOALS,funnels);
  input.oninput=()=>{err.textContent=''};
  form.onsubmit=async e=>{
    e.preventDefault();
    const p=parseSteps(input.value);
    if(p.error){err.textContent=p.error;return}
    const e2=await save([...funnels,p.steps],'Funnel saved');if(e2)err.textContent=e2;
  };
}

// A row per step against the first step's visits: the visits that got there in violet, those lost on the way in

function drawFunnel(el,f,drop){
  const {steps,cur}=f;
  if(!cur[0]){el.innerHTML='<div class="empty">No visits yet</div>';return}
  const B=funnelBars(cur,drop,100);
  el.innerHTML=`<div class="fsteps">${B.map((b,i)=>{
    const kept=b.v/cur[0]*100,gone=i?(cur[i-1]-b.v)/cur[0]*100:0,inside=gone>15;
    return `<button type="button" class="step-n" data-i="${i}">${esc(funnelName([steps[i]]))}</button><div class="tr" aria-hidden="true"><i class="kept" style="width:${kept}%"></i>${i?`<i class="gone${b.hot?' hot':''}" style="width:${gone}%">${inside?`<span>${b.said}</span>`:''}</i>${inside?'':`<span class="lbl">${b.said}</span>`}`:''}</div>
      <span class="v">${fmtInt(b.v)}${i?`<small>${b.share} of the first</small>`:''}</span>`;

}
// A rate's change in percentage points: +2 points, or "same".
const pts=(c,p)=>{const d=Math.round((c-p)*100);return d?`${d>0?'+':'−'}${Math.abs(d)} ${Math.abs(d)===1?'point':'points'}`:'same'};
// The link to the bounce page says what bounce did overall, not what it did for this slice.
const bounceLink=()=>{const H=home(),d=H?Math.round((H.S.c.bounce-H.S.p.bounce)*100):0;return `<span>${d>0?'Why bounce rose':d<0?'Why bounce fell':'Bounce by source'}</span>${CHEV}`};
const numsHTML=(c,pr,{story=false}={})=>{
  const n=(k,v,sub,told)=>`<div class="num"><span class="k">${k}</span><span class="v${told?' told':''}">${v}</span><span class="delta">${sub}</span></div>`;
  // With no visits there is no rate or time to show; a 0% bounce and its change would be made up.
  const ch=changeWord,none=!c.visits;
  return n('Visits',fmtInt(c.visits),ch(c.visits,pr.visits))+n('Views',fmtInt(c.views),ch(c.views,pr.views))
    +n('Bounce',none?'–':fmtPct(c.bounce),none?'':pr.visits?pts(c.bounce,pr.bounce):'new',story)
    +n('Time on site',none?'–':fmtDur(c.duration),none?'':ch(c.duration,pr.duration));
};

// One source or one channel: how many came and when, where they landed, and whether they stayed.

  // What this source's own readers did: the page that moved most with them, and one they read far more than everyone.
  const own=pages.rows.map(r=>({key:r.key,value:r.visitors,prev:r.prev?.visitors})),moved=pagesFinding(own),more=H&&readsMore(pages.rows,H.pageRows,label);

    <div class="nums"><div class="hero"><span class="big">${fmtInt(c.visitors)}</span><span>${heroSub(totals)}</span></div>${numsHTML(c,pr,{story:bouncy})}</div>

    ${channel?'<section class="card"><div class="card-title">Sources in this channel</div><div class="members"></div></section>':''}

    </div>

  const cur=ser.cur.visitors,spike=findSpike(cur,ser.start),usual=median(cur);

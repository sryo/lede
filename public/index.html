<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lede</title>
<link rel="preload" href="/weepeople.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: one rounded app window on a quiet canvas. The home screen tells the period's story in reading order:
   how much changed and why, then the charts that prove it. Each tile is a title, one graphic and one sentence.
   Every tile zooms to fill the window, and items inside zoom again into filtered views.
   Colour says what kind of thing a mark is, on every tile and sub-page: visitors over time are blue, sources amber,
   pages violet, bounce (people leaving) red, and people here now green. Colour is solid. Transparency means empty,
   before, those who left, or how much; and in crowded charts (Sankey ribbons, the spike day, the page treemap) the
   marks the sentence names stay solid while the rest fade, so the eye finds them. Small marks fade less so they show.
   Text stays ink; colour sits in marks, swatches and underlines. */
@font-face{font-family:"WeePeople";src:url("/weepeople.woff2") format("woff2");font-display:block}
:root{
  color-scheme:light;
  /* greys plus ink: canvas, window, tile, line (edges, tracks, hover, skeletons), before (--rule, below), muted text */
  --canvas:#FAF9F6; --win:#F3F1EC; --tile:#FFFFFF; --line:#E7E4DD;
  --ink:#1A1D2E; --muted:#5F6275;
  --time:#2F5BEA; --src:#FFAA00; --page:#8B5CF6; --bnc:#D7263D; --live:#12974A;
  /* text on a solid subject colour */
  --on-time:#FFFFFF; --on-src:#1A1D2E; --on-page:#FFFFFF; --on-bnc:#FFFFFF; --on-live:#FFFFFF;
  /* how opaque "the rest" and "empty" are; small marks (glyphs, thin bars, figures) get the stronger pair */
  --a-rest:50%; --a-pale:16%; --a-rest-s:75%; --a-pale-s:32%;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* six text sizes: fine print and axes, labels and rows, sentences, titles, hero numbers, the home total */
  --fs-xs:12px; --fs-s:14px; --fs-m:17px; --fs-l:20px; --fs-xl:44px; --fs-xxl:56px;
  /* concentric corners: the window's radius is a tile's plus the 16px between them */
  --r-win:36px; --r-tile:20px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --canvas:#0E0F13; --win:#15161C; --tile:#1D1F27; --line:#2C2F3A;
  --ink:#EDEEF3; --muted:#A3A6B6;
  --time:#6B8CFF; --src:#FFC14D; --page:#A585FF; --bnc:#FF5C6B; --live:#3DDC84;
  --on-time:#0E0F13; --on-src:#0E0F13; --on-page:#0E0F13; --on-bnc:#0E0F13; --on-live:#0E0F13;
  --a-rest:62%; --a-pale:24%; --a-rest-s:82%; --a-pale-s:40%;
}}
/* transparency, not white: a colour keeps its hue, and overlapping marks (crossing ribbons) show it */
:root{
  --time-t:color-mix(in srgb,var(--time) var(--a-rest),transparent); --time-p:color-mix(in srgb,var(--time) var(--a-pale),transparent);
  /* amber is light, so its faded versions need more opacity to show as much as the darker colours */
  --src-t:color-mix(in srgb,var(--src) calc(var(--a-rest) * 1.3),transparent); --src-p:color-mix(in srgb,var(--src) calc(var(--a-pale) * 1.7),transparent);
  --src-ts:color-mix(in srgb,var(--src) calc(var(--a-rest-s) * 1.2),transparent);
  --page-t:color-mix(in srgb,var(--page) var(--a-rest),transparent); --page-p:color-mix(in srgb,var(--page) var(--a-pale),transparent);
  --page-ts:color-mix(in srgb,var(--page) var(--a-rest-s),transparent);
  --bnc-t:color-mix(in srgb,var(--bnc) var(--a-rest),transparent); --bnc-p:color-mix(in srgb,var(--bnc) var(--a-pale),transparent);
  --live-t:color-mix(in srgb,var(--live) var(--a-rest),transparent); --live-p:color-mix(in srgb,var(--live) var(--a-pale),transparent);
  --live-ps:color-mix(in srgb,var(--live) var(--a-pale-s),transparent);
  --rule:color-mix(in srgb,var(--ink) 30%,var(--tile));
  --focus:var(--page);
}

html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:14px/1.4 var(--font);box-sizing:border-box;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
h1,h2,h3{margin:0;font:inherit}
.muted{color:var(--muted)}

.win{display:flex;flex-direction:column;position:relative;max-width:1080px;margin:0 auto;min-height:clamp(860px,100%,940px);
  background:var(--win);border-radius:var(--r-win);overflow:hidden;box-shadow:0 0 0 1px var(--line)}

/* Home fills the window and grows past it when its tiles need the room; the page scrolls instead of tiles squeezing. */
.home{position:relative;flex:1 0 auto;display:flex;flex-direction:column;gap:16px;padding:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.site{display:flex;align-items:baseline;gap:12px;min-width:0}
.site b,.site select{font-size:var(--fs-l);font-weight:700;letter-spacing:-.02em}
.hint{font-size:var(--fs-s);color:var(--muted)}
.pick{position:relative;display:inline-flex;align-items:center}
.pick select{appearance:none;border:0;background:transparent;cursor:pointer;padding:0 20px 0 0}
.pick svg{position:absolute;right:0;pointer-events:none;color:var(--muted)}
.chip{font-size:var(--fs-s);line-height:16px;padding:8px 12px;border-radius:999px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.period{display:inline-flex;gap:4px} .period[hidden]{display:none}
.period button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:var(--fs-s);cursor:pointer}
.period button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--win);font-weight:700}


/* story row: the number, the sentence, who is here now */
.story{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center}
.headline{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.headline:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:6px}
.headline>b{font-size:var(--fs-xxl);line-height:1;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.headline span{font-size:var(--fs-s)}
.sentence{margin:0;font-size:var(--fs-m);line-height:1.45}
.say-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.goal-line{margin:0;min-height:32px;font-size:var(--fs-s);color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal-line b{color:var(--ink)}
.sampled{margin:0;font-size:var(--fs-s);color:var(--muted)}
.flag{display:block;flex:none;color:var(--rule)} .flag.on{color:var(--page)}
.seg button:has(.flag){display:inline-flex;align-items:center;gap:4px} .seg button[aria-pressed="true"] .flag{color:inherit}
.lwrap{display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:center}
/* lists without flags keep the flag column empty, so numbers line up from one list to the next */
.list>.lrow{width:calc(100% - 24px)}
.lwrap>.goal-t,.lwrap>span:first-child{order:2}
.goal-t{all:unset;cursor:pointer;width:24px;height:28px;display:grid;place-items:center;border-radius:6px;opacity:0}
.lwrap:hover .goal-t,.goal-t:focus-visible,.goal-t[aria-pressed="true"]{opacity:1}
.goal-t:hover{background:var(--line)}
.goal-t:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.goal-line .goal-t{margin:0 -4px}
@media (hover:none){.goal-t{opacity:1}}
.goal-text{margin:0;font-size:var(--fs-s);color:var(--muted)}
.goal-text b{color:var(--ink)}

.link{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-decoration-thickness:2.5px;text-underline-offset:4px}
.link[data-f="referrer"],.link[data-f="channel"]{text-decoration-color:var(--src)} .link[data-f="path"]{text-decoration-color:var(--page)}
.link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.now{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.now>span:last-child,.now .pace{font-size:var(--fs-s);white-space:nowrap}
.now:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:6px}
/* Wee People: one letter is one person; tight spacing makes a small crowd */
.ppl{font-family:WeePeople;font-size:26px;line-height:.86;letter-spacing:-.29em;white-space:nowrap;color:var(--live);font-weight:400}
.ppl .named{color:var(--src)}
/* someone who left fades to a light tint of the same colour */
.ppl .gone,.crowd .gone{color:var(--live-ps)}
.ppl.small{font-size:30px}
/* the crowd as a line of people in the order they arrived, ten to a row like text */
.crowd{display:grid;grid-template-columns:repeat(10,.31em);font-family:WeePeople;font-size:26px;font-weight:400;line-height:.86;color:var(--live);padding-right:4px}
.crowd span{white-space:nowrap}
.crowd .named{color:var(--src)}
.crowd.big{font-size:40px}

.grid{flex:1 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(250px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:20px;min-width:0;min-height:0;overflow:hidden;cursor:pointer;
  border-radius:var(--r-tile);background:var(--tile);box-shadow:0 0 0 1px var(--line)}
.t-days{grid-column:1/3;grid-row:1}
.t-flow{grid-column:3/5;grid-row:1/3}
.t-stay{grid-column:1;grid-row:2}
.t-pages{grid-column:2;grid-row:2}
.tile-title{all:unset;font-size:var(--fs-s);line-height:1.35;color:var(--muted);cursor:pointer;min-width:0;display:block}
button.tile-title:hover{color:var(--ink)}
.tile-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile-key{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.tile-key .sw{border-radius:2px}
.sw.here,.sw.gone{border-radius:50%;width:8px;height:8px;margin-right:4px} .sw.here{background:var(--live)} .sw.gone{background:var(--live-ps)}
.tile-title:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.cap{margin:0;font-size:var(--fs-m);line-height:1.3}
.t-pages .cap{font-size:var(--fs-s)}
.viz{flex:1;min-height:0;position:relative}
/* the chart fills the tile without adding to its height, so redraws can't grow it */
.viz>svg{position:absolute;left:0;top:0;display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-s);text-align:center}

/* daily bars, one label at the spike, the event markers under them */
.peak{position:absolute;top:0;font-size:var(--fs-xs);line-height:1.3;white-space:nowrap}
.peak b{font-weight:700}
.peak span{color:var(--muted)} .peak span.told{color:var(--ink)}
.peak .sw{width:8px;height:8px;margin-right:4px}
.marks{position:relative;height:28px;flex:none}
/* under a chart with a scale, the markers leave out the scale's 40px column (dayBars' padR), so each sits under its bar */
.chart+.marks{margin-right:40px}
.mark{all:unset;position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:4px;padding:0 4px}
.mark .g{display:flex;gap:4px}
.mark .tag{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.mark:hover .tag{color:var(--ink)}
.mark:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.m-date{position:absolute;bottom:0;font-size:var(--fs-xs);color:var(--muted)} .m-date.end{right:0}
.m-day{position:absolute;bottom:0;transform:translateX(-50%);font-size:var(--fs-xs);color:var(--muted)}
.glyph{flex:none;display:block}
/* the owner's notes: a day of the overview's chart opens a small form for that day; arrows pick the day */
.chart.notable{cursor:pointer;border-radius:4px}
.chart.notable:focus-visible{outline:none}
.chart.notable:focus-visible::after{content:"";position:absolute;top:8px;bottom:2px;pointer-events:none;border-radius:4px;outline:2px solid var(--focus);
  width:calc((100% - 40px) / var(--n));left:calc((100% - 40px) * var(--i) / var(--n))}
.note-edit{position:fixed;z-index:11;width:min(320px,calc(100vw - 32px));box-sizing:border-box;margin:0;padding:12px;border-radius:14px;
  background:var(--tile);box-shadow:0 0 0 1px var(--line),0 10px 28px -8px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;font-size:var(--fs-s)}
.note-edit .add{margin:0;max-width:none}
.note-edit .err{color:var(--bnc);font-size:var(--fs-xs)} .note-edit .err:empty{display:none}
.note-edit .del{all:unset;cursor:pointer;color:var(--muted);font-size:var(--fs-xs);align-self:flex-start;border-radius:4px}
.note-edit .del:hover{color:var(--ink);text-decoration:underline} .note-edit .del:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* what happened */
.event{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:start;
  font-size:var(--fs-xs);line-height:1.3;border-radius:6px}
.event .glyph{margin-top:4px}
.event:hover b{text-decoration:underline}
.event:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.event b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event>span>span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.events-list{display:flex;flex-direction:column;margin:0 -8px}
.events-list .event{padding:8px;font-size:var(--fs-s);border-radius:8px}
.events-list .event b,.events-list .event>span>span{white-space:normal}
.events-list .event:hover{background:var(--line)}

/* sankey */
.flow{height:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:8px}
.flow svg{width:100%;height:100%;display:block;overflow:visible}
.nodes{position:relative}
.node{all:unset;position:absolute;transform:translateY(-50%);cursor:pointer;font-size:var(--fs-xs);line-height:1.3;max-width:150px}
.nodes.left .node{right:0;text-align:right}
.nodes.right .node{left:0}
.node>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.told>span:first-child{white-space:normal;overflow-wrap:normal}
.node b{font-weight:700}
.node .chg{color:var(--muted);font-variant-numeric:tabular-nums}
.node.told .chg{color:var(--ink);font-weight:700}
.node:hover>span:first-child{text-decoration:underline}
.node:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* rows of ten squares: out of every 10 visits, how many left after one page */
.sqs{height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;padding-top:4px}
.sqrow{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0;border-radius:6px}
.sqrow:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.sqrow:hover .sq-label{color:var(--ink)}
.sq-num{flex:0 1 auto;display:flex;align-items:baseline;gap:8px;min-width:0}
.sq-num b{font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums}

.sqrow.stack .sq-num{flex-direction:column;align-items:flex-start;gap:0}
.sqrow.under{flex-direction:column;align-items:flex-start;gap:4px}
.sq-label{font-size:var(--fs-xs);color:var(--muted)}
.sqrow svg{display:block;flex:none}

/* heatmap */
.heat{height:100%;display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:4px 8px}
.heat .days{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));font-size:var(--fs-xs);color:var(--muted);align-items:center}
.heat .cells{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:2px}
.heat .cells i{border-radius:2px}
/* coral ring with a thin tile-coloured gap inside, so it shows on any blue */
.heat .cells i.hit{outline:2px solid var(--src);outline-offset:-2px;box-shadow:inset 0 0 0 3px var(--tile)}
.heat .hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;font-size:var(--fs-xs);color:var(--muted)}
.ring{display:inline-block;width:10px;height:10px;border:2px solid var(--src);vertical-align:-1px}

.state{display:flex;flex-direction:column;gap:4px;padding:28px 8px;color:var(--muted);font-size:var(--fs-s);grid-column:1/-1}
.state.error,.onboard{grid-column:1/-1;grid-row:1/-1;align-self:center;justify-self:center;max-width:460px;text-align:center;align-items:center;gap:8px;padding:40px 28px}
.state.error b,.onboard b{color:var(--ink);font-size:var(--fs-m);font-weight:650}
.onboard{color:var(--muted);font-size:var(--fs-s)}
.onboard code{font:12px var(--mono);background:var(--line);color:var(--ink);padding:4px 8px;border-radius:8px;overflow-wrap:anywhere}
.add{display:flex;gap:8px;margin-top:8px;width:100%;max-width:340px}
.add input{flex:1;min-width:0;height:32px;box-sizing:border-box;border:0;border-radius:999px;padding:0 16px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:inherit;font-size:var(--fs-s)}
.add input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.add .retry{margin:0;height:32px;padding:0 16px}
.onboard .err{color:var(--bnc)} .onboard .err:empty{display:none}
.retry{border:0;border-radius:999px;padding:8px 16px;background:var(--ink);color:var(--win);cursor:pointer;font-size:var(--fs-s);font-weight:600;margin-top:4px}
.retry:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sk{display:block;background:var(--line);border-radius:6px}
#home.busy .story,#home.busy .grid,.layer-body.busy{opacity:.5;transition:opacity .2s}
.state b{color:var(--ink);font-weight:600}

/* zoom layers */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--win)}
.inner{position:absolute;inset:0;display:flex;flex-direction:column}
/* An open sub-page is at least as tall as the window and grows with its content; the page scrolls. */
.win.grow{overflow:hidden}
.win.grow>.home{position:absolute;inset:0 0 auto 0}
.layer.grown,.layer.grown>.inner{position:relative;inset:auto}
.layer.grown .layer-body{overflow:visible;flex:none}
.ghost{position:absolute;margin:0;pointer-events:none;transform-origin:center}
.layer-head{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.circle{all:unset;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:var(--tile);box-shadow:inset 0 0 0 1px var(--line)}
.circle:hover{background:var(--line)}
.circle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.crumbs{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.crumbs span{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs h2{font-size:var(--fs-l);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-body{flex:1;min-height:0;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:16px}

/* sub-pages: sentence → numbers → the enlarged chart → the section that answers the question → rows */
.say{margin:0;font-size:var(--fs-l);line-height:1.4;max-width:860px}
.say b.told{text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:4px;text-decoration-color:var(--src)}
.say b.told.time{text-decoration-color:var(--time)}
.say-sub{margin:4px 0 0;font-size:var(--fs-s);color:var(--muted)}
.nums{display:flex;align-items:flex-end;gap:16px 40px;flex-wrap:wrap}
.hero{display:flex;flex-direction:column}
.hero-sq{margin-top:8px}
.hero-sq svg{display:block}
.hero .big{font-size:var(--fs-xl);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero>span:last-child{font-size:var(--fs-s)}
.num{display:flex;flex-direction:column;gap:4px}
.num .k{font-size:var(--fs-xs);color:var(--muted)}
.num .v{font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums}

.card{background:var(--tile);border-radius:var(--r-tile);box-shadow:0 0 0 1px var(--line);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-title{font-size:var(--fs-s);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:stretch}
.more-link{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 10px;align-items:center;gap:12px;
  width:calc(100% - 8px);margin:0 -8px;padding:8px;border-radius:8px;font-size:var(--fs-s);color:var(--muted)}

.reach b{background:var(--page-t)} .reach u{background:var(--page-p)} .reach .on u{background:var(--page)}

.landed{position:relative;min-height:276px;height:28vh}
.landed .lbl{all:unset;position:absolute;transform:translateY(-50%);font-size:var(--fs-xs);line-height:1.3;cursor:pointer;white-space:nowrap;max-width:calc(40% - 18px);overflow:hidden;text-overflow:ellipsis}

.cross-say:empty{display:none}
.tip{position:absolute;pointer-events:none;background:var(--tile);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:var(--fs-xs);line-height:1.35;
  white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));box-shadow:0 0 0 1px var(--line),0 6px 18px -6px rgba(0,0,0,.25);z-index:2}

button.blk:hover{filter:brightness(1.08)}
button.blk:focus-visible{outline:2px solid var(--tile);outline-offset:-2px;box-shadow:inset 0 0 0 4px var(--ink)}

.seg{display:inline-flex;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px;gap:0}

  /* phones: the crowd above already shows the figures, so the table keeps page, source and time */

@media (prefers-reduced-motion:reduce){.blk{transition:none}}

<body>
<main class="win" id="win">
  <div class="home" id="home">
    <div class="topbar">
      <div class="site"><h1 id="site"></h1><span class="hint" id="hint"></span></div>
      <div class="period" role="group" aria-label="Period" id="period">
        <button type="button" data-days="7">7 days</button><button type="button" data-days="30">30 days</button>
      </div>
    </div>
    <div class="story" id="story"></div>
    <div class="grid" id="grid"><div class="state">Loading stats…</div></div>
  </div>
</main>
<div class="sr" id="status" role="status"></div>

<script type="module">
import { labelOf, fmtN, fmtInt, count, fmtSigned, fmtPct, fmtDur, fmtDay, fmtWeekday, fmtDate, dayDate, esc, maxOf, sum, median,
  findSpike, readStory, tellStory, spikeSegment, waterfall, waterfallCaption, bounceSplit, bounceCaption,
  flowCaption, crowd, crowdCaption, crowdLine, onlineStory, pagesCaption, pagesFinding, todayPace, sourceStory, audienceStory, audienceNote, readers, pageStory, scrollStory, eventsSentence, channelShare, pathHTML, pageName, goalStory, suggestGoal, fmtRate, keywordsStory, KEYWORDS_EMPTY, nextStory, nextItems,
  dayHint, ribbonHint, sourceHint, pageHint, dayKey, keywordsCard } from '/story.js';
import { viewToUrl, urlToView } from '/routes.js';
import { displayHost } from '/hosts.js';

const $=(s,r=document)=>r.querySelector(s);
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const TZ=new Date().getTimezoneOffset(),TZNAME=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let SITE='',SITES=[],DEMO=false,DAYS=30;
// What the home screen worked out, for the views that open from it.
let HOME=null;

/* ---------- API ---------- */
// Answers are reused for five minutes, so a tab left open still moves on to new data.
const memo=new Map(),MEMO_MS=5*60e3;
function api(route,params={},fresh=false){
  const qs=new URLSearchParams({site:SITE,days:DAYS,tz:TZ,tzName:TZNAME});
  for(const [k,v] of Object.entries(params))if(Array.isArray(v))v.forEach(x=>qs.append(k,x));else if(v!=null)qs.set(k,v);
  const url=`/api/${route}?${qs}`;
  const hit=memo.get(url);
  if(fresh||!hit||Date.now()-hit.at>MEMO_MS){
    for(const [k,v] of memo)if(Date.now()-v.at>MEMO_MS)memo.delete(k);
    // fresh skips the browser's copy too, which the server lets it keep for 15 to 60 seconds.
    memo.set(url,{at:Date.now(),p:fetch(url,fresh?{cache:'no-store'}:undefined).catch(()=>{throw new Error('Couldn’t reach the stats. Check your connection, then try again.')}).then(async r=>{
      const body=await r.json().catch(()=>({}));
      if(r.status===401&&body.signIn){showSignIn();throw Object.assign(new Error(body.error),{signIn:true})}
      if(!r.ok)throw new Error(body.error||'Something went wrong reading the stats. Try again in a minute.');
      return body;
    }).catch(e=>{memo.delete(url);throw e})});
  }
  return memo.get(url).p;
}
const filterParams=f=>({path:f.path,referrer:f.referrer,channel:f.channel});
const FILTER_OF={path:'path',entry:'path',exit:'path',referrer:'referrer',channel:'channel'};

/* ---------- goals ---------- */
// Pages that count as a visitor doing something, saved by the Worker for everyone who opens the dashboard.
// The same answer carries the owner's notes on days ("Posted on Hacker News").
let GOALS=[],NOTES=[],goalsReady=Promise.resolve();
// Runs alongside the stats; whatever needs the goals or notes waits on goalsReady. A reply for a site that is no
// longer showing is dropped, so one site's goals are never saved over another's.
function loadGoals(){
  const site=SITE;
  return goalsReady=api('goals',{},true).catch(()=>({})).then(b=>{if(site===SITE){GOALS=b.goals||[];NOTES=b.notes||[]}});
}
async function saveGoals(list){
  const before=GOALS;GOALS=list;
  let ok=false;
  try{const r=await fetch(`/api/goals?site=${encodeURIComponent(SITE)}`,{method:'PUT',body:JSON.stringify({goals:list})});if(!r.ok)throw new Error(r.status);ok=true}
  catch{GOALS=before;announce("Couldn't save the goal. Try again.")}
  drawGoalLine();
  return ok;
}
const goalWhat=()=>GOALS.length===1?pageName(GOALS[0]):'a goal';
// A finish flag: grey outline for a page that isn't a goal, solid violet (the pages colour) for one that is.
const FLAG=on=>`<svg class="flag${on?' on':''}" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 14.5V1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.2 2.3h8.6l-2 3.2 2 3.2H4.2z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

// Under the home sentence: how many visits reached a goal, or, with none set, an offer to track a page that looks like one.
async function drawGoalLine(){
  const el=$('#goal-line');if(!el||!HOME||HOME.empty)return;
  if(!GOALS.length){
    const g=suggestGoal(HOME.pageRows||[]);
    if(!g||store.get(`lede_goal_no:${SITE}`)===g){el.hidden=true;return}
    el.innerHTML=`<span>Is <b>${esc(pageName(g))}</b> a goal?</span>${goalSeg(g,null)}`;
    el.querySelector('[data-a="yes"]').onclick=()=>toggleGoal(g);
    el.querySelector('[data-a="no"]').onclick=()=>{store.set(`lede_goal_no:${SITE}`,g);el.hidden=true};
    el.hidden=false;return;
  }
  try{
    const conv=await api('conversions',{goal:GOALS});
    const html=goalStory(conv,GOALS,HOME.S.lead?.key);
    if(!html){el.hidden=true;return}
    const one=GOALS.length===1?GOALS[0]:null;
    el.innerHTML=`${one?`<button type="button" class="goal-t" data-path="${esc(one)}"></button>`:FLAG(true)}<span>${html}</span>`;
    const t=el.querySelector('.goal-t');
    if(t){paintGoalToggle(t);t.onclick=()=>toggleGoal(one)}
    el.hidden=false;
  }catch{el.hidden=true}
}

// Makes a page a goal, or stops tracking it, and updates every flag and goal line on screen.
async function toggleGoal(path){
  const on=GOALS.includes(path);
  const saved=await saveGoals(on?GOALS.filter(g=>g!==path):[...GOALS,path]);
  document.querySelectorAll('.goal-t').forEach(paintGoalToggle);
  document.querySelectorAll('.goal-card').forEach(c=>drawGoalCard(c,c.dataset.path));
  if(saved)announce(on?`${path} is no longer a goal`:`${path} is now a goal`);
}
function paintGoalToggle(b){
  const on=GOALS.includes(b.dataset.path);
  b.setAttribute('aria-pressed',on);b.innerHTML=FLAG(on);
  b.setAttribute('aria-label',on?`${b.dataset.path} is a goal. Stop tracking it`:`Track ${b.dataset.path} as a goal`);
  b.title=on?'Goal: click to stop tracking':'Track as a goal';
}

// At the foot of a page's view: what the page would show as a goal, before deciding.
async function drawGoalCard(card,path){
  const on=GOALS.includes(path),no=!on&&store.get(`lede_not_goal:${SITE}:${path}`)==='1';
  let text='';
  try{text=goalStory(await api('conversions',{goal:[path]}),[path],HOME?.S?.lead?.key)||''}catch{}
  card.innerHTML=`<div class="card-head"><div class="card-title">Is this page a goal?</div>${goalSeg(path,on?true:no?false:null)}</div>
    <p class="goal-text">${text||`Not enough visits yet to say how often visits reach ${esc(pageName(path))}.`}</p>`;
  card.querySelector('[data-a="yes"]').onclick=()=>{store.set(`lede_not_goal:${SITE}:${path}`,'');if(!on)toggleGoal(path)};
  card.querySelector('[data-a="no"]').onclick=()=>{store.set(`lede_not_goal:${SITE}:${path}`,'1');if(on)toggleGoal(path);else drawGoalCard(card,path)};
  card.hidden=false;
}

// Goal or not, as one segmented control like the period switch. state: true, false, or null for not answered yet.
const goalSeg=(path,state)=>`<div class="seg" role="group" aria-label="Is ${esc(path)} a goal?"><button type="button" data-a="yes" aria-pressed="${state===true}">${FLAG(state===true)}Goal</button><button type="button" data-a="no" aria-pressed="${state===false}">Not a goal</button></div>`;

/* ---------- formatting ---------- */
// Change against the previous period. Where lower is better (bounce), it says so in words.
function delta(c,p,inverse){
  if(c==null)return '<span></span>';
  if(!p)return c?'<span class="delta">new</span>':'<span></span>';
  const d=(c-p)/p,pct=Math.round(Math.abs(d)*100);
  if(!pct)return '<span class="delta">same</span>';
  return `<span class="delta">${d>0?'+':'−'}${pct}%${inverse?` <span class="muted">${d<0?'better':'worse'}</span>`:''}</span>`;
}
const change=(c,p)=>p?((c-p)/p>=0?'+':'−')+Math.round(Math.abs(c-p)/p*100)+'%':'new';
// For number rows: a change that rounds to 0% reads "same", as rates and lists already say; nothing then and now says nothing.
const changeWord=(c,p)=>!c&&!p?'':change(c,p).replace(/^[+−]0%$/,'same');
const mmss=t=>{const s=Math.round(t);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const CHEV='<svg class="chev" viewBox="0 0 7 12" aria-hidden="true"><path d="M1 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BACK='<svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M8 2L2 8l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const announce=msg=>{const el=$('#status');el.textContent='';setTimeout(()=>{el.textContent=msg},50)};
// An error says what went wrong and offers to try again.
function showError(el,e,retry){
  if(e.signIn)return;
  el.innerHTML=`<div class="state error"><b>Couldn't load the stats</b><span>${esc(e.message)}</span>${retry?'<button type="button" class="retry">Try again</button>':''}</div>`;
  if(retry)el.querySelector('.retry').onclick=retry;
}
// Long paths keep their start and end: /blog/…-analytics.
const shorten=(s,max=22)=>s.length<=max?s:s.slice(0,Math.ceil(max/2)-1)+'…'+s.slice(-Math.floor(max/2));

/* ---------- drawing ---------- */
const ro=new ResizeObserver(es=>es.forEach(e=>e.target._draw&&e.target._draw()));
function observe(el,fn){el._draw=fn;fn();ro.observe(el)}
// Stops watching charts inside root before it is replaced, so detached charts can be freed.
function release(root){for(const el of root.querySelectorAll('*'))if(el._draw){ro.unobserve(el);el._draw=null}}
function nice(mx){
  if(!(mx>0))return {step:1,n:1};
  const p=10**Math.floor(Math.log10(mx/5));
  for(const c of [1,2,2.5,5,10]){const step=c*p;if(mx/step<=5)return {step,n:Math.ceil(mx/step)}}
}
// Fill and text colour for a subject (time, src, page, bnc) solid, for the rest, or pale.
const fullOf=subj=>({color:`var(--${subj})`,on:`var(--on-${subj})`});
const tintOf=subj=>({color:`var(--${subj}-t)`,on:'var(--ink)'});
const paleOf=subj=>({color:`var(--${subj}-p)`,on:'var(--ink)'});
// Spreads label centres at least `gap` apart inside 0..H, keeping each as close to its node as it can.
function spread(ys,gap,H){
  if(gap*ys.length>H)return ys.map((_,i)=>(i+.5)*H/ys.length);
  ys=ys.slice();ys[0]=Math.max(ys[0],gap/2);
  for(let i=1;i<ys.length;i++)ys[i]=Math.max(ys[i],ys[i-1]+gap);
  ys[ys.length-1]=Math.min(ys[ys.length-1],H-gap/2);
  for(let i=ys.length-2;i>=0;i--)ys[i]=Math.min(ys[i],ys[i+1]-gap);
  return ys;
}
// A label anchored over position x (0-1) that stays inside the chart near either edge.
const anchorStyle=x=>`left:${(x*100).toFixed(1)}%;transform:translateX(${x<.3?-6:x>.7?-94:-50}%)`;

function squarify(vals,W,H){
  const total=vals.reduce((a,b)=>a+b,0);if(!total)return [];
  const k=W*H/total,areas=vals.map(v=>v*k),out=[];
  let x=0,y=0,w=W,h=H,row=[],i=0;
  const worst=(r,len)=>{let s=0,mx=0,mn=Infinity;for(const j of r){const a=areas[j];s+=a;mx=Math.max(mx,a);mn=Math.min(mn,a)}return Math.max(len*len*mx/(s*s),s*s/(len*len*mn))};
  const lay=r=>{
    const s=r.reduce((a,j)=>a+areas[j],0);
    if(w>=h){const cw=s/h;let cy=y;for(const j of r){const jh=areas[j]/cw;out[j]={x,y:cy,w:cw,h:jh};cy+=jh}x+=cw;w-=cw}
    else{const rh=s/w;let cx=x;for(const j of r){const jw=areas[j]/rh;out[j]={x:cx,y,w:jw,h:rh};cx+=jw}y+=rh;h-=rh}
  };
  while(i<areas.length){const len=Math.min(w,h);if(!row.length||worst([...row,i],len)<=worst(row,len)){row.push(i);i++}else{lay(row);row=[]}}
  if(row.length)lay(row);

}
// items: [{label,value,color,on,sub?,onClick?}]
function treemap(el,items,{gap=4}={}){
  // The long tail goes last whatever its size, so it fills the far corner instead of leading.
  items=items.filter(it=>it.value>0).sort((a,b)=>(a.last?1:0)-(b.last?1:0)||b.value-a.value);
  if(!items.length){el.innerHTML='<div class="empty">No data yet</div>';return}
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const rects=squarify(items.map(it=>it.value),W,H);
    el.replaceChildren(...rects.map((r,i)=>{
      const it=items[i],b=document.createElement(it.onClick?'button':'div');
      b.className='blk';
      const w=r.w-gap,h=r.h-gap;
      Object.assign(b.style,{left:r.x+gap/2+'px',top:r.y+gap/2+'px',width:Math.max(0,w)+'px',height:Math.max(0,h)+'px',background:it.color,color:it.on});
      if(it.ring)b.classList.add('ring-blk');
      // Labels by room: name and value, name only, name set sideways in a tall sliver, or none (the title has it).
      // Small blocks use smaller type; long names keep their start and end, short ones are cut at the end.
      const small=w<80;
      if(small){Object.assign(b.style,{fontSize:'12px',padding:'4px'});b.classList.add('small')}
      const fit=Math.max(4,Math.floor((w-(small?10:14))/(small?5.6:6.6)));
      const name=esc(it.label.length>14?shorten(it.label,fit):it.label);
      if(small&&w>44&&h>22)b.innerHTML=`<b>${pathHTML(it.label)}</b>`;
      else if(small);
      else if(w>90&&h>38)b.innerHTML=`<b>${name}</b><span>${esc(it.sub??fmtN(it.value))}</span>`;
      else if(w>44&&h>22)b.innerHTML=`<b>${name}</b>`;
      else if(w>20&&h>72){b.classList.add('tall');b.innerHTML=`<b>${esc(shorten(it.label,Math.floor((h-14)/6.6)))}</b>`}
      else if(w>28&&h>18&&it.short)b.innerHTML=`<b>${esc(it.short)}</b>`;
      b.title=`${it.label}: ${fmtInt(it.value)} visitors`;
      if(it.onClick){b.setAttribute('aria-label',`${it.label}, ${fmtInt(it.value)} visitors. Zoom in`);b.onclick=e=>{e.stopPropagation();it.onClick(b)}}
      return b;
    }));
  });
}

// Bars per day in a subject's colour (time unless `subj` says otherwise), with the previous period as a dashed step line over them.
// With `hot` days, those stay solid and the rest turn transparent; without, every bar is solid.
// o: {cur, prev?, start, aria, subj?, seg?:{day,top,subj}, hot?:Set, label?:{i,title,sub,swatch}, prevDot?, axis?}
function dayBars(el,o){
  const {cur,start}=o,n=cur.length,prev=o.prev,day=i=>fmtDay(dayDate(start,i)),subj=o.subj||'time';
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const top=o.label?40:o.scale?10:4,padB=o.axis?20:o.scale?4:0,base=H-padB,padR=o.scale?40:0,peakV=Math.max(maxOf(cur),prev?maxOf(prev):0);
    // With a scale, the top gridline is a round number just above the tallest bar.
    const step=o.scale?nice(peakV||1).step:0,max=o.scale?Math.ceil((peakV||1)/step)*step:peakV*1.04||1;
    if(base<top+8)return;
    const cw=(W-padR)/n,bw=Math.max(2,Math.min(cw*.66,28)),Y=v=>top+(base-top)*(1-v/max),x=i=>i*cw+(cw-bw)/2,r=Math.min(2,bw/2);
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria)}">`;
    if(o.scale)for(let v=step;v<=max+1e-9;v+=step){const y=Y(v);s+=`<line class="grid-l" x1="0" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${W}" y="${y+4}" font-size="12" fill="var(--muted)" text-anchor="end">${v>=1000?`${+(v/1000).toFixed(1)}k`:v}</text>`}
    cur.forEach((v,i)=>{
      if(o.seg&&o.seg.day===i){
        const y=Y(v),ym=Y(v-o.seg.top);
        s+=`<g><rect x="${x(i)}" y="${ym}" width="${bw}" height="${base-ym}" rx="${r}" fill="var(--${subj})"/><rect x="${x(i)}" y="${y}" width="${bw}" height="${ym-y}" rx="${r}" fill="var(--${o.seg.subj})"/></g>`;
      }else s+=`<rect x="${x(i)}" y="${Y(v)}" width="${bw}" height="${base-Y(v)}" rx="${r}" fill="var(--${subj}${o.hot&&!o.hot.has(i)?'-t':''})"/>`;
    });
    if(prev){
      let d=`M0,${Y(prev[0]).toFixed(1)}`;
      prev.forEach((v,i)=>{d+=`${i?`V${Y(v).toFixed(1)}`:''}H${((i+1)*cw).toFixed(1)}`});
      s+=`<path d="${d}" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      if(o.prevDot>=0)s+=`<circle cx="${(o.prevDot+.5)*cw}" cy="${Y(prev[o.prevDot])}" r="4" fill="var(--${subj})" stroke="var(--tile)" stroke-width="2"/>`;
    }
    // One strip per day, the full height, so a short bar or an empty day is as easy to point at as a tall one.
    cur.forEach((v,i)=>{s+=`<rect x="${i*cw}" y="${top}" width="${cw}" height="${base-top}" fill="transparent" data-hint="${esc(dayHint(day(i),v,prev?.[i],DAYS))}"/>`});
    if(o.axis){
      const at=[0,...(o.label&&o.label.i>3&&o.label.i<n-4?[o.label.i]:[]),n-1];
      s+=at.map((i,k)=>`<text x="${k===0?x(i):k===at.length-1?x(i)+bw:x(i)+bw/2}" y="${H-4}" font-size="12" fill="var(--muted)" text-anchor="${k===0?'start':k===at.length-1?'end':'middle'}">${day(i)}</text>`).join('');
    }
    s+='</svg>';
    if(o.label){
      const L=o.label;
      s+=`<div class="peak" style="${anchorStyle((L.i+.5)*cw/W)}"><b>${esc(L.title)}</b>${L.sub?`<br><span${L.swatch?' class="told"':''}>${L.swatch?`<i class="sw" style="background:${L.swatch}"></i>`:''}${esc(L.sub)}</span>`:''}</div>`;
    }
    el.innerHTML=s;
  });
}

// A line per day against the previous period (dashed), with the peak labelled.
function lines(el,{cur,prev,fmt,axis,start,peak}){
  const day=i=>fmtDay(dayDate(start,i));
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const padL=8,padR=40,padB=22,padT=peak?44:10,n=cur.length;
    const lo=Math.min(...cur,...(prev||[])),hi=Math.max(...cur,...(prev||[]));
    // Widen the step until no two gridlines get the same label (36%, 36%, 37% on a flat month).
    // A flat line (a period with no visits) starts from a step of a point, not a millionth, so the loop below doesn't
    // count ten million gridlines; and a line flat at 0 gets one step of room above it, not the whole 0–100%.
    let {step}=nice(Math.max(hi-lo,.01)),min,max;
    for(;;){
      min=Math.floor(lo/step)*step;max=Math.ceil(hi/step)*step||step;
      const labels=[];for(let v=min;v<=max+1e-9;v+=step)labels.push(axis(v));
      if(new Set(labels).size===labels.length)break;
      step*=2;
    }
    const X=i=>padL+i*(W-padL-padR)/Math.max(1,n-1),Y=v=>padT+(H-padT-padB)*(1-(v-min)/((max-min)||1));
    const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(peak?.aria||'This period compared with the previous one')}">`;
    for(let v=min;v<=max+1e-9;v+=step){const y=Y(v);s+=`<line class="grid-l" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${W}" y="${y+4}" text-anchor="end">${axis(v)}</text>`}
    s+=`<text x="${X(0)}" y="${H-5}">${day(0)}</text><text x="${X(n-1)}" y="${H-5}" text-anchor="end">${day(n-1)}</text>`;
    if(prev)s+=`<path d="${path(prev)}" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    s+=`<path d="${path(cur)}" fill="none" stroke="var(--bnc)" stroke-width="2.2" stroke-linejoin="round"/>`;
    if(peak)s+=`<circle cx="${X(peak.i)}" cy="${Y(cur[peak.i])}" r="5" fill="var(--bnc)"/>`;
    s+=`<g class="guide" opacity="0"><line y1="${padT}" y2="${H-padB}" stroke="var(--muted)" stroke-width="1"/><circle r="4" fill="var(--bnc)"/></g>`;
    let html=s+'</svg><div class="tip" hidden></div>';
    if(peak)html+=`<div class="peak" style="${anchorStyle(X(peak.i)/W)}"><b>${esc(peak.title)}</b>${peak.sub?`<br><span>${esc(peak.sub)}</span>`:''}</div>`;
    el.innerHTML=html;

    el.onpointermove=e=>{
      const i=Math.round((e.clientX-el.getBoundingClientRect().left-padL)/((W-padL-padR)/Math.max(1,n-1)));
      if(i<0||i>=n){el.onpointerleave();return}
      g.setAttribute('opacity',1);g.querySelector('line').setAttribute('x1',X(i));g.querySelector('line').setAttribute('x2',X(i));
      const c=g.querySelector('circle');c.setAttribute('cx',X(i));c.setAttribute('cy',Y(cur[i]));
      t.hidden=false;t.innerHTML=`${day(i)}: <b>${fmt(cur[i])}</b>${prev?`<br><span class="muted">${DAYS} days earlier: ${fmt(prev[i])}</span>`:''}`;
      t.style.left=Math.min(W-t.offsetWidth/2,Math.max(t.offsetWidth/2,X(i)))+'px';t.style.top=Y(cur[i])+'px';
    };
    el.onpointerleave=()=>{g.setAttribute('opacity',0);t.hidden=true};
  });
}

// A waterfall from 0: each step starts where the last ended, then a total bar from 0.
// steps: [{kind:'named'|'mover'|'mix'|'else'|'total', label, value}]
// openOf(step): what clicking that step does (given the button), or null when it opens nothing. Each step that
// opens something gets a button over its bar and labels, as treemap blocks are buttons, so keys reach it too.
function drawSteps(el,steps,{fmt,aria,colorOf,openOf=()=>null}){
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const slot=W/steps.length,fit=Math.max(6,Math.floor(slot/6.6));
    // Names too long for their slot wrap onto a second line at a space.
    const names=steps.map(st=>{
      if(st.label.length<=fit||!st.label.includes(' '))return [shorten(st.label,fit)];
      const cut=st.label.lastIndexOf(' ',fit)>0?st.label.lastIndexOf(' ',fit):st.label.indexOf(' ');
      return [st.label.slice(0,cut),shorten(st.label.slice(cut+1),fit)];
    });
    const padT=26,padB=names.some(n=>n.length>1)?38:24;
    let acc=0;
    const geo=steps.map(s=>{if(s.kind==='total')return {a:0,b:s.value};const a=acc;acc+=s.value;return {a,b:acc}});
    const ends=geo.flatMap(g=>[g.a,g.b]),lo=Math.min(0,...ends),hi=Math.max(0,...ends),span=hi-lo||1;
    const Y=v=>padT+(H-padT-padB)*(hi-v)/span;
    const bw=Math.min(70,slot*.62),x=i=>i*slot+(slot-bw)/2;
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(aria)}"><line x1="0" x2="${W}" y1="${Math.round(Y(0))+.5}" y2="${Math.round(Y(0))+.5}" stroke="var(--rule)"/>`;
    geo.forEach((g,i)=>{
      const st=steps[i],y=Math.min(Y(g.a),Y(g.b)),h=Math.max(2,Math.abs(Y(g.a)-Y(g.b))),total=st.kind==='total';
      s+=`<rect x="${x(i)}" y="${y}" width="${bw}" height="${h}" rx="${h>6?3:0}" fill="${colorOf(st)}"><title>${esc(st.label)}: ${esc(fmt(st.value,total))}</title></rect>`;
      if(i<geo.length-1)s+=`<line x1="${x(i)+bw}" x2="${x(i+1)}" y1="${Y(g.b)}" y2="${Y(g.b)}" stroke="var(--rule)" stroke-dasharray="3 3"/>`;
      s+=`<text x="${x(i)+bw/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="700" fill="${st.kind==='else'?'var(--muted)':'var(--ink)'}">${esc(fmt(st.value,total))}</text>`;
      s+=`<text x="${x(i)+bw/2}" y="${H-padB+18}" text-anchor="middle" font-size="12" fill="${total?'var(--ink)':'var(--muted)'}"${total?' font-weight="600"':''}>${names[i].map((t,k)=>`<tspan x="${x(i)+bw/2}" dy="${k?14:0}">${esc(t)}</tspan>`).join('')}</text>`;
    });
    el.innerHTML=s+'</svg>';
    geo.forEach((g,i)=>{
      const st=steps[i],open=openOf(st);if(!open)return;
      const top=Math.max(0,Math.min(Y(g.a),Y(g.b))-26),b=document.createElement('button');
      b.type='button';b.className='step';b.title=`${st.label}: ${fmt(st.value,st.kind==='total')}`;
      Object.assign(b.style,{left:x(i)-4+'px',top:top+'px',width:bw+8+'px',height:H-top+'px'});
      b.setAttribute('aria-label',`${b.title}. Zoom in`);
      b.onclick=e=>{e.stopPropagation();open(b)};
      el.appendChild(b);
    });
  });
}

// Rows of ten squares: the filled share is how many of every 10 visits left after one page.
let clipN=0;
function squaresSVG(pct,size,gap,fill){
  const k=Math.max(0,Math.min(10,pct*10)),full=Math.floor(k),frac=k-full,r=Math.round(size*.18),w=10*size+9*gap;
  const at=i=>i*(size+gap);
  let s=`<svg width="${w}" height="${size}" aria-hidden="true">`;
  for(let i=0;i<10;i++)s+=`<rect x="${at(i)}" width="${size}" height="${size}" rx="${r}" fill="var(--bnc-p)"/>`;
  for(let i=0;i<full;i++)s+=`<rect x="${at(i)}" width="${size}" height="${size}" rx="${r}" fill="${fill}"/>`;
  if(frac>.02){const id=`sq${++clipN}`;s+=`<clipPath id="${id}"><rect x="${at(full)}" width="${(frac*size).toFixed(1)}" height="${size}"/></clipPath><rect x="${at(full)}" width="${size}" height="${size}" rx="${r}" fill="${fill}" clip-path="url(#${id})"/>`}
  return s+'</svg>';
}
// rows: [{pct, label, story, aria, open}]; pct null (no visits) shows a dash over empty squares.
function drawSquares(el,rows){
  el.innerHTML='<div class="sqs"></div>';
  const box=el.firstChild;
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    // Narrow boxes put the squares on their own line under the number, so they can use the full width.
    const under=W<320,stack=!under&&W<420,text=under?0:stack?72:140,n=rows.length,line=under?22:0;
    // Squares and their gaps shrink together; a gap is about a quarter of a square.
    const size=Math.max(6,Math.min(22,Math.floor((W-text-(under?0:12))/12.1),Math.floor((H-(n-1)*8)/n)-line)),gap=Math.max(2,Math.round(size*.23));
    box.style.gap=Math.min(20,Math.max(6,(H-n*(size+line))/(n+1)))+'px';
    box.replaceChildren(...rows.map(r=>{
      const b=document.createElement('button');b.type='button';b.className='sqrow'+(under?' under':stack?' stack':'');
      b.innerHTML=`<span class="sq-num"${under?'':` style="width:${text}px"`}><b${r.story?' class="told"':''}>${r.pct==null?'–':fmtPct(r.pct)}</b><span class="sq-label">${esc(r.label)}</span></span>${squaresSVG(r.pct||0,size,gap,r.fill||'var(--bnc)')}`;
      b.setAttribute('aria-label',r.aria);
      b.onclick=e=>{e.stopPropagation();r.open(b)};
      return b;
    }));
  });
}

/* ---------- zoom stack ---------- */
const win=$('#win');
const stack=[{el:$('#home'),title:''}];
let animating=false,skipMotion=false,pendingPop=false;

// Every period switch, on home and on each sub-page, does the same: every open view redraws for the new period.
const markPeriods=()=>document.querySelectorAll('.period button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.days)===DAYS));
function bindPeriod(el){
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const d=Number(b.dataset.days);if(d===DAYS)return;
    DAYS=d;markPeriods();
    history.replaceState(history.state,'',urlFor(stack[stack.length-1].vw||null));
    redrawAll(`Showing the last ${DAYS} days`);
  });
  markPeriods();
}
// Sub-pages read what home worked out (its story, its events), so they redraw once home has.
// Resolves true when this redraw is still the current one.
function redrawAll(message){
  const layers=stack.slice(1);
  layers.forEach(s=>s.el.querySelector('.layer-body').classList.add('busy'));
  return renderHome(stack.length>1?'':message).then(async current=>{
    layers.forEach(s=>s.el.querySelector('.layer-body').classList.remove('busy'));
    if(!current)return false;
    await Promise.all(stack.slice(1).map(s=>s.render?.(s.el.querySelector('.layer-body'))));
    if(stack.length>1&&message)announce(message);
    return true;
  });
}
const PERIOD='<div class="period" role="group" aria-label="Period"><button type="button" data-days="7">7 days</button><button type="button" data-days="30">30 days</button></div>';

function zoom(src,{title,render,chip,vw=null,instant=false,fromHistory=false}){
  if(animating)return;
  animating=true;
  grow(false);
  const parent=stack[stack.length-1].el;
  const crumb=stack.map(s=>s.title).join(' › ');
  const layer=document.createElement('section');
  layer.className='layer';
  layer.setAttribute('role','dialog');layer.setAttribute('aria-label',title);
  layer.innerHTML=`<div class="inner"><header class="layer-head"><button class="circle back" aria-label="Zoom out">${BACK}</button>
    <div class="crumbs"><span>${esc(crumb)} ›</span><h2>${esc(title)}</h2></div>${chip?`<span class="chip">${esc(chip)}</span>`:PERIOD}</header>
    <div class="layer-body"></div></div>`;
  layer.style.visibility='hidden';
  win.appendChild(layer);
  layer.querySelector('.back').onclick=goBack;
  if(!chip)bindPeriod(layer.querySelector('.period'));
  stack.push({el:layer,src,title,render,vw});
  if(!fromHistory)history.pushState({depth:stack.length-1},'',urlFor(vw));
  skipMotion=instant;
  const ready=render(layer.querySelector('.layer-body'));
  // Wait briefly for the content, so the window takes its final height before the zoom starts
  // instead of jumping once the animation has ended.
  Promise.race([ready,new Promise(r=>setTimeout(r,300))]).then(()=>{
    layer.style.visibility='';
    const h0=win.offsetHeight;
    grow(true);
    run(parent,layer,src,true,h0);
  });
}
// Scrolls the page to the top smoothly and resolves when it gets there, so a view change never starts with a jump.
function scrollHome(){
  return new Promise(res=>{
    if(scrollY<1||motion.matches){scrollTo(0,0);res();return}
    scrollTo({top:0,behavior:'smooth'});
    const t0=performance.now(),check=()=>scrollY<1||performance.now()-t0>800?res():requestAnimationFrame(check);
    requestAnimationFrame(check);
  });
}
// The top sub-page leaves the window's fixed frame and takes the room its content needs.
// Home keeps its own height underneath, so it doesn't stretch while it zooms away.
function grow(on){
  for(const s of stack)s.el.classList.remove('grown'),s.el.style.minHeight='';
  win.classList.remove('grow');win.style.minHeight='';stack[0].el.style.height='';
  if(!on||stack.length<2)return;
  const homeH=win.offsetHeight,top=stack[stack.length-1].el;
  // On phones the window is as long as the home screen, so a sub-page only needs to fill the screen.
  const h=Math.min(homeH,Math.max(innerHeight-48,860));
  stack[0].el.style.height=homeH+'px';
  win.style.minHeight=top.style.minHeight=h+'px';
  win.classList.add('grow');top.classList.add('grown');
}
async function back(){
  if(animating||stack.length<2)return;
  animating=true;
  // Back to the top of the sub-page first, so the zoom out starts from what it looked like when it opened.
  await scrollHome();
  const h0=win.offsetHeight;
  const {el:layer,src}=stack.pop(),parent=stack[stack.length-1].el;
  layer.classList.remove('grown');layer.style.minHeight='';
  grow(true);
  parent.style.visibility='';parent.inert=false;
  run(parent,layer,src,false,h0);
}
// Tiles are not focusable themselves, so focus returns to their title button.
const focusTarget=src=>src.classList.contains('tile')?src.querySelector('.tile-title'):src;
// h0: the window's height before this change; it eases to the new height with the zoom instead of snapping.
function run(parent,layer,src,opening,h0){
  const done=()=>{
    animating=false;
    // The entry may be from before a period or site change; the address says what's on screen now.
    if(pendingPop){pendingPop=false;queueMicrotask(followHistory)}
    else if((history.state?.depth||0)===stack.length-1)history.replaceState(history.state,'',urlFor(stack[stack.length-1].vw||null));
    if(opening){parent.style.visibility='hidden';parent.inert=true;layer.querySelector('.back').focus({preventScroll:true});scrollHome()}
    else{
      release(layer);layer.remove();
      // The element that opened the layer may have been redrawn meanwhile; fall back to the layer below.
      const to=src.isConnected?focusTarget(src):parent.querySelector('.back')||parent.querySelector('.tile-title');
      to?.focus({preventScroll:true});
      // Back where the reader was, if the element they opened sits below the fold.
      if(to&&to.getBoundingClientRect().bottom>innerHeight)to.scrollIntoView({block:'center',behavior:motion.matches?'auto':'smooth'});
    }
  };
  if(motion.matches||skipMotion||!src.isConnected){skipMotion=false;done();return}
  animating=true;
  const wr=win.getBoundingClientRect(),r=src.getBoundingClientRect();
  const t=r.top-wr.top,l=r.left-wr.left,rr=wr.right-r.right,b=wr.bottom-r.bottom;
  const rad=parseFloat(getComputedStyle(src).borderRadius)||12;
  const ox=l+r.width/2,oy=t+r.height/2,dx=ox-wr.width/2,dy=oy-wr.height/2;
  const s=Math.max(.3,Math.min(r.width/wr.width,r.height/wr.height));
  const opt={duration:opening?560:480,easing:'cubic-bezier(.22,.9,.24,1)',direction:opening?'normal':'reverse',fill:'both'};

  // The tile's own preview grows and fades while the detail view fades in behind it.
  const ghost=src.cloneNode(true);
  ghost.removeAttribute('id');ghost.setAttribute('aria-hidden','true');ghost.classList.add('ghost');
  Object.assign(ghost.style,{left:l+'px',top:t+'px',width:r.width+'px',height:r.height+'px',right:'auto',bottom:'auto',transform:'none'});
  layer.appendChild(ghost);
  const inner=layer.querySelector('.inner');

  parent.style.transformOrigin=`${ox}px ${oy}px`;
  const anims=[
    layer.animate([{clipPath:`inset(${t}px ${rr}px ${b}px ${l}px round ${rad}px)`},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],opt),
    inner.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`},{transform:'none'}],opt),
    inner.animate([{opacity:0},{opacity:0,offset:.18},{opacity:1}],opt),
    ghost.animate([{transform:'none',opacity:1},{transform:`translate(${-dx}px,${-dy}px) scale(${1/s})`,opacity:0,offset:.55},{transform:`translate(${-dx}px,${-dy}px) scale(${1/s})`,opacity:0}],opt),
    parent.animate([{transform:'none',opacity:1},{transform:'scale(1.08)',opacity:.5}],opt),
  ];
  const h1=win.offsetHeight;
  if(h0&&h0!==h1)anims.push(win.animate([{height:h0+'px'},{height:h1+'px'}],{duration:opt.duration,easing:opt.easing}));
  anims[0].finished.then(()=>{anims.forEach(a=>a.cancel());ghost.remove();parent.style.transformOrigin='';done()});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});
// Zooming out goes through the browser's history, so the back button and the dashboard's own back agree.
function goBack(){if(animating||stack.length<2)return;if((history.state?.depth||0)>0)history.back();else back()}
// A Back pressed while a zoom is still moving waits for it to finish, so no press is lost.
function followHistory(){
  if(animating){pendingPop=true;return}
  const depth=history.state?.depth||0;
  if(depth<stack.length-1){
    // Several steps back at once: the layers in between go without a zoom of their own.
    while(stack.length-2>depth){const [s]=stack.splice(stack.length-2,1);release(s.el);s.el.remove()}
    back();
  }
  else if(depth>stack.length-1){const {view:vw}=urlToView(location.pathname,location.search);if(vw)openView(vw,stack[stack.length-1].el,{fromHistory:true})}
}
addEventListener('popstate',followHistory);

/* ---------- views ---------- */
// Each draw of a view gets a number; renderers check it after waiting, so an older, slower reply never
// overwrites a newer one (switching 7 → 30 → 7 days quickly, say).
const stale=(body,gen)=>gen!==body._gen;
async function view(body,fn){
  release(body);
  const gen=body._gen=(body._gen|0)+1;
  body.innerHTML='<div class="state">Loading…</div>';
  try{await fn(body)}catch(e){if(!stale(body,gen))showError(body,e,()=>view(body,fn))}
}

// subj colours the bar after each name (its length is the value against the largest row).
// goalable: rows are pages, and each gets a flag to track it as a goal.
// named: keys this page's own sentence names; they are bold, as in every list.
function rowsInto(group,rows,{fmt=fmtInt,total,inverse=false,onClick,subj='time',goalable=false,named=new Set()}){
  if(!rows.length){group.innerHTML='<div class="muted">Nothing here yet.</div>';return}
  const max=maxOf(rows.map(r=>r.value))||1;
  group.className='list';
  const head=document.createElement('div');head.className='lrow lhead';head.setAttribute('aria-hidden','true');
  head.innerHTML='<span></span><span></span><span>visitors</span><span>share</span><span>change</span><span></span>';
  const flagged=el=>{
    if(!goalable)return el;
    const w=document.createElement('div');w.className='lwrap';
    const t=document.createElement(el===head?'span':'button');
    if(el!==head){t.type='button';t.className='goal-t';t.dataset.path=el.dataset.key;paintGoalToggle(t);t.onclick=()=>toggleGoal(t.dataset.path)}
    w.append(t,el);return w;
  };
  group.replaceChildren(flagged(head),...rows.map(r=>{
    const el=document.createElement(onClick?'button':'div');
    if(onClick)el.type='button';
    el.className='lrow';el.dataset.key=r.key;
    el.innerHTML=`<span class="name">${named.has(r.key)?`<b>${esc(r.label)}</b>`:esc(r.label)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</span>
      <span class="bar"><i style="width:${(r.value/max*100).toFixed(1)}%;background:var(--${subj})"></i></span>
      <span class="num">${fmt(r.value)}</span><span class="pct">${total?Math.round(r.value/total*100):0}%</span>
      ${delta(r.value,r.prev,inverse)}${onClick?CHEV:'<span></span>'}`;
    if(onClick){el.setAttribute('aria-label',`${r.label}, ${fmt(r.value)}. Zoom in`);el.onclick=()=>onClick(r,el)}
    return flagged(el);
  }));
}

// Rates on a 0–100% track, with last period's value beside them; the named one at full strength.
function rateRows(group,rows){
  if(!rows.length){group.innerHTML='<div class="muted">Nothing here yet.</div>';return}
  group.className='list';
  const head=document.createElement('div');head.className='lrow rate lhead';head.setAttribute('aria-hidden','true');
  head.innerHTML='<span></span><span></span><span>bounce</span><span>change</span><span></span>';
  group.replaceChildren(head,...rows.map(r=>{
    const b=document.createElement('button');b.type='button';b.className='lrow rate';
    b.innerHTML=`<span class="name">${r.story?`<b>${esc(r.label)}</b>`:esc(r.label)}</span>
      <span class="bar"><i style="width:${(r.value*100).toFixed(1)}%;background:var(--bnc)"></i></span>
      <span class="num">${fmtPct(r.value)}</span><span class="was">${r.prev!=null?pts(r.value,r.prev):'new'}</span>${CHEV}`;
    b.setAttribute('aria-label',`${r.label}: ${fmtPct(r.value)}${r.prev!=null?`, was ${fmtPct(r.prev)}`:', new'}. Zoom in`);

}

// Every view is described by a small object ({v:'bounce'}, {v:'filter',f:{path}}…) that routes.js turns into its
// address; all ways into a view go through openView, so each one gets its URL and a refresh reopens it.
function viewOptions(vw){
  switch(vw.v){
    case 'overview':return {title:'Overview',render:b=>view(b,x=>renderFilter(x,{}))};
    case 'bounce':return {title:'Bounce',render:b=>view(b,renderBounce)};
    case 'online':return {title:'Online',chip:'Live',render:b=>view(b,renderOnline)};
    case 'sources':case 'pages':return {title:vw.v[0].toUpperCase()+vw.v.slice(1),render:b=>view(b,x=>renderDim(x,vw.v))};
    case 'events':return HOME?.events?{title:'What happened',render:x=>renderEvents(x,vw.pick?HOME.events.filter(vw.pick):HOME.events,HOME.ser)}:null;
    case 'filter':{
      const f=vw.f,source=(f.referrer!=null)!==(f.channel!=null)&&f.path==null;
      const title=vw.label||(f.path!=null?f.path:f.channel!=null?labelOf('channel',f.channel):labelOf('referrer',f.referrer));
      return {title:source?(f.channel!=null?labelOf('channel',f.channel):labelOf('referrer',f.referrer)):title,render:b=>view(b,x=>source?renderSource(x,f):renderFilter(x,f))};
    }
  }
  return null;
}
function openView(vw,src,opts={}){
  // A source with a channel beside it (/sources/google.com?channel=search) is the source's view: its numbers
  // are that source's, so naming the channel would credit them to every source in it.
  if(vw.v==='filter'&&vw.f.path==null&&vw.f.referrer!=null&&vw.f.channel!=null)vw={...vw,f:{referrer:vw.f.referrer}};
  const o=viewOptions(vw);if(o)zoom(src,{...o,vw,...opts});
}
const urlFor=vw=>viewToUrl(vw,{days:DAYS,site:SITES.length>1?SITE:null});
const openFilter=(f,label,src)=>openView({v:'filter',f,label},src);
const openOverview=src=>openView({v:'overview'},src);
const openBounce=src=>openView({v:'bounce'},src);
const openOnline=src=>openView({v:'online'},src);

// A card listing pages or sources for filter f; the full view adds a switch between ways of counting.
// A card's switch between lists: names, the one on at first; pick(i) runs on a press.
const segHTML=(label,names,on=0)=>`<div class="seg" role="group" aria-label="${label}">${names.map((l,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===on}">${l}</button>`).join('')}</div>`;
function onSeg(sec,pick){
  const bs=[...sec.querySelectorAll('.seg button')];
  bs.forEach(bt=>bt.onclick=()=>{bs.forEach(x=>x.setAttribute('aria-pressed',x===bt));pick(+bt.dataset.i)});
}

// boldKeys: the keys the page's sentence names (channels as ch:key, like the home sentence's).
function dimSection(sec,group,f,compact,boldKeys=null){
  const modes=group==='pages'?[['Viewed','path'],['Landed on','entry'],['Left from','exit']]:[['Sites','referrer'],['Channels','channel']];
  let mode=modes[0][1];
  sec.className='card';
  sec.innerHTML=`<div class="card-head">${compact?`<div class="card-title">${group==='pages'?'Pages':'Sources'}</div>`:''}
    ${compact?'':segHTML('Breakdown',modes.map(m=>m[0]))}</div>
    <div class="dim-body"></div>`;
  const body=sec.querySelector('.dim-body');
  let gen=0;
  const draw=()=>{const g=++gen;return view(body,async b=>{
    const data=await api('breakdown',{...filterParams(f),dim:mode});
    if(g!==gen)return;
    const rows=data.rows.map(r=>({key:r.key,dim:mode,label:labelOf(mode,r.key),value:r.visitors,prev:r.prev?.visitors}));
    const total=rows.reduce((a,r)=>a+r.value,0);
    const go=r=>el=>openFilter({...f,[FILTER_OF[r.dim]]:r.key},r.label,el);
    b.innerHTML='<div></div>';
    // Only the overview repeats home's sentence, so only its lists bold what that sentence names.
    const overview=compact&&f.path==null&&f.referrer==null&&f.channel==null&&HOME&&!HOME.empty;
    const named=new Set(boldKeys?rows.filter(r=>boldKeys.has(r.dim==='channel'?'ch:'+r.key:r.key)).map(r=>r.key)
      :overview?rows.filter(r=>r.dim==='channel'?HOME.T.told.has('ch:'+r.key):r.dim==='referrer'?HOME.T.told.has(r.key):r.key===HOME.T.page).map(r=>r.key):[]);
    rowsInto(b.firstChild,compact?rows.slice(0,8):rows,{total,subj:group==='pages'?'page':'src',goalable:group==='pages',named,onClick:(r,el)=>go(r)(el)});
    if(compact&&rows.length>8){
      const more=document.createElement('button');more.type='button';more.className='more-link';more.innerHTML=`<span>All ${rows.length} ${group}</span>${CHEV}`;
      more.onclick=()=>openView({v:group},more);
      b.appendChild(more);
    }
  })};
  onSeg(sec,i=>{mode=modes[i][1];draw()});
  return draw();
}

// The top of every slice: one big number, then the rest, straight on the page.
const heroHTML=(c,pr)=>`<div class="nums"><div class="hero"><span class="big">${fmtInt(c.visitors)}</span><span>visitors <b>${changeWord(c.visitors,pr.visitors)}</b></span></div>${numsHTML(c,pr)}</div>`;
// Links in a generated sentence open the slice they name.
function bindLinks(root){
  root.querySelectorAll('.link').forEach(b=>{
    b.onclick=()=>openFilter({[b.dataset.f]:b.dataset.k},b.textContent,b);
    // A link is a button, so a full stop right after it could wrap onto a line of its own; keep them together.
    const t=b.nextSibling,m=t?.nodeType===3&&t.data.match(/^[.,;:]/);
    if(m){const w=document.createElement('span');w.style.whiteSpace='nowrap';b.replaceWith(w);w.append(b,m[0]);t.data=t.data.slice(1)}
  });
}

// The overview, a page, or a channel: the sentence, the numbers, visitors per day, then what's inside.
async function renderFilter(body,f){
  const gen=body._gen,p=filterParams(f),overview=f.path==null&&f.referrer==null&&f.channel==null;
  const [totals,ser,hourly,flows,all]=await Promise.all([api('summary',p),api('series',p),overview?api('hourly'):null,f.path!=null?api('flows'):null,f.channel!=null?api('summary'):null]);
  if(stale(body,gen))return;
  const c=totals.cur,pr=totals.prev;
  const into=flows?flows.flows.filter(x=>x.page===f.path):[];
  // A single page's chart marks the events about that page, the way the overview marks all of them.
  const pick=e=>e.kind==='page'&&e.key===f.path,own=HOME&&f.path!=null&&f.referrer==null&&f.channel==null?HOME.events.filter(pick):[];
  const say=overview?(HOME?.T.html||''):f.path!=null?pageStory(totals,into,f.path)
    :sourceStory(totals,ser,labelOf('channel',f.channel),DAYS).html+(all?' '+(channelShare(totals,all,labelOf('channel',f.channel))||''):'');
  body.innerHTML=`<p class="say">${say}</p>${heroHTML(c,pr)}
    <section class="card"><div class="card-head"><div class="card-title">Visitors per day${pr.visitors?` vs the ${DAYS} days before`:''}</div>${overview&&HOME?'<span class="tile-key">Pick a day to note what you did</span>':''}</div><div class="chart"></div>${overview&&HOME?'<div class="marks"></div>':own.length?'<div class="marks own"></div>':''}</section>
    ${overview&&HOME?`<section class="card"><div class="card-title">What happened</div>${HOME.events.length?'<div class="events-list"></div>':`<p class="muted" style="margin:0">Nothing unusual in the last ${DAYS} days.</p>`}</section>`:''}
    ${overview?'<section class="card"><div class="card-title heat-title">By weekday and hour</div><div class="chart"></div></section>':''}
    ${f.path!=null?'<section class="card"><div class="card-title">Where readers came from, and where they went next</div><p class="cross-say"></p><div class="landed cross"></div><p class="say-sub landed-note"></p></section>':''}
    ${f.path!=null?'<section class="card goal-card" hidden></section>':''}
    ${f.path==null?'<section data-group="pages"></section>':''}
    ${f.referrer==null&&f.path==null?'<section data-group="sources"></section>':''}${overview?'<section class="card kw" hidden></section>':''}
    ${overview?'<section class="card aud" hidden></section>':''}`;
  bindLinks(body.querySelector('.say'));
  const cur=ser.cur.visitors,busiest=cur.indexOf(maxOf(cur));
  // On the overview the markers row carries the dates, as on home.
  const marks=body.querySelector('.marks:not(.own)'),ownMarks=body.querySelector('.marks.own');
  if(marks){drawDays(body.querySelector('.chart'),HOME.S,HOME.ser,{scale:true});noteDays(body.querySelector('.chart'),HOME.ser)}
  else{
    const spike=findSpike(cur,ser.start),usual=median(cur);
    const label=spike>=0?{i:spike,title:`${fmtDate(dayDate(ser.start,spike))} · ${fmtInt(cur[spike])}`,sub:`${Math.round(cur[spike]/(usual||1))}× a usual day`}:null;
    dayBars(body.querySelector('.chart'),{cur,prev:pr.visitors?ser.prev.visitors:null,start:ser.start,axis:!ownMarks,scale:true,label,subj:f.path!=null?'page':f.channel!=null?'src':'time',
      aria:`Visitors per day. Busiest: ${fmtDate(dayDate(ser.start,busiest))} with ${fmtInt(cur[busiest])}.`});
  }
  if(ownMarks)drawMarks(ownMarks,own,HOME.ser,pick);
  if(overview&&HOME){
    const charts=body.querySelectorAll('.chart');
    if(drawHeat(charts[1],HOME.S,HOME.ser,hourly)&&HOME.S.spike>=0)
      body.querySelector('.heat-title').innerHTML+=` · <span class="ring"></span> mostly visitors on ${fmtDate(dayDate(HOME.ser.start,HOME.S.spike))}`;
  }
  if(marks){
    drawMarks(marks,HOME.events,HOME.ser);
    body.querySelector('.events-list')?.replaceChildren(...HOME.events.map(e=>eventButton(e,HOME.ser,true)));
  }
  if(f.path!=null){
    const card=body.querySelector('.goal-card');card.dataset.path=f.path;drawGoalCard(card,f.path);
    // The page's sentence names the source most of its visitors arrived from; that one is emphasised.
    const by=new Map();for(const x of into)by.set(x.source,(by.get(x.source)||0)+x.visitors);
    const lead=[...by].sort((a,b)=>b[1]-a[1])[0];
    const landed=sum(into.map(x=>x.visitors)),cross=body.querySelector('.cross'),note=body.querySelector('.landed-note');
    const from=cameFromItems(into,new Set(lead&&landed>=20?[lead[0]]:[]),c.visitors);
    drawCrossing(cross,from,[]);
    const arrived=landed&&c.visitors>landed?`${fmtInt(landed)} of the ${fmtInt(c.visitors)} visitors started their visit here; the rest arrived from another page.`:'';
    note.textContent=arrived;
    // Two queries, so it comes in after the rest.
    api('next',p).then(n=>{
      if(stale(body,gen))return;
      const st=nextStory(n);
      if(!st)return;
      body.querySelector('.cross-say').innerHTML=st.html;
      if(st.note)note.textContent=arrived?`${arrived} ${st.note}`:st.note;
      drawCrossing(cross,from,nextItems(n.cur,st.told),{shares:true});
    },()=>{});
  }
  body.querySelectorAll('[data-group]').forEach(sec=>dimSection(sec,sec.dataset.group,f,true));
  // Neither is needed to read the rest, so they come in after it and are left out if they fail.
  if(f.path!=null)api('engagement',p).then(e=>{
    const r=e.rows.find(x=>x.key===f.path);
    if(stale(body,gen)||!r?.views)return;
    const n=(k,v,sub,tip)=>`<div class="num" title="${tip}"><span class="k">${k}</span><span class="v">${v}</span><span class="delta">${sub}</span></div>`;
    body.querySelector('.nums').insertAdjacentHTML('beforeend',
      n('Time on page',fmtDur(r.time),r.prev?changeWord(r.time,r.prev.time):'new','On average, counting only while the page was on screen and in front')
      +n('Scrolled',fmtPct(r.scroll),r.prev?pts(r.scroll,r.prev.scroll):'new','How far down the page people got, on average'));
    drawReach(body,r);
  },()=>{});
  if(overview)api('audience').then(A=>{if(!stale(body,gen))drawAudience(body.querySelector('.aud'),A)},()=>{});
  if(overview)api('keywords').then(K=>{if(!stale(body,gen))drawKeywords(body.querySelector('.kw'),K)},()=>{});
  if(overview||f.path!=null)api('links',p).then(L=>{if(!stale(body,gen))drawLinks(body,L,c.visitors)},()=>{});
}

// How far down the page is read: a bar per tenth of the page, as wide as the share still reading, then, paler,
// those who stopped in that tenth; solid where the sentence names the drop. Too few reads get the sentence alone.
function drawReach(body,r){
  const S=scrollStory(r),R=r.reach;if(!S)return;
  const sec=document.createElement('section');sec.className='card';
  sec.innerHTML=`<div class="card-title">How far down people read</div><div class="reach-body"><div><p class="card-say">${S.html}</p>${S.sub?`<p class="say-sub">${S.sub}</p>`:''}</div>${S.few?'':`<div class="reach" role="img" aria-label="Still reading at each tenth of the page: ${R.map(fmtPct).join(', ')}">`
    +R.map((x,i)=>`<span>${['Top',,,,'Middle',,,,,'End'][i]||''}</span><i title="${i+1}0% of the way down: ${fmtPct(x)} still reading"${i===S.drop?' class="on"':''}><b style="width:${x*100}%"></b><u style="width:${((R[i-1]??1)-x)*100}%"></u></i><span>${fmtPct(x)}</span>`).join('')+'</div>'}</div>`;
  body.querySelector('.nums').after(sec);
}

// Where readers are and what they use: the finding, then each list as one strip of shares, the row it names solid.
function drawAudience(sec,A){
  const S=audienceStory(A);if(!S)return;
  sec.innerHTML=`<div class="card-title">Where readers are and what they use</div><p class="sentence">${S.html}</p>${[['Countries','country'],['Devices','device'],['Browsers','browser']].map(([t,dim])=>{
    const rows=A[dim].filter(r=>r.visitors),all=sum(rows.map(r=>r.visitors)),on=rows.find(r=>dim==S.dim&&r.key==S.key),far=rows.indexOf(on)>3;
    const top=rows.slice(0,far?3:4).concat(far?[on]:[]).map(r=>[labelOf(dim,r.key),r.visitors,r==on]),n=rows.length-top.length;

      <p>${top.map(([l,v,b])=>`<span>${b?`<b>${esc(l)}</b>`:esc(l)} ${fmtPct(v/all)}</span>`).join('')}</p></div>`:''}).join('')}<p class="say-sub">${audienceNote(A,DAYS)}</p>`;
  sec.hidden=false;

// Links to other sites and files people clicked, as a share of the visitors; a switch when there are both.
function drawLinks(body,L,visitors){
  const modes=[['Other sites',L.outbound],['Downloads',L.downloads]].filter(m=>m[1].length);

// Words searched on the site or paid for in ads: a sentence, the top 5 (the rest open in place), what can't be known.

    <p class="card-say"></p><div></div><p class="say-sub"></p>`;
  const [,say,list,note]=sec.children;
  const draw=(k,open)=>{
    const C=keywordsCard(K,k,open);
    say.innerHTML=C.say;say.hidden=!C.say;
    list.innerHTML=C.empty?`<p class="muted" style="margin:0">${esc(C.empty)}</p>`:'<div></div>';
    if(!C.empty){rowsInto(list.firstChild,C.rows,{total:C.total,subj:k==='site'?'muted':'src'});list.firstChild.classList.add('kw')}
    if(C.all){
      list.insertAdjacentHTML('beforeend',`<button type="button" class="more-link" aria-expanded="false"><span>All ${C.all} words</span>${CHEV}</button>`);
      list.lastChild.onclick=()=>{draw(k,1);const r=list.firstChild.children[6];r.tabIndex=-1;r.focus()};
    }
    note.textContent='Google doesn’t share what people searched for to find you.'+(k==='site'&&!C.empty?' Words only one person used, emails and phone numbers are left out.':'');
  };
  onSeg(sec,i=>draw(ks[i]));
  draw(k0);
}

// Sources open with where the change came from; pages with the page that moved most.
function renderDim(body,group){
  const W=group==='sources'&&HOME?waterfall(HOME.S,HOME.T.told):null;
  body.innerHTML=`<p class="say"></p>${W?`<section class="card"><div class="card-title">Change in visitors vs the ${DAYS} days before</div><div class="steps"></div></section>`:''}<section></section>`;
  const say=body.querySelector('.say');
  const cap=W?waterfallCaption(W,HOME.S):group==='pages'&&HOME?.pageRows?pagesFinding(HOME.pageRows,HOME.T.page)??pagesCaption(HOME.pageRows.slice(0,6)):null;
  if(cap?.html)say.innerHTML=cap.html+'.';else say.remove();
  if(W)drawGrowth(body.querySelector('.steps'),W);
  // The list bolds whatever this page's sentence names.

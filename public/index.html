// One source fanning out into the pages its visitors landed on.
function drawLanded(el,flows,toldPage,pageRows){
  const byPage=new Map();
  for(const f of flows)byPage.set(f.page,(byPage.get(f.page)||0)+f.visitors);
  const ranked=[...byPage].sort((a,b)=>b[1]-a[1]);
  let top=ranked.slice(0,5);
  if(toldPage&&byPage.has(toldPage)&&!top.some(r=>r[0]===toldPage))top=[...top.slice(0,4),[toldPage,byPage.get(toldPage)]];
  top.sort((a,b)=>(b[0]===toldPage)-(a[0]===toldPage)||b[1]-a[1]);
  const rest=ranked.filter(r=>!top.includes(r));
  const items=top.map(([k,v])=>({key:k,label:k,value:v,story:k===toldPage,sub:!pageRows.find(r=>r.key===k)?.prev?'new page':''}));
  if(rest.length)items.push({key:null,label:`${rest.length} other ${rest.length===1?'page':'pages'}`,value:sum(rest.map(r=>r[1]))});
  drawCrossing(el,[],items,{edge:true,bar:'src'});
}

// The sources of visits that landed on a page, and visitors who came from another page.
function cameFromItems(flows,told,visitors){
  const bySrc=new Map();
  for(const f of flows)bySrc.set(f.source,(bySrc.get(f.source)||0)+f.visitors);
  const ranked=[...bySrc].sort((a,b)=>b[1]-a[1]),top=ranked.slice(0,4),rest=ranked.slice(4),landed=sum(ranked.map(r=>r[1]));
  const items=top.map(([k,v])=>({key:k,label:labelOf('referrer',k),value:v,kind:'src',story:told.has(k),hint:pageHint(labelOf('referrer',k),v)}));
  if(rest.length)items.push({key:null,label:`${rest.length} other ${rest.length===1?'source':'sources'}`,value:sum(rest.map(r=>r[1])),kind:'src'});
  if(visitors>landed)items.push({key:null,label:'Your other pages',value:visitors-landed,kind:'page',hint:`${fmtInt(visitors-landed)} visitors came from another page`});
  return items;
}

// Where readers came from fans into a bar from the left, where they went next out to the right, each side as
// shares of its own total. edge: no left side, bar at the left edge. INK: ribbon, named ribbon, bar, named bar.
const INK={src:['--src-p','--src','--src-ts','--src'],page:['--page-p','--page-t','--page-ts','--page'],left:['--line','--line','--muted','--muted'],landed:['--src-p','--src','--page-ts','--page']};
function drawCrossing(el,left,right,{edge=false,shares=false,bar='page'}={}){
  const tl=sum(left.map(i=>i.value)),tr=sum(right.map(i=>i.value));
  if(!tl&&!tr){el.innerHTML='<div class="empty">No visits yet</div>';return}
  const share=it=>shares&&tr>=20?fmtPct(it.value/tr):fmtInt(it.value);
  // "38% of views of this page went on to /signup", or on few views "7 of 15 views went on to /signup".
  const of=it=>shares&&tr>=20?`${share(it)} of views of this page`:`${fmtInt(it.value)} of ${fmtInt(tr)} views`;
  if(shares)for(const it of right)it.hint=`${of(it)} ${it.kind==='left'?'ended the visit: they left the site here':`went on to ${it.key!=null?it.label:/^1 /.test(it.label)?'another page':`one of ${it.label}`}`}`;
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    // On a phone, labels take two lines.
    const narrow=!edge&&W<520,gap=10,hc=H-gap*(Math.max(left.length,right.length)-1),y0=(H-hc)/2;
    const cx=edge?0:Math.round(W/2)-3,xl=Math.round(W*(narrow?.4:.32)),xr=Math.round(W*(edge||narrow?.6:.68))-(edge?0:6);
    el.classList.toggle('narrow',narrow);
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc([...left,...right].map(i=>`${i.label} ${fmtInt(i.value)}`).join(', '))}">`;
    const labels=[];
    const side=(items,total,x,to,isLeft)=>{
      if(!total)return;
      const k=hc/total,from=isLeft?x+6:x,m=(from+to)/2;
      let yo=(H-hc-gap*(items.length-1))/2,yi=y0;const mids=[];
      for(const it of items){
        const h=it.value*k,ink=INK[it.kind]||INK.landed;
        s+=`<path d="M${from},${yo} C${m},${yo} ${m},${yi} ${to},${yi} L${to},${yi+h} C${m},${yi+h} ${m},${yo+h} ${from},${yo+h} Z" fill="var(${ink[+!!it.story]})"/>`
          +`<rect x="${x}" y="${yo}" width="6" height="${Math.max(1,h)}" fill="var(${ink[2+!!it.story]})"/>`;
        mids.push(yo+h/2);yo+=h+gap;yi+=h;
      }
      const ys=spread(mids,narrow?32:items.some(i=>i.story)?20:18,H);
      items.forEach((it,i)=>labels.push([it,ys[i],isLeft]));
    };
    side(left,tl,xl,cx,true);
    side(right,tr,xr,cx+6,false);
    el.innerHTML=s+`<rect x="${cx}" y="${y0}" width="6" height="${hc}" fill="var(--${bar})"/></svg>`;
    for(const [it,y,isLeft] of labels){
      const b=document.createElement('button');b.type='button';b.className=isLeft?'lbl l':'lbl';b.dataset.key=`${isLeft?'l':'r'}:${it.key??it.label}`;
      b.style.left=(isLeft?xl-8:xr+14)+'px';b.style.top=(it.story||narrow?Math.max(y,20):y)+'px';
      const v=isLeft?fmtInt(it.value):share(it);
      b.innerHTML=it.story?`<b>${esc(it.label)}</b><br><span>${v}${it.sub?` · ${it.sub}`:''}</span>`:`${esc(it.label)}${narrow?'<br>':' '}<span>${v}</span>`;
      if(it.hint)b.title=it.hint;
      if(it.key!=null)b.onclick=()=>openFilter(isLeft?{referrer:it.key}:{path:it.key},it.label,b);else b.disabled=true;
      el.appendChild(b);
    }
  });
}

// Columns of nodes joined by ribbons, one scale for all, each column centred: a visit is as tall everywhere.
// cols: node ids per column, left to right; links: {s,t,v}. Ribbons leave and arrive in the order of the node at
// their other end, so they cross as little as they can. Returns each node's y and h, and each link's path.
function columns(cols,links,xs,H,gap,barW){
  const node={};
  cols.forEach((c,ci)=>c.forEach(id=>node[id]={id,col:ci,in:0,out:0}));
  for(const l of links){node[l.s].out+=l.v;node[l.t].in+=l.v}
  const val=n=>Math.max(n.in,n.out);
  const k=Math.min(...cols.map(c=>(H-gap*(c.length-1))/(sum(c.map(id=>val(node[id])))||1)));
  cols.forEach((c,ci)=>{
    let y=(H-sum(c.map(id=>val(node[id])*k))-gap*(c.length-1))/2;
    for(const id of c){const n=node[id];n.x=xs[ci];n.y=y;n.h=Math.max(1,val(n)*k);y+=n.h+gap}
  });
  const outs={},ins={};
  for(const l of links){(outs[l.s]??=[]).push(l);(ins[l.t]??=[]).push(l)}
  for(const ls of Object.values(outs)){ls.sort((a,b)=>node[a.t].y-node[b.t].y);let y=node[ls[0].s].y;for(const l of ls){l.y0=y;y+=l.v*k}}
  for(const ls of Object.values(ins)){ls.sort((a,b)=>node[a.s].y-node[b.s].y);let y=node[ls[0].t].y;for(const l of ls){l.y1=y;y+=l.v*k}}
  for(const l of links){
    const x0=node[l.s].x+barW,x1=node[l.t].x,m=(x0+x1)/2,h=l.v*k;
    l.d=`M${x0},${l.y0} C${m},${l.y0} ${m},${l.y1} ${x1},${l.y1} L${x1},${l.y1+h} C${m},${l.y1+h} ${m},${l.y0+h} ${x0},${l.y0+h} Z`;
  }
  return node;
}

// Where visits came from, the page they landed on, and whether they read on or left after it, all in visits, so
// the third column adds up to the first. The five busiest sources and pages, and the pair the sentence names; the
// rest go under "other". That pair's ribbons and its page's way out are solid.
function drawOutcome(el,flows,pair){
  if(!sum(flows.map(f=>f.visits))){el.innerHTML='<div class="empty">No visits yet</div>';return}
  const OTHER='\u0000';
  const busiest=key=>{
    const m=new Map();for(const f of flows)m.set(f[key],(m.get(f[key])||0)+f.visits);
    let r=[...m].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const some=r.slice(0,5);if(pair&&!some.includes(pair[key]))some.splice(4,1,pair[key]);
    return r.length>some.length?[...some,OTHER]:some;
  };
  const srcs=busiest('source'),pages=busiest('page'),of=(list,k)=>list.includes(k)?k:OTHER;
  const pairs=new Map(),stay=new Map(pages.map(p=>[p,{visits:0,bounces:0}]));
  for(const f of flows){
    const s=of(srcs,f.source),p=of(pages,f.page),key=s+'\t'+p;
    pairs.set(key,(pairs.get(key)||0)+f.visits);
    const st=stay.get(p);st.visits+=f.visits;st.bounces+=f.bounces;
  }
  const label=(dim,k)=>k===OTHER?`other ${dim==='referrer'?'sources':'pages'}`:labelOf(dim,k);
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const narrow=W<520,barW=6,xs=[Math.round(W*(narrow?.3:.22)),Math.round(W*.55),W-Math.round(W*(narrow?.27:.2))-barW];
    const links=[...[...pairs].map(([key,v])=>{const [s,p]=key.split('\t');return {s:'s'+s,t:'p'+p,v,src:s,page:p}}),
      ...pages.flatMap(p=>{const st=stay.get(p);return [{s:'p'+p,t:'oread',v:st.visits-st.bounces,page:p},{s:'p'+p,t:'oleft',v:st.bounces,page:p,left:true}]})].filter(l=>l.v>0);
    const node=columns([srcs.map(s=>'s'+s),pages.map(p=>'p'+p),['oread','oleft']],links,xs,H,narrow?6:8,barW);
    const layers=[[],[],[]];
    for(const l of links){
      let ink,hot=false;
      if(l.src!=null){const mine=pair&&l.src===pair.source;hot=mine&&l.page===pair.page;ink=hot?'--src':mine?'--src-t':'--src-p'}
      else if(l.left){hot=pair&&l.page===pair.page;ink=hot?'--bnc':'--bnc-p'}
      else ink='--lost-p';
      const hint=l.src!=null?`${label('referrer',l.src)} → ${label('path',l.page)}: ${fmtInt(l.v)} ${l.v===1?'visit':'visits'}`
        :`${label('path',l.page)}: ${fmtInt(l.v)} ${l.v===1?'visit':'visits'} ${l.left?'left after this page':'read on'}`;
      layers[hot?2:l.src!=null&&pair&&l.src===pair.source?1:0].push(`<path d="${l.d}" fill="var(${ink})" data-hint="${esc(hint)}"/>`);
    }
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(`Visits from ${srcs.length} sources to the pages they landed on, then whether they read on or left after one page`)}">${layers.flat().join('')}`;
    for(const n of Object.values(node)){
      const k=n.id.slice(1),c=n.id[0]==='s'?(pair&&k===pair.source?'--src':'--src-ts'):n.id[0]==='p'?(pair&&k===pair.page?'--page':'--page-ts'):k==='left'?'--bnc':'--lost';
      s+=`<rect x="${n.x}" y="${n.y}" width="${barW}" height="${n.h}" rx="1" fill="var(${c})"/>`;
    }
    el.innerHTML=s+'</svg>';
    const place=(ids,make)=>{
      const ns=ids.map(id=>node[id]).filter(Boolean),ys=spread(ns.map(n=>n.y+n.h/2),narrow?30:18,H);
      ns.forEach((n,i)=>{const b=make(n);b.style.top=ys[i]+'px';el.appendChild(b)});
    };
    const button=(cls,html,open,hint)=>{const b=document.createElement(open?'button':'span');if(open){b.type='button';b.onclick=()=>open(b)}b.className='lbl '+cls;b.innerHTML=html;if(hint)b.title=hint;return b};
    const strong=(on,t)=>on?`<b>${t}</b>`:t;
    place(srcs.map(s=>'s'+s),n=>{const k=n.id.slice(1),v=n.out,b=button('l',`${strong(pair&&k===pair.source,esc(label('referrer',k)))}${narrow?'<br>':' '}<span>${fmtInt(v)}</span>`,
      k===OTHER?el=>openView({v:'sources'},el):el=>openFilter({referrer:k},label('referrer',k),el));b.style.left=(n.x-8)+'px';return b});
    place(pages.map(p=>'p'+p),n=>{const k=n.id.slice(1),st=stay.get(k),b=button('m',`${strong(pair&&k===pair.page,esc(label('path',k)))}${narrow?'':` <span>${leftWord(st.bounces,st.visits)}</span>`}`,
      k===OTHER?el=>openView({v:'pages'},el):el=>openFilter({path:k},label('path',k),el),`${label('path',k)}: ${fmtInt(st.visits)} visits landed here, ${leftWord(st.bounces,st.visits)} after one page`);b.style.left=(n.x+barW+6)+'px';return b});
    place(['oread','oleft'],n=>{const left=n.id==='oleft',b=button('',`${strong(left,left?`Left after${narrow?'<br>':' '}one page`:'Read on')}<br><span>${fmtInt(n.in)}</span>`);b.style.maxWidth='none';b.style.left=(n.x+barW+8)+'px';return b});
  });
}

// Read or skimmed: each page by how long half its readers stay and how far down they get, on average, its dot as big
// as its read views; dashed lines are the site's medians, which cut the four corners. The pages the sentence names
// are solid, a page slow to load has a red ring, and one with under 20 read views is hollow.
function drawReadMap(el,M){
  const pts=M.points;if(!M.mid){el.remove();return}
  observe(el,()=>{
    const W=el.clientWidth,H=el.clientHeight;if(!W||!H)return;
    const narrow=W<520,pl=40,pr=12,pt=12,pb=narrow?58:38,maxV=maxOf(pts.map(p=>p.views)),R=v=>3+Math.sqrt(v/maxV)*(narrow?18:28);
    const lo=Math.max(1,Math.min(...pts.map(p=>p.read))/1.4),hi=Math.max(...pts.map(p=>p.read))*1.4;
    const X=s=>pl+(Math.log(s)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*(W-pl-pr);
    const d0=Math.max(0,Math.floor(Math.min(...pts.map(p=>p.depth))*10-.5)/10),d1=Math.min(1,Math.ceil(Math.max(...pts.map(p=>p.depth))*10+.5)/10);
    const Y=d=>pt+(1-(d-d0)/(d1-d0))*(H-pt-pb);
    const told=new Set(M.told);
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(`Pages by how long half their readers stay and how far down they read: ${pts.map(p=>`${p.key} ${fmtDur(p.read)}, ${fmtPct(p.depth)}`).join('; ')}`)}">`;
    const ticks=[2,5,10,20,30,60,120,300,600,1200].filter(v=>v>=lo&&v<=hi).filter((v,i,a)=>!narrow||i%2===0||i===a.length-1);
    for(const v of ticks)s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><text x="${X(v)}" y="${H-pb+16}" text-anchor="middle" class="axis">${v<60?v+'s':v/60+'m'}</text>`;
    for(let d=d0;d<=d1+1e-9;d+=.1)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(d)}" y2="${Y(d)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(d)+4}" text-anchor="end" class="axis">${Math.round(d*100)}%</text>`;
    s+=`<line x1="${X(M.mid.read)}" x2="${X(M.mid.read)}" y1="${pt}" y2="${H-pb}" stroke="var(--rule)" stroke-dasharray="3 4"/><line x1="${pl}" x2="${W-pr}" y1="${Y(M.mid.depth)}" y2="${Y(M.mid.depth)}" stroke="var(--rule)" stroke-dasharray="3 4"/>`;
    // A phone has room for the corners' first words only.
    const C=narrow?{end:'Read',skimmed:'Skimmed',top:'Near the top',early:'Left early'}:M.corners;
    s+=`<text class="corner" x="${W-pr-4}" y="${pt+12}" text-anchor="end">${C.end}</text><text class="corner" x="${pl+4}" y="${pt+12}">${C.skimmed}</text>`
      +`<text class="corner" x="${W-pr-4}" y="${H-pb-6}" text-anchor="end">${C.top}</text><text class="corner" x="${pl+4}" y="${H-pb-6}">${C.early}</text>`;
    s+=`<text x="${W-pr}" y="${H-4}" text-anchor="end" class="axis">half of readers stay at least →</text>`
      +`<text x="${pl}" y="${H-(narrow?22:4)}" class="axis">↑ how far down, on average</text>`;
    const order=[...pts].sort((a,b)=>b.views-a.views);
    for(const p of order){
      const on=told.has(p.key),hint=`${p.key==='/'?'The home page':p.key}: ${fmtInt(p.views)} read views; half stay ${fmtDur(p.read)} or more, ${fmtPct(p.depth)} of the way down on average${p.slow?`; slow to load, LCP ${(p.lcp/1000).toFixed(1)} s`:''}${p.few?'; too few views to place surely':''}. ${M.corners[p.corner]}.`;
      s+=`<circle cx="${X(p.read)}" cy="${Y(p.depth)}" r="${R(p.views)}" fill="${p.few?'none':`var(${on?'--page':'--page-p'})`}" stroke="var(${p.slow?'--bnc':on?'--page':'--page-t'})" stroke-width="${p.slow?3:1.2}"${p.few?' stroke-dasharray="2 2"':''} tabindex="0" role="button" data-path="${esc(p.key)}" aria-label="${esc(hint)} Open" data-hint="${esc(hint)}"/>`;
    }
    for(const p of order)if(told.has(p.key)||(!narrow&&!p.few))s+=`<text x="${X(p.read)+R(p.views)+4}" y="${Y(p.depth)+4}" class="${told.has(p.key)?'ink ':''}halo">${esc(p.key)}</text>`;
    el.innerHTML=s+'</svg>';
  });
  opensPages(el);
}

// A mark in a drawn chart with a data-path opens that page, on a click or on Enter or Space.
function opensPages(el){
  const go=e=>{const t=e.target.closest('[data-path]');if(t)openFilter({path:t.dataset.path},t.dataset.path,t)};
  el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}};
}

// Here now as lanes: one per page, each person standing as far along it as they've been on that page; those who
// left are pale. The people the sentence counts, past 2 minutes, carry their source.
function drawLanes(el,L){
  observe(el,()=>{
    const W=el.clientWidth;if(!W)return;
    const lane=44,pl=W<520?88:120,pr=16,H=L.rows.length*lane+28,X=s=>pl+laneX(s)*(W-pl-pr);
    el.style.height=H+'px';
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${esc(L.rows.map(r=>`${r.path??`${r.pages} other pages`}: ${r.here} here now, ${r.people.length-r.here} left`).join('; '))}">`;
    for(const [v,t] of W<520?[[0,'0'],[60,'1 min'],[300,'5 min'],[1800,'30 min']]:[[0,'just came'],[60,'1 min'],[300,'5 min'],[900,'15 min'],[1800,'30 min']])
      s+=`<line x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H-24}" stroke="var(--line)"/><text x="${X(v)}" y="${H-6}" text-anchor="${v?v===1800?'end':'middle':'start'}" class="axis">${t}</text>`;
    L.rows.forEach((r,i)=>{
      const y=i*lane+lane/2+4;
      s+=`<line x1="${pl}" x2="${W-pr}" y1="${y+8}" y2="${y+8}" stroke="var(--line)"/>`
        +(r.path==null?`<text x="${pl-10}" y="${y-2}" text-anchor="end" class="${r.here?'ink':''}">${r.pages} other pages</text>`
          :`<text x="${pl-10}" y="${y-2}" text-anchor="end" class="${r.here?'ink ':''}lane-name" tabindex="0" role="button" data-path="${esc(r.path)}" aria-label="${esc(`${r.path}: ${r.here} here now. Open`)}">${esc(r.path.length>18?r.path.slice(0,8)+'…'+r.path.slice(-8):r.path)}</text>`)
        +`<text x="${pl-10}" y="${y+12}" text-anchor="end" class="axis">${r.here?`${r.here} here`:'left'}</text>`;
      for(const p of r.people){
        const src=labelOf('referrer',p.v.referrer),hint=`${p.here?'Here now':'Left'}: from ${src}${p.v.country?`, ${labelOf('country',p.v.country)}`:''}, ${fmtDur(p.v.seconds)} on ${pageName(p.v.path)}`;
        s+=`<text class="fig" x="${X(p.v.seconds)}" y="${y+8}" text-anchor="middle" style="fill:var(${p.named?'--src':p.here?'--live':'--live-ps'})" data-hint="${esc(hint)}">${p.letter}</text>`;
        if(p.here&&p.v.seconds>=120)s+=`<text x="${X(p.v.seconds)+9}" y="${y-12}" class="halo" style="font-size:11px;fill:var(--ink)">${esc(src)}</text>`;
      }
    });
    el.innerHTML=s+'</svg>';
  });
  opensPages(el);
}

// Bounce: who visited vs how they behaved, per day, and by source and entry page.
async function renderBounce(body){
  const gen=body._gen;
  const [totals,ser,entry,refs,pages,flows]=await Promise.all([api('summary'),api('series'),api('breakdown',{dim:'entry'}),
    api('breakdown',{dim:'referrer'}),api('breakdown',{dim:'path'}),api('flows'),homeDrawn]);
  if(stale(body,gen))return;
  const H=home(),S=readStory({totals,ser,pages,refs,flows}),B=bounceSplit(S),told=H?.T.told||new Set();
  const c=totals.cur.bounce,p=totals.prev.bounce;
  let say,standout=null;
  if(!totals.cur.visits)say=`No visits in the last ${DAYS} days.`;
  else if(!B)say=`There were no visits in the ${DAYS} days before, so there’s nothing to compare with yet.`;
  else if(B.cause==='same'){
    // Nothing moved, so the sentence says what stands out instead: who bounces most beyond the site's rate.
    const rows=[['referrer',refs],['entry',entry]].flatMap(([dim,d])=>d.rows.filter(r=>r.bounce!=null).map(r=>({dim,key:r.key,label:labelOf(dim,r.key),visits:r.visits,bounce:r.bounce})));
    standout=bounceStandout(rows,c);say=bounceHeld(c,standout);
  }
  else if(B.cause==='source'){
    const who=`<b${told.has(B.top.key)?' class="told"':''}>${esc(readers(B.top.label))}</b>`;
    say=`${who} moved bounce most: ${B.total>0?'more':'fewer'} of their visits bounced than before.`;
  }else if(B.cause==='mix')say=`It’s mostly a change in where visitors came from: ${B.total>0?'more':'fewer'} of the visits came from sources that often bounce.`;
  else say='The change was spread across sources; no one source made up even a third of it.';
  body.innerHTML=`<p class="say">${say}</p>
    <div class="nums"><div class="hero"><span class="big">${totals.cur.visits?fmtPct(c):'–'}</span><span>bounce${totals.prev.visits&&totals.cur.visits?` · <b>${pts(c,p)}</b>`:''}</span><span class="hero-sq">${squaresSVG(c,22,5,'var(--bnc)')}</span></div></div>
    ${B&&B.cause!=='same'?`<section class="card"><div class="card-title">Why it ${B.total>0?'rose':'fell'} · in percentage points</div><div class="steps"></div>
      <div class="legend"><span>${fmtPct(c)} now</span><span>${fmtPct(p)} before</span></div></section>`:''}
    <section class="card"><div class="card-title">Where visits came from, the page they landed on, and who left after it</div><p class="card-say oc-say"></p><div class="landed outcome"></div></section>
    <section class="card"><div class="card-title">Bounce per day${totals.prev.visits?`, against the ${DAYS} days before`:''}</div><div class="chart"></div></section>
    <section class="card"><div class="card-title">Sources</div><div data-dim="referrer"></div></section>
    <section class="card"><div class="card-title">Pages they landed on</div><div data-dim="entry"></div></section>`;
  if(B&&B.cause!=='same'){
    const pts=(v,total)=>(v>0?'+':v<0?'−':'±')+(Math.abs(v)*100).toFixed(1)+(total?' points':'');
    const steps=[{kind:'mix',label:'where visitors came from',value:B.mix}];
    if(B.top)steps.push({kind:'named',label:readers(B.top.label),value:B.top.pts,story:true,key:B.top.key});
    steps.push({kind:'else',label:'everyone else',value:B.rest},{kind:'total',label:'total',value:B.total});
    drawSteps(body.querySelector('.steps'),steps,{fmt:pts,colorOf:s=>s.kind==='total'?'var(--ink)':'var(--bnc)',
      aria:`Bounce ${B.total>0?'rose':'fell'} ${pts(Math.abs(B.total),true)}: ${steps.slice(0,-1).map(s=>`${s.label} ${pts(s.value)}`).join(', ')}.`,
      openOf:s=>s.key!=null?b=>openFilter({referrer:s.key},labelOf('referrer',s.key),b):null});
  }
  const O=outcomeStory(flows.flows,c);
  body.querySelector('.oc-say').innerHTML=O.html;
  drawOutcome(body.querySelector('.outcome'),flows.flows,O.pair);
  // A day with no visits has no bounce rate, so the line leaves a gap there rather than dropping to 0%.
  const rates=side=>side.bounce.map((b,i)=>side.visits&&!side.visits[i]?null:b);
  // The highest day is labelled only when it stands out: 5 points or more above a usual day.
  const cur=rates(ser.cur),known=cur.filter(v=>v!=null),peakI=cur.indexOf(Math.max(...known)),spikeDay=H&&peakI>=0&&H.S.spike===peakI,standsOut=known.length&&cur[peakI]-median(known)>=.05;
  const spikeSrc=spikeDay?labelOf('referrer',H.ser.top[peakI]):null;
  lines(body.querySelector('.chart'),{cur,prev:totals.prev.visits?rates(ser.prev):null,fmt:fmtPct,axis:fmtPct,start:ser.start,span:.1,
    peak:standsOut&&{i:peakI,title:`${fmtDate(dayDate(ser.start,peakI))} · ${fmtPct(cur[peakI])}`,sub:spikeSrc?`the ${spikeSrc} day`:'',story:spikeDay,
      aria:`Bounce rate per day. Highest on ${fmtDate(dayDate(ser.start,peakI))} at ${fmtPct(cur[peakI])}.`}});
  for(const [dim,data] of [['referrer',refs],['entry',entry]]){
    // Only the busiest keys, so a page with two visits can't top the list.
    const rows=data.rows.slice().sort((a,b)=>b.visits-a.visits).slice(0,12).filter(r=>r.bounce!=null)
      .map(r=>({key:r.key,label:labelOf(dim,r.key),value:r.bounce,visits:r.visits,prev:r.prev?.visits?r.prev.bounce:null,
        story:(dim==='referrer'&&B?.cause==='source'&&B.top?.key===r.key)||(standout?.dim===dim&&standout.key===r.key),
        open:el=>openFilter({[FILTER_OF[dim]]:r.key},labelOf(dim,r.key),el)}))
      .sort((a,b)=>b.value-a.value);
    rateRows(body.querySelector(`[data-dim="${dim}"]`),rows);
  }
}

// more: people not drawn, as "+N" at the end of the line.
const lineHTML=(C,cls='',more=0)=>`<span class="crowd ${cls}" aria-hidden="true">${C.people.map(p=>`<span class="${p.named?'named':p.here?'':'gone'}">${p.letter}</span>`).join('')}${more>0?`<span class="crowd-more">+${fmtInt(more)}</span>`:''}</span>`;
const crowdAria=(live,told)=>{
  if(!live?.now)return `No one here right now${live?.recent?`; ${live.recent} in the last 30 minutes`:''}`;
  const named=live.visitors.filter(v=>v.active&&told.has(v.referrer));
  return `${live.now} here now${named.length?`, ${named.length} from ${labelOf('referrer',named[0].referrer)}`:''}; ${live.recent} in the last 30 minutes`;
};

// Who is here now, grouped by the page they are on.
async function renderOnline(body){
  const gen=body._gen,[live]=await Promise.all([liveNow(),homeDrawn]);
  if(stale(body,gen))return;
  const H=home(),told=H?.T.told||new Set(),page=H?.T.page;
  // Amber figures came from a source home's sentence talks about; the key names it.
  const earlier=live.recent-live.now,named=[...new Set(crowd(live,told,Infinity).filter(p=>p.named).map(p=>labelOf('referrer',p.v.referrer)))];
  // One row per page, its people grouped as figures; each person here now gets a line, with their source, country
  // and time on site; those who left are one muted line per page, by source.
  const people=crowdLine(live,told,Infinity).people,groups=new Map();
  for(const p of people){if(!groups.has(p.v.path))groups.set(p.v.path,[]);groups.get(p.v.path).push(p)}
  const here=g=>g.filter(p=>p.here).length;
  const rows=[...groups].sort((a,b)=>here(b[1])-here(a[1])||b[1].length-a[1].length);
  const pace=onlinePace(live,H?.hourly,Date.now()/1000),LN=lanes(live,told);
  body.innerHTML=`<p class="say">${onlineStory(live,told,page)}${pace?` ${pace.html}`:''}</p>
    ${rows.length?`<section class="card"><div class="card-title">Where they are, and how long they’ve been there</div>${LN.html?`<p class="card-say">${LN.html}</p>`:''}<div class="lanes svgc"></div>
      <p class="crowd-key"><span><i class="sw here"></i><b>${live.now}</b> here now</span>${earlier>0?`<span><i class="sw gone"></i><b>${earlier}</b> left in the last 30 minutes</span>`:''}${named.length?`<span><i class="sw here" style="background:var(--src)"></i>from ${named.map(esc).join(' or ')}</span>`:''}</p></section>`:''}
    <section class="card">${rows.length?`<div class="people list"><div class="lrow lhead online"><span>Page</span><span>People</span><span>Source</span><span class="cty">Country</span><span>Time on site</span><span></span></div></div>`:'<div class="muted">No one in the last 30 minutes.</div>'}</section>
    ${rows.length?'<p class="credit">Figures: Wee People, ProPublica</p>':''}`;
  if(rows.length)drawLanes(body.querySelector('.lanes'),LN);
  const list=body.querySelector('.people');
  for(const [path,g] of rows){
    g.sort((a,b)=>b.here-a.here);
    const now=g.filter(p=>p.here),gone=g.filter(p=>!p.here),n=now.length+(gone.length?1:0),b=document.createElement('button');b.type='button';b.className='lrow online';b.dataset.path=path;
    const bySrc=new Map();for(const p of gone){const l=labelOf('referrer',p.v.referrer);bySrc.set(l,(bySrc.get(l)||0)+1)}
    b.innerHTML=`<span class="name${path===page&&here(g)?' told-page':''}" style="grid-row:span ${n}">${esc(path)}</span>
      <span class="ppl small" style="grid-row:span ${n}" aria-hidden="true">${g.map(p=>`<span class="${p.named?'named':p.here?'':'gone'}">${p.letter}</span>`).join('')}</span>`
      +now.map(p=>{
        const src=labelOf('referrer',p.v.referrer);
        return `<span class="src">${p.named?`<b>${esc(src)}</b>`:esc(src)}</span><span class="cty">${p.v.country?esc(labelOf('country',p.v.country)):''}</span><span class="num">${fmtDur(p.v.seconds)}</span>`;
      }).join('')
      +(gone.length?`<span class="earlier muted">${gone.length} earlier · ${[...bySrc].sort((a,b)=>b[1]-a[1]).map(([l,k])=>`${esc(l)} ${k}`).join(', ')}</span>`:'')
      +`<span class="chevc" style="grid-row:1/span ${n}">${CHEV}</span>`;
    b.setAttribute('aria-label',`${path}: ${here(g)} here now, ${n} in the last 30 minutes. `+g.map(p=>`${p.here?'Here now':'Earlier'} from ${labelOf('referrer',p.v.referrer)}${p.v.country?`, ${labelOf('country',p.v.country)}`:''}, ${fmtDur(p.v.seconds)}`).join('; ')+'. Open');
    b.onclick=()=>openFilter({path},path,b);
    list.append(b);
  }
}

// Redraws the Online view in place, without the loading state in between, and keeps focus on the row it was on.
async function redrawOnline(body){
  const at=body.contains(document.activeElement)?document.activeElement.dataset.path:null;
  body._gen=(body._gen|0)+1;
  try{await renderOnline(body)}catch{return}
  if(at!=null)[...body.querySelectorAll('[data-path]')].find(b=>b.dataset.path===at)?.focus({preventScroll:true});
}

/* ---------- home tiles ---------- */
// The headline counts what the sentence compares: visitors, or visits when only one period crosses a month start.
function renderStory(S,T,live){
  const {c,p,diff}=S,u=S.unit||'visitors',el=$('#story');
  const pct=p[u]?Math.round(Math.abs(diff)/p[u]*100):0;
  const sub=p[u]
    ?`${u} <b>${diff>=0?'+':'−'}${pct}%</b><span class="sr">, ${fmtInt(Math.abs(diff))} ${diff>=0?'more':'fewer'} than the ${DAYS} days before</span>`
    :`${u} in the last ${DAYS} days`;
  el.innerHTML=`<button type="button" class="headline"><b>${fmtInt(c[u])}</b><span>${sub}</span></button>
    <div class="say-col"><p class="sentence">${T.html}</p><p class="goal-line" id="goal-line" hidden></p></div>
    <button type="button" class="now" id="now"></button>`;
  const head=el.querySelector('.headline');
  head.setAttribute('aria-label',`${fmtInt(c[u])} ${head.querySelector('span').textContent}. Open`);
  head.onclick=()=>openOverview(head);
  bindLinks(el.querySelector('.sentence'));
  const now=$('#now');
  now.onclick=()=>openOnline(now);
  drawNow(live,T.told,HOME?.pace);
}
// Today's pace against a usual day, then who is here now.
function drawNow(live,told,pace){
  const now=$('#now');if(!now)return;
  now.hidden=!live&&!pace;if(now.hidden)return;
  // On home the figures are only here or left; who they are is the online page's story. They wrap to the block's
  // width, which its lines of text set; everyone is drawn up to three rows, and past that the line ends in +N.
  const draw=C=>{now.innerHTML=`<span class="now-body">${pace?`<span class="pace">${pace.html}</span>`:''}${live?`${lineHTML(C,'wide',C.more)}<span>${crowdCaption(live)} ${CHEV}</span>`:''}</span>`};
  let C=live&&crowdLine(live,new Set(),Infinity);
  draw(C);
  const box=live&&now.querySelector('.crowd');
  if(box){
    const per=Math.max(10,Math.floor(box.clientWidth/(parseFloat(getComputedStyle(box).fontSize)*.31)));
    if(C.people.length>per*3){C=crowdLine(live,new Set(),per*3-2);draw(C)}
  }
  now.setAttribute('aria-label',`${pace?pace.html.replace(/<[^>]+>/g,'')+'. ':''}${live?crowdAria(live,told):''}. Open`);
}

// key: a short note beside the title, saying what a highlight means.
function tile(cls,title,caption,onOpen,key){
  const el=document.createElement('div');
  el.className=`tile ${cls}`;
  el.innerHTML=`<div class="tile-head"><h2><button type="button" class="tile-title">${title}</button></h2>${key?`<span class="tile-key">${key}</span>`:''}</div><div class="viz"></div>${caption!=null?`<p class="cap">${caption}</p>`:''}`;
  const open=()=>onOpen(el);
  el.querySelector('.tile-title').onclick=e=>{e.stopPropagation();open()};
  el.onclick=e=>{if(!e.target.closest('button'))open()};
  return el;
}

function drawDays(el,S,ser,{scale=false,note=false}={}){
  const cur=ser.cur.visitors,prev=ser.prev.visitors,n=cur.length,seg=spikeSegment(S,ser),was=S.prevSpike;
  const prevStart=ser.start-ser.days*86400,busiest=cur.indexOf(maxOf(cur));
  const label=seg?{i:seg.day,title:`${fmtDate(dayDate(ser.start,seg.day))} · ${fmtInt(seg.total)}`,sub:`${fmtInt(seg.top)} from ${labelOf('referrer',seg.source)}`,swatch:'var(--src)'}
    :was>=0?{i:was,title:`${fmtDate(dayDate(prevStart,was))} · ${fmtInt(prev[was])}`,sub:`big day in the ${DAYS} days before`}:null;
  dayBars(el,{cur,prev:S.p.visitors?prev:null,start:ser.start,seg:seg&&{...seg,subj:'src'},label,prevDot:was,scale,note,
    aria:`Visitors per day from ${fmtDay(dayDate(ser.start,0))} to ${fmtDay(dayDate(ser.start,n-1))}. Busiest: ${fmtDate(dayDate(ser.start,busiest))} with ${fmtInt(cur[busiest])}`
      +(seg?`, ${fmtInt(seg.top)} of them from ${labelOf('referrer',seg.source)}.`:'.')});
}

function drawFlow(el,S,T,flows,flowsPrev,pageRows){
  if(!flows.length){el.innerHTML=`<div class="empty">${noneYet('visitors',S.p.visitors>0,DAYS)}</div>`;return}
  // Left: the sources the sentence names and those that moved the total most, in order of change; named ones are bold.
  const live=S.sources.filter(s=>s.value>0);
  const named=live.filter(s=>T.told.has(s.key));
  const others=live.filter(s=>!T.told.has(s.key)).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change)).slice(0,Math.max(0,5-named.length));
  const shown=[...named,...others].sort((a,b)=>b.change-a.change),rest=live.filter(s=>!shown.includes(s));
  const left=shown.map(s=>({key:s.key,label:s.label,value:s.value,prev:s.prev,change:s.change}));
  if(rest.length)left.push({key:null,label:`${rest.length} other ${rest.length===1?'source':'sources'}`,value:sum(rest.map(s=>s.value)),prev:sum(rest.map(s=>s.prev)),change:sum(rest.map(s=>s.change))});
  // Right: the pages most visits landed on, biggest first, always including the page the sentence names.
  const byPage=new Map();
  for(const f of flows)byPage.set(f.page,(byPage.get(f.page)||0)+f.visitors);
  const ranked=[...byPage].sort((a,b)=>b[1]-a[1]);
  let top=ranked.slice(0,4);
  if(T.page&&byPage.has(T.page)&&!top.some(r=>r[0]===T.page))top=[...top.slice(0,3),[T.page,byPage.get(T.page)]];
  top.sort((a,b)=>b[1]-a[1]);
  // A page's change compares first visits with first visits before, like the ribbons it ends.
  const before=new Map();
  for(const f of flowsPrev)before.set(f.page,(before.get(f.page)||0)+f.visitors);
  const right=top.map(([key,value])=>({key,label:key,value,prev:before.get(key),isNew:!pageRows.find(x=>x.key===key)?.prev}));
  const restP=ranked.filter(r=>!top.includes(r));
  if(restP.length)right.push({key:null,label:'other pages',value:sum(restP.map(r=>r[1]))});
  // The story's own source and page get a line under the page when their visits left far more or less than the site's.
  const stay=S.lead&&T.page!=null?pairStay(flows,S.lead.key,T.page,S.c.bounce):null,toldPage=right.find(r=>stay&&r.key===T.page);
  if(toldPage)Object.assign(toldPage,{left:stay.word,leftHint:stay.hint.replace(/<[^>]+>/g,'')});

  // Anything not shown on its own goes to the "other" row.
  const at=(list,k)=>{const i=list.findIndex(s=>s.key===k);return i>=0?i:list.findIndex(s=>s.key==null)};
  const m=left.map(()=>right.map(()=>0));
  for(const f of flows){const i=at(left,f.source),j=at(right,f.page);if(i>=0&&j>=0)m[i][j]+=f.visitors}
  const total=sum(m.flat());if(!total){el.innerHTML=`<div class="empty">${noneYet('visitors',S.p.visitors>0,DAYS)}</div>`;return}

  // Each side has its own gaps, so each gets its own scale; a ribbon is v*kL tall on the left and v*kR on the right.
  const gap=3,scaleOf=n=>(100-gap*(n-1))/total,kL=scaleOf(left.length),kR=scaleOf(right.length);
  const stack=(vals,k)=>{let y=0;return vals.map(v=>{const top=y;y+=v*k+gap;return {top,h:v*k}})};
  const L=stack(m.map(r=>sum(r)),kL),R=stack(right.map((_,j)=>sum(m.map(r=>r[j]))),kR);
  const lOff=L.map(n=>n.top),rOff=R.map(n=>n.top);
  const layers=[[],[],[]];
  m.forEach((row,i)=>row.forEach((v,j)=>{
    if(!v)return;
    const a=lOff[i],b=rOff[j],ha=v*kL,hb=v*kR;lOff[i]+=ha;rOff[j]+=hb;
    const fromNamed=left[i].key!=null&&T.told.has(left[i].key);
    const hot=fromNamed&&S.lead&&left[i].key===S.lead.key&&T.page!=null&&right[j].key===T.page;
    // Pale ribbons first, the named one last, so the story's ribbon sits on top where ribbons cross.
    layers[hot?2:fromNamed?1:0].push(`<path d="M2.2,${a} C50,${a} 50,${b} 97.8,${b} L97.8,${b+hb} C50,${b+hb} 50,${a+ha} 2.2,${a+ha} Z" fill="${hot?'var(--src)':fromNamed?'var(--src-t)':'var(--src-p)'}" data-hint="${esc(ribbonHint(left[i].label,right[j].label,v))}"/>`);
  }));
  let paths=layers.flat().join('');
  L.forEach((n,i)=>{paths+=`<rect x="0" y="${n.top}" width="2.2" height="${n.h}" fill="${left[i].key!=null&&T.told.has(left[i].key)?'var(--src)':'var(--src-ts)'}"/>`});
  R.forEach((n,j)=>{paths+=`<rect x="97.8" y="${n.top}" width="2.2" height="${n.h}" fill="${right[j].key!=null&&right[j].key===T.page?'var(--page)':'var(--page-ts)'}"/>`});
  el.innerHTML=`<div class="flow"><div class="nodes left"></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="First visits from ${left.length} sources, named sources first then by change, to the pages they landed on">${paths}</svg>
    <div class="nodes right"></div></div>`;

  const node=(n,side)=>{
    const b=document.createElement('button');b.type='button';
    const told=n.key!=null&&(side==='left'?T.told.has(n.key):n.key===T.page);
    b.className='node'+(told?' told':'');
    const name=told?n.label:shorten(n.label);
    if(side==='left')b.innerHTML=`<span>${told?`<b>${esc(name)}</b>`:esc(name)}</span><span class="chg">${n.prev?fmtSigned(n.change):'new'}</span>`;
    else if(n.key==null)b.innerHTML=`<span class="muted">${esc(name)}</span>`;
    else b.innerHTML=told?`<span><b>${pathHTML(name)}</b></span>${n.isNew?'<span class="chg">new</span>':''}${n.left?`<span class="left"><i class="sw" style="background:var(--bnc)"></i>${n.left}</span>`:''}`:`<span>${esc(name)}</span>`;
    b.title=side==='left'?sourceHint(n.label,n.value,n.prev,S.unit):n.leftHint||pageHint(n.label,n.value);
    b.setAttribute('aria-label',side==='left'
      ?`${n.label}, ${n.change>=0?'up':'down'} ${fmtInt(Math.abs(n.change))}, ${fmtInt(n.value)} ${S.unit}. Open`
      :`${n.label}, ${fmtInt(n.value)} first visits landed here${n.leftHint?`. ${n.leftHint}`:''}. Open`);
    b.onclick=e=>{e.stopPropagation();n.key==null?openView({v:side==='left'?'sources':'pages'},b)
      :openFilter({[side==='left'?'referrer':'path']:n.key},n.label,b)};
    return b;
  };
  const place=(col,list,geo,side)=>{
    const els=list.map(n=>node(n,side));col.replaceChildren(...els);
    // Labels sit at the middle of their node, nudged apart when nodes are too thin to hold them.
    observe(col,()=>{
      const H=col.clientHeight;if(!H)return;
      const ys=spread(geo.map(n=>(n.top+n.h/2)/100*H),Math.max(...els.map(b=>b.offsetHeight))+6,H);
      els.forEach((b,i)=>b.style.top=ys[i]+'px');
    });
  };
  place(el.querySelector('.nodes.left'),left,L,'left');
  place(el.querySelector('.nodes.right'),right,R,'right');
}

function drawGrowth(el,W){
  if(!W){el.innerHTML='<div class="empty">Nothing to compare with yet</div>';return}
  const aria=`Change in ${HOME?.S?.unit||'visitors'}, against the ${DAYS} days before: `+W.steps.map(s=>`${s.label} ${fmtSigned(s.value)}`).join(', ')+'.';
  drawSteps(el,W.steps,{fmt:v=>fmtSigned(v),aria,colorOf:s=>s.kind==='total'?'var(--ink)':s.kind==='else'?'var(--src-t)':'var(--src)',
    openOf:s=>s.kind==='total'?openOverview:s.channel?b=>openFilter({channel:s.channel},s.label,b):s.key!==null&&s.kind!=='else'?b=>openFilter({referrer:s.key},s.label,b):null});
}

// The source whose visits bounce most beyond the site's, when bounce held and one stands out (bounceStandout).
const stayStandout=(S,B)=>B?.cause==='same'?bounceStandout(S.sources.filter(x=>x.bounce!=null).map(x=>({dim:'referrer',key:x.key,label:x.label,visits:x.visits,bounce:x.bounce})),S.c.bounce):null;
const stayCaption=(S,B)=>B?.cause==='same'?bounceHeld(S.c.bounce,stayStandout(S,B)):bounceCaption(B);
// All visits, then the source the caption names: the one it credits with the change, or, when bounce held, the one
// that bounces most. With neither, the period before, unless bounce held. Under them, how long a visit lasts.
function drawStay(el,S,B){
  const {c,p}=S;
  if(!c.visits){el.innerHTML=`<div class="empty">${noneYet('visits',p.visits>0,DAYS)}</div>`;return}
  const rows=[{pct:c.bounce,label:`all visits${p.visits?` · ${pts(c.bounce,p.bounce)}`:''}`,story:false,
    aria:`All visits: ${fmtPct(c.bounce)} bounce${p.visits?`, was ${fmtPct(p.bounce)}`:''}. Open`,open:openBounce}];
  const s=B?.cause==='source'?S.sources.find(x=>x.key===B.top.key):stayStandout(S,B);
  if(s&&s.bounce!=null)rows.push({pct:s.bounce,label:s.label,story:true,
    aria:`${s.label}: ${fmtPct(s.bounce)} bounce. Open`,open:b=>openFilter({referrer:s.key},s.label,b)});
  // When bounce held, "same" already says it; a second row would only repeat it, rounded differently (37% beside 36%).
  else if(p.visits&&B?.cause!=='same')rows.push({pct:p.bounce,label:`the ${DAYS} days before`,fill:'var(--bnc)',
    aria:`The ${DAYS} days before: ${fmtPct(p.bounce)} bounce. Open`,open:openBounce});
  // As tall as its rows need, so the visit's length sits right under them.
  el.style.flex=`0 0 ${rows.length*52}px`;
  drawSquares(el,rows);
  if(c.duration!=null)el.insertAdjacentHTML('afterend',`<p class="stay-time"><b>${fmtDur(c.duration)}</b>per visit${p.visits&&p.duration?` · ${changeWord(c.duration,p.duration)}`:''}</p>`);
}

// Returns the rows it shows, for the caption. also: the page the caption names, besides the sentence's.
function drawPages(el,T,pageRows,also=null){
  const live=pageRows.filter(r=>r.value>0),told=new Set([T.page,also].filter(k=>k!=null));
  // The pages the sentence and the caption name always get their own block.
  const keep=live.filter(r=>told.has(r.key)),top=[...live.filter(r=>!told.has(r.key)).slice(0,6-keep.length),...keep];
  const rest=live.filter(r=>!top.includes(r));
  // With no earlier period at all (a new site), every page would read "new", which says nothing.
  const before=live.some(r=>r.prev);
  const items=top.map(r=>({label:r.label,value:r.value,sub:r.prev?change(r.value,r.prev):before?'new':'',short:r.prev||!before?null:'new',
    ...(told.has(r.key)?{...fullOf('page'),told:true}:tintOf('page')),onClick:b=>openFilter({path:r.key},r.label,b)}));
  if(rest.length)items.push({label:'other',value:sum(rest.map(r=>r.value)),sub:`${rest.length} pages`,...paleOf('page'),last:true,
    onClick:b=>openView({v:'pages'},b)});
  treemap(el,items);
  return top;
}

/* ---------- what happened ---------- */
// One glyph per kind of event, the same in the list and under the daily bars, so shape alone links them.
const GLYPH={note:'<path d="M2 1h6a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5L2.5 9.5V7H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/>',spike:'<path d="M5 .5L9.5 9h-9z"/>',page:'<rect x="1" y="1" width="8" height="8" rx="1"/>',source:'<circle cx="5" cy="5" r="4"/>',
  quiet:'<path d="M5 8.5L1.2 1.5h7.6z" fill="var(--tile)" stroke-width="1.5" stroke-linejoin="round"/>',week:'<path d="M1 5h7M5.5 2L8.5 5l-3 3" fill="none" stroke-width="1.5"/>'};
// Each glyph takes its subject's colour: days are time, new pages are pages, new sources are sources.
// The owner's notes, a speech bubble, are in ink: their own words, not something counted.
const GLYPH_SUBJ={spike:'time',quiet:'time',page:'page',source:'src'};
const glyph=(kind,told)=>{const c=GLYPH_SUBJ[kind]?`var(--${GLYPH_SUBJ[kind]})`:'var(--ink)';
  return `<svg class="glyph" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="${c}" stroke="${c}">${GLYPH[kind]}</svg>`};

// Dated things worth knowing about, newest first: spikes, quiet days, new pages and sources, and a
// big week-on-week change. Each opens the view that explains it. Today is left out of the checks
// that compare whole days, because it isn't over yet.
function findEvents(S,T,ser,firsts,pageRows){
  const cur=ser.cur.visitors,n=cur.length,usual=median(cur),ev=[];
  const spike=S.spike>=0?S.spike:findSpike(cur,ser.start);
  if(spike>=0){
    const src=ser.top[spike],from=src!=null?`${fmtInt(ser.topVisitors[spike])} from ${labelOf('referrer',src)}`:null;
    ev.push({day:spike,kind:'spike',told:S.spike>=0,name:'Big day',title:`Big day: ${fmtInt(cur[spike])} visitors`,
      short:`${fmtInt(cur[spike])} visitors${from?`, ${from}`:''}`,
      detail:from||`a usual day has ${fmtInt(usual)}`,
      open:src!=null?b=>openFilter({referrer:src},labelOf('referrer',src),b):openOverview});
  }
  // Quiet days in a row are one event, at the first of them: one thing happened, not one a day.
  const check='Check that Lede’s line is still on every page.';
  for(const q of quietRuns(cur,ser.prev.visitors)){
    const k=q.end-q.start+1,until=fmtDay(dayDate(ser.start,q.end));
    ev.push(k===1?{day:q.start,kind:'quiet',told:false,name:'Quiet day',title:`Quiet day: ${fmtInt(q.visitors)} visitors`,tag:'quiet',
      short:`${fmtInt(q.visitors)} visitors, far fewer than usual. ${check}`,detail:`a usual day has ${fmtInt(q.usual)}. ${check}`,open:openOverview}
      :{day:q.start,kind:'quiet',told:false,name:'Quiet days',title:`Quiet days: ${fmtInt(q.visitors)} visitors in ${k} days, to ${until}`,tag:'quiet',
      short:`${k} days far quieter than usual, to ${until}. ${check}`,detail:`a usual day has ${fmtInt(q.usual)}. ${check}`,open:openOverview});
  }
  const enough=v=>v>=Math.max(20,S.c.visitors*.005);
  for(const f of firsts.pages){
    const row=pageRows.find(r=>r.key===f.key);
    if(row&&!row.prev&&f.day>0&&S.p.visitors&&enough(f.visitors))ev.push({day:f.day,kind:'page',key:f.key,told:f.key===T.page,name:'New page',title:`New page: ${f.key}`,tag:'new page',
      short:f.key,detail:`${fmtInt(f.visitors)} visitors since`,open:b=>openFilter({path:f.key},f.key,b)});
  }
  for(const f of firsts.sources){
    const src=S.sources.find(x=>x.key===f.key);
    if(f.key&&src&&!src.prev&&f.day>0&&S.p.visitors&&enough(f.visitors))ev.push({day:f.day,kind:'source',key:f.key,told:T.told.has(f.key),name:'New source',title:`New source: ${src.label}`,tag:shorten(src.label,14),
      short:src.label,detail:`${fmtInt(f.visitors)} visitors since`,open:b=>openFilter({referrer:f.key},f.key,b)});
  }
  // The owner's notes on days of this period. Opening one edits it.
  cur.forEach((_,i)=>{
    const note=NOTES.find(x=>x.day===dayKey(dayDate(ser.start,i)));
    if(note)ev.push({day:i,kind:'note',told:S.note?.note===note,name:'Your note',title:note.text,tag:note.text.length>16?note.text.slice(0,15).trimEnd()+'…':note.text,
      short:note.text,detail:'your note',open:b=>editNote(i,b)});
  });
  // The last full week against the one before, unless a spike sits in either (it has its own event).
  if(n>=15){
    const a=sum(cur.slice(n-8,n-1)),b=sum(cur.slice(n-15,n-8)),pct=b?Math.round((a-b)/b*100):0;
    const sp=findSpike(cur,ser.start);
    if(Math.abs(pct)>=10&&!(sp>=n-15&&sp<n-1))ev.push({day:n-2,kind:'week',told:false,name:'Last 7 days',title:`Visitors ${pct>0?'up':'down'} ${Math.abs(pct)}% from the 7 days before`,
      short:`${pct>0?'up':'down'} ${Math.abs(pct)}% from the 7 days before`,detail:`${fmtInt(a)} in the last 7 full days, ${fmtInt(b)} the 7 before`,open:openOverview});
  }
  return ev.sort((x,y)=>y.day-x.day||(x.kind==='spike'?-1:1));
}

function eventButton(e,ser,full){
  const b=document.createElement('button');b.type='button';b.className='event';
  const d=dayDate(ser.start,e.day),when=`${fmtWeekday(d)} ${fmtDay(d)}`;
  b.innerHTML=full?`${glyph(e.kind,e.told)}<span><b>${esc(e.title)}</b><span>${fmtDate(d)} · ${esc(e.detail)}</span></span>${CHEV}`
    :`${glyph(e.kind,e.told)}<span><b>${esc(e.name)} · ${when}</b><span>${esc(e.short)}</span></span>`;
  b.setAttribute('aria-label',e.kind==='note'?`${fmtDate(d)}, your note: ${e.title}. Edit it.`:`${fmtDate(d)}: ${e.title}. ${e.detail}${/[?.]$/.test(e.detail)?'':'.'} Open.`);
  b.onclick=ev=>{ev.stopPropagation();e.open(b)};

// Markers under the daily bars, one slot per day, each with a short name when there is room for it.
// pick: which of home's events these are, so the list they open follows a change of period.
function drawMarks(el,events,ser,pick=null){
  const n=ser.cur.visitors.length,byDay=new Map(),day=i=>fmtDay(dayDate(ser.start,i));
  for(const e of events)if(e.kind!=='week')byDay.set(e.day,[...(byDay.get(e.day)||[]),e]);
  // A week is short enough to name every day; longer periods show their first and last date.
  el.innerHTML=n<=7?Array.from({length:n},(_,i)=>`<span class="m-day" style="left:${((i+.5)/n*100).toFixed(2)}%">${fmtWeekday(dayDate(ser.start,i))}</span>`).join('')
    :`<span class="m-date">${day(0)}</span><span class="m-date end">${day(n-1)}</span>`;
  [...byDay].sort((a,b)=>a[0]-b[0]).forEach(([d,list])=>{
    const b=document.createElement('button');b.type='button';b.className='mark';b.dataset.day=d;
    b.style.left=((d+.5)/n*100).toFixed(2)+'%';
    // The owner's own words name the day best; then a big day, then whatever else has a name.
    const note=list.find(e=>e.kind==='note'),only=list.every(e=>e.kind==='note');
    const tag=note?.tag||(list.some(e=>e.kind==='spike')?'big day':list.find(e=>e.tag)?.tag);
    b.innerHTML=`<span class="g">${list.map(e=>glyph(e.kind,e.told)).join('')}</span>${tag?`<span class="tag">${esc(tag)}</span>`:''}`;
    // "Wed, Oct 7: big day, 840 visitors; new source, Hacker News": one line, so each event's own colon becomes a comma.
    const when=fmtDate(dayDate(ser.start,d)),said=list.map(e=>e.kind==='note'?e.title:e.title[0].toLowerCase()+e.title.slice(1).replace(': ',', '));
    b.title=`${when}: ${said.join('; ')}`;
    b.setAttribute('aria-label',`${when}: ${said.join('; ')}. ${only?'Edit your note':'Show what happened'}`);
    // A day with only a note opens the note; any other marker opens the list of what happened, where each item opens what explains it.
    b.onclick=ev=>{ev.stopPropagation();only?editNote(d,b):openView({v:'events',pick},b)};
    el.appendChild(b);
  });
  // Names that would run into each other or into the dates at either end are left to the tooltip.
  observe(el,()=>{
    const W=el.clientWidth;if(!W)return;
    const [d0,d1]=el.querySelectorAll('.m-date');
    let edge=d0?d0.offsetWidth+8:0;
    const end=d1?W-d1.offsetWidth-8:W;
    for(const b of el.querySelectorAll('.mark')){
      const t=b.querySelector('.tag');if(!t)continue;
      t.style.visibility='';
      const x=parseFloat(b.style.left)/100*W,w=t.offsetWidth;
      if(x-w/2<edge||x+w/2>end)t.style.visibility='hidden';else edge=x+w/2+8;
    }
  });
}

/* ---------- the owner's notes ---------- */
// Home's and the overview's daily charts take notes: click a day, or focus the chart, pick a day with the arrow keys and
// press Enter. The ring around the picked day is drawn by CSS from --i and --n, so it survives the chart redrawing itself.
// pad: the width of the chart's scale on the right (40 with one, as on the overview; 0 on home).
function noteDays(el,ser,pad=40){
  if(SHARED)return;
  const n=ser.cur.visitors.length;
  let at=n-1;
  el.classList.add('notable');el.tabIndex=0;el.setAttribute('role','group');
  el.setAttribute('aria-label','Visitors per day. Pick a day with the arrow keys, then press Enter to write a note on it.');
  el.style.setProperty('--n',n);el.style.setProperty('--pad',pad+'px');
  const pick=i=>{at=Math.max(0,Math.min(n-1,i));el.style.setProperty('--i',at)};
  el._pick=pick;pick(at);
  // The keyboard gets the same hint over the picked day that a pointer gets on hover.
  const say=()=>{const r=el.querySelectorAll('rect[data-hint]')[at];if(r){showHint(r);hint.textContent=r.dataset.hint.replace('Click to','Press Enter to')}};
  el.onfocus=()=>setTimeout(say);
  // On home the chart sits in a tile that opens the overview; a day takes the click instead.
  el.onclick=e=>{
    e.stopPropagation();
    const r=el.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/(r.width-pad)*n);
    if(i>=0&&i<n){pick(i);editNote(i,el,e)}
  };
  el.onkeydown=e=>{
    const step={ArrowLeft:-1,ArrowRight:1,Home:-n,End:n}[e.key];
    if(step){
      e.preventDefault();pick(at+step);say();
      const note=NOTES.find(x=>x.day===dayKey(dayDate(ser.start,at)));
      announce(`${fmtDate(dayDate(ser.start,at),'long')}: ${fmtInt(ser.cur.visitors[at])} visitors${note?`. Your note: ${note.text}`:''}`);
    }else if(e.key==='Enter'||e.key===' '){e.preventDefault();editNote(at,el)}
  };
}

// A small form over day i: a few words on what the owner did, saved for everyone who opens the dashboard.
// Saving nothing removes the note. Esc or a click elsewhere closes it unsaved.
let closeNote=()=>{};
function editNote(i,anchor,at){
  closeNote();
  if(SHARED)return;
  const d=dayDate(HOME.ser.start,i),day=dayKey(d),note=NOTES.find(x=>x.day===day),when=fmtDate(d,'long');
  const f=document.createElement('form');f.className='note-edit';f.noValidate=true;
  f.setAttribute('role','dialog');f.setAttribute('aria-label',`Note for ${when}`);
  f.innerHTML=`<b>${esc(when)}</b><div class="add"><input name="text" maxlength="80" autocomplete="off" placeholder="What did you do that day? Leave empty to remove." aria-label="What you did on ${esc(when)}"><button class="retry">Save</button></div>
    <span class="err" role="alert"></span>${note?'<button type="button" class="del">Remove note</button>':''}`;
  const input=f.querySelector('input');input.value=note?.text||'';
  document.body.append(f);
  // Above the day when there is room, else below; always inside the window.
  const r=at?{left:at.clientX,width:0,top:at.clientY,bottom:at.clientY}:anchor.getBoundingClientRect(),w=f.offsetWidth,h=f.offsetHeight;
  f.style.left=Math.min(innerWidth-16-w,Math.max(16,r.left+r.width/2-w/2))+'px';
  f.style.top=(r.top-h-8>=16?r.top-h-8:Math.min(innerHeight-16-h,r.bottom+8))+'px';
  const outside=e=>{if(!f.contains(e.target))closeNote(false)};
  const picked=anchor.querySelectorAll?.('rect[data-hint]')[i];picked?.classList.add('on');
  closeNote=(back=true)=>{f.remove();picked?.classList.remove('on');document.removeEventListener('pointerdown',outside,true);closeNote=()=>{};if(back&&anchor.isConnected)anchor.focus()};
  document.addEventListener('pointerdown',outside,true);
  // Esc closes the form, not the view under it.
  f.onkeydown=e=>{if(e.key==='Escape'){e.stopPropagation();closeNote()}};
  // inert while saving, so a second press can't send it twice.
  const save=async text=>{
    if(f.inert)return;
    if(text===(note?.text||'')){closeNote();return}
    f.inert=true;
    const url=`/api/notes?site=${encodeURIComponent(SITE)}`;
    // The server's reason when it gives one; a failed fetch says "Failed to fetch", which is no help to anyone.
    let why='';
    try{
      const r=await fetch(text?url:`${url}&day=${day}`,text?{method:'PUT',body:JSON.stringify({day,text})}:{method:'DELETE'});
      const b=await r.json().catch(()=>({}));
      if(!r.ok){why=b.error;throw 0}
      NOTES=b.notes;
    }catch{f.inert=false;f.querySelector('.err').textContent=why||'Couldn’t save the note. Check your connection, then try again.';input.focus();return}
    closeNote(false);
    // The sentence and the markers may change with the note, so everything open redraws.
    if(await redrawAll(text?(note?'Note changed':'Note saved'):'Note removed')){
      const top=stack[stack.length-1].el,chart=top.querySelector('.notable');
      if(chart){chart._pick(i);chart.focus({preventScroll:true})}
      else(top.querySelector(`.mark[data-day="${i}"]`)||top.querySelector('.t-days .tile-title'))?.focus({preventScroll:true});
    }
  };
  f.onsubmit=e=>{e.preventDefault();save(input.value.trim())};
  f.querySelector('.del')?.addEventListener('click',()=>save(''));
  input.focus();
}

function renderEvents(body,events,ser){
  body.innerHTML=`<p class="say">${eventsSentence(events,DAYS,ser.start,true)}</p>${events.length?'<section class="card"><div class="events-list"></div></section>':''}`;
  if(events.length)body.querySelector('.events-list').replaceChildren(...events.map(e=>eventButton(e,ser,true)));
}

function drawHeat(el,S,ser,hourly){
  if(!hourly){el.innerHTML='<div class="empty">Couldn’t load the hours. Check your connection, then reopen the overview.</div>';return false}
  const cells=Array.from({length:7},()=>Array(24).fill(0)),spikeHours=Array(24).fill(0);
  const spikeDay=S.spike>=0?dayDate(ser.start,S.spike).toDateString():null;
  // Hours are placed by their real local time, so days on the other side of a DST change line up.
  hourly.visitors.forEach((v,i)=>{
    const t=new Date((hourly.start+i*3600)*1000),r=(t.getDay()+6)%7,h=t.getHours();
    cells[r][h]+=v;
    if(spikeDay&&t.toDateString()===spikeDay)spikeHours[h]+=v;
  });
  const spikeRow=spikeDay?(new Date(spikeDay).getDay()+6)%7:-1;
  const max=maxOf(cells.flat());
  if(!max){el.innerHTML='<div class="empty">No visitors yet</div>';return false}
  const say=el.parentNode.querySelector('.heat-say');if(say)say.innerHTML=hoursStory(cells);
  // The hour and the window the sentence names are marked: the cell outlined, the hours underlined.
  const W=busyWindow(cells),mark=s=>`<b class="hw" style="left:${s/24*100}%;width:calc(${(Math.min(24,s+3)-s)/24*100}% - 2px)"></b>`;
  const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],DAYS_N=['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays'],steps=[8,25,45,70,100];
  let html='',hits=0,best=[0,0];
  // A cell is ringed when most of its visitors came on the spike day.
  for(let r=0;r<7;r++)for(let h=0;h<24;h++){
    const v=cells[r][h],hit=r===spikeRow&&v>0&&spikeHours[h]>=v*.5;
    if(hit)hits++;
    if(v>cells[best[0]][best[1]])best=[r,h];
    html+=`<i class="${hit?'hit':''}${W&&W.best[0]===r&&W.best[1]===h?' best':''}" style="background:color-mix(in srgb,var(--time) ${steps[Math.min(4,Math.floor(v/max*5))]}%,transparent)" title="${DAYS_N[r]}, ${h}:00: ${fmtInt(v)} visitors, all ${DAYS_N[r]} added up"></i>`;
  }
  el.innerHTML=`<div class="heat"><div class="days" aria-hidden="true">${DAYN.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cells" role="img" aria-label="Visitors by weekday and hour. Busiest: ${DAYN[best[0]]} at ${best[1]}:00.">${html}</div><span></span>
    <div class="hours" aria-hidden="true"><span style="grid-column:1/7">0h</span><span style="grid-column:7/13">6h</span><span style="grid-column:13/19">12h</span><span style="grid-column:19/25">18h</span>${W?mark(W.start)+(W.start>21?mark(0).replace(/width:[^;"]*/,`width:calc(${(W.start-21)/24*100}% - 2px)`):''):''}</div></div>`;
  return hits>0;
}

/* ---------- sharing ---------- */
// Read-only links to one site's stats. Copy link copies the site's newest link, making one when there is none.
// Each isolate keeps the list for a minute, so a stopped link can keep working that long.
const shareUrl=t=>`${location.origin}/s/${t}`;
async function shares(method,{site,token}={}){
  const r=await fetch(`/api/shares${token?`?token=${encodeURIComponent(token)}`:''}`,{method,body:site?JSON.stringify({site}):undefined});
  const body=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(body.error||"Couldn't reach Lede. Try again.");
  return body;
}
function showShare(open){
  const panel=$('#share-panel');
  panel.hidden=!open;$('#share').setAttribute('aria-expanded',open);
  if(open)drawShare();
}
async function drawShare(msg=''){
  const panel=$('#share-panel'),site=SITE;
  let list;
  try{list=(await shares('GET')).shares.filter(s=>s.site===site)}
  catch(e){panel.innerHTML=`<p class="muted">${esc(e.message)}</p>`;return}
  if(site!==SITE||panel.hidden)return;
  panel.innerHTML=`<p>Anyone with this link can see <b>${esc(displayHost(site))}</b>'s stats. They can't change anything.</p>
    <button type="button" class="retry" data-a="copy">Copy link</button>
    ${list.length?`<ul>${list.map(s=>`<li><code>${esc(shareUrl(s.token))}</code><button type="button" class="share-b" data-stop="${esc(s.token)}">Stop sharing</button></li>`).join('')}</ul>`:''}
    <p class="muted msg" role="status">${esc(msg)}</p>`;
  panel.querySelector('[data-a="copy"]').onclick=async()=>{
    try{
      const token=list[0]?.token??(await shares('POST',{site})).share.token;
      await navigator.clipboard.writeText(shareUrl(token)).then(()=>drawShare('Copied'),()=>drawShare());
    }catch(e){panel.querySelector('.msg').textContent=e.message}
  };
  panel.querySelectorAll('[data-stop]').forEach(b=>b.onclick=async()=>{
    try{await shares('DELETE',{token:b.dataset.stop});drawShare('This link stops working within a minute.')}
    catch(e){panel.querySelector('.msg').textContent=e.message}
  });
}
// A click anywhere else closes the card.
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.site')){showShare(false);showSetup(false)}});

/* ---------- setup ---------- */
// What an owner looks for once in a while, in one place: the line to put on pages, another site to count, whether
// the week's story is sent, and signing out. Nothing here is a setting Lede needs; it all works without it.
function showSetup(open){
  const panel=$('#setup-panel');
  panel.hidden=!open;$('#setup').setAttribute('aria-expanded',open);
  if(open)drawSetup();
}
function drawSetup(msg=''){
  const panel=$('#setup-panel'),tag=`<script defer src="${location.origin}/t.js"><\/script>`,cmd='npx wrangler secret put ALERT_WEBHOOK';
  // Each part split by a hairline; every command sits in a well with its own Copy, and a state is a chip by its heading.
  const well=(text,k)=>`<div class="code"><code>${esc(text)}</code><button type="button" class="share-b" data-copy="${k}">Copy</button></div>`;
  panel.innerHTML=`<div><div class="sh"><b>Lede’s line</b></div><p class="muted">On every page of ${esc(displayHost(SITE))}, so each visit is counted.</p>${well(tag,'line')}</div>
    <div><div class="sh"><b>Another site</b></div>${DEMO?'<p class="muted">The sample can’t count another site; your own Lede can.</p>':`<form novalidate><div class="add"><input name="site" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="example.org" aria-label="Another site’s address"><button class="retry">Add</button></div></form>`}</div>
    <div><div class="sh"><b>Tab icon</b>${ICON!=null?'<button type="button" class="share-b" data-icon="">Automatic</button>':''}</div>
      <p class="muted">${ICON==null?'Picked from the site’s name, so its tabs stand apart from other sites’. Pick one to keep it.':'Your pick, for everyone who opens this site’s stats.'}</p>
      <div class="icons" role="group" aria-label="Tab icon">${ICONS.map((_,i)=>`<button type="button" data-icon="${i}" aria-pressed="${i===iconFor(SITE,SITES,ICON)}" aria-label="Colourway ${i+1}"><img src="${iconURL(i)}" alt="" width="28" height="28"></button>`).join('')}</div></div>
    <div><div class="sh"><b>Messages</b><span class="onoff${MESSAGES?' on':''}">${MESSAGES?'On':'Off'}</span></div>
      <p class="muted">${MESSAGES?'The week’s story every Monday, and a line when far more people than usual are here at once.':'The week’s story every Monday in Slack, Discord or ntfy. Run this, then paste the channel’s webhook address.'}</p>${MESSAGES?'':well(cmd,'cmd')}</div>
    ${PASSWORD?'<div class="out"><span class="muted">Signed in with the password</span><button type="button" class="share-b" data-a="out">Sign out</button></div>':''}
    <p class="muted msg" role="status">${esc(msg)}</p>`;
  panel.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy==='line'?tag:cmd)
    .then(()=>{b.textContent='Copied';announce('Copied')},()=>{panel.querySelector('.msg').textContent='Couldn’t copy it. Select it and press Ctrl+C or ⌘C.'}));
  const form=panel.querySelector('form');
  if(form)form.onsubmit=async e=>{
    e.preventDefault();
    const site=form.site.value.trim();if(!site)return;
    try{
      const r=await fetch('/api/sites',{method:'POST',body:JSON.stringify({site})}),b=await r.json().catch(()=>({}));
      if(!r.ok)return drawSetup(b.error||'Couldn’t add the site. Try again.');
      SITES=b.sites;renderTopbar();showSetup(true);drawSetup(`Added ${displayHost(b.sites.at(-1))}. Pick it from the list at the top, and put Lede’s line on its pages.`);
    }catch{drawSetup('Couldn’t add the site. Check your connection, then try again.')}
  };
  panel.querySelectorAll('[data-icon]').forEach(b=>b.onclick=async()=>{
    const icon=b.dataset.icon===''?null:+b.dataset.icon;
    try{
      const r=await fetch(`/api/icon?site=${encodeURIComponent(SITE)}`,{method:'PUT',body:JSON.stringify({icon})});if(!r.ok)throw new Error(r.status);
      ICON=icon;setIcon();drawSetup();panel.querySelector('.icons [aria-pressed="true"]')?.focus();
    }catch{drawSetup('Couldn’t save the tab icon. Check your connection, then try again.')}
  });
  const out=panel.querySelector('[data-a="out"]');
  if(out)out.onclick=async()=>{
    try{await fetch('/api/signout',{method:'POST'});memo.clear();showSignIn()}catch{drawSetup('Couldn’t sign out. Check your connection, then try again.')}
  };
}

// No visit has ever arrived: the whole home is one card that says how to start, and checks again every minute.
function showOnboarding(){
  const tag=`<script defer src="${location.origin}/t.js"><\/script>`;
  $('#period').hidden=true;
  $('#story').innerHTML='';
  $('#grid').innerHTML=`<section class="card onboard"><img class="logo" src="/icon.svg" alt=""><b>No visits yet</b>
    <span>Add this line to every page of ${esc(displayHost(SITE))}. The first visit shows up here within a couple of minutes.</span>
    <code>${esc(tag)}</code><button type="button" class="retry">Copy</button><span class="err" role="alert"></span></section>`;
  const btn=$('#grid .retry');
  btn.onclick=()=>navigator.clipboard.writeText(tag).then(()=>{btn.textContent='Copied';announce('Copied the line')},()=>{
    const range=document.createRange();range.selectNodeContents($('#grid code'));getSelection().removeAllRanges();getSelection().addRange(range);
    $('#grid .err').textContent='Couldn’t copy it, so it’s selected. Press Ctrl+C or ⌘C.';
  });
}

// The stats need the password. The card replaces everything, so whatever was open is left behind.
function showSignIn(){
  if($('#grid form.signin'))return;
  // A sub-page is open: start over from its address, which asks for the password on the way.
  if(stack.length>1){location.reload();return}
  $('#site').textContent='';$('#hint').textContent='';
  $('#share').hidden=true;$('#share-panel').hidden=true;$('#setup').hidden=true;$('#setup-panel').hidden=true;
  $('#period').hidden=true;
  $('#story').innerHTML='';
  $('#grid').innerHTML=`<form class="card onboard signin" novalidate><img class="logo" src="/icon.svg" alt=""><b>Enter your password</b>
    <div class="add"><input name="password" type="password" autocomplete="current-password" aria-label="Password"><button class="retry">Sign in</button></div>
    <span class="err" role="alert"></span><span class="muted">Forgot it? Run npx wrangler secret put DASHBOARD_PASSWORD.</span></form>`;
  const form=$('#grid form'),input=form.password,err=form.querySelector('.err');
  input.focus();
  input.oninput=()=>{err.textContent=''};
  form.onsubmit=async e=>{
    e.preventDefault();
    if(!input.value){err.textContent='Type your password.';return}
    try{
      const r=await fetch('/api/signin',{method:'POST',body:JSON.stringify({password:input.value})});
      if(!r.ok){err.textContent=(await r.json().catch(()=>({}))).error||'Couldn’t check the password. Check your connection, then try again.';input.select();return}
      memo.clear();
      boot();
    }catch{err.textContent='Couldn’t check the password. Check your connection, then try again.'}
  };
}

// First run: the only setting is which site to count. Events from other hosts are dropped.
function askForSite(){
  $('#period').hidden=true;
  $('#story').innerHTML='';
  $('#grid').innerHTML=`<form class="card onboard" novalidate><img class="logo" src="/icon.svg" alt=""><b>What’s your site’s address?</b>
    <span>Lede counts visits to this site and ignores the rest.</span>
    <div class="add"><input name="site" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="example.com" aria-label="Your site’s address"><button class="retry">Add</button></div>
    <span class="err" role="alert"></span></form>`;
  const form=$('#grid form'),input=form.site,err=form.querySelector('.err');
  input.focus();
  input.oninput=()=>{err.textContent=''};
  form.onsubmit=async e=>{
    e.preventDefault();
    if(!input.value.trim()){err.textContent='Type your site’s address, like example.com.';return}
    try{
      const r=await fetch('/api/sites',{method:'POST',body:JSON.stringify({site:input.value})});
      const body=await r.json();
      if(!r.ok){err.textContent=body.error;return}
      store.set('lede_site',body.sites.at(-1));
      boot();
    }catch{err.textContent='Couldn’t save the address. Check your connection, then try again.'}
  };
}

// The first load shows the four tiles empty, so nothing jumps when the numbers arrive.
function showSkeleton(){
  $('#story').innerHTML='<div class="sk" style="width:190px;height:62px"></div><div style="display:flex;flex-direction:column;gap:8px"><i class="sk" style="height:14px"></i><i class="sk" style="height:14px;width:70%"></i></div>';
  $('#grid').innerHTML=['t-days','t-flow','t-stay','t-pages'].map(c=>`<div class="tile ${c}" aria-hidden="true"><i class="sk" style="height:12px;width:45%"></i></div>`).join('');
}

let homeRender=0;
function renderHome(message){return homeDrawn=drawHome(message)}
async function drawHome(message){
  const gen=++homeRender;
  stack[0].title=displayHost(SITE);
  const grid=$('#grid'),home=$('#home');
  // A new period or site keeps the old numbers on screen, faded, until the new ones arrive.
  if(HOME&&!HOME.empty)home.classList.add('busy');else showSkeleton();
  home.setAttribute('aria-busy','true');
  const done=()=>{home.classList.remove('busy');home.removeAttribute('aria-busy')};
  let sumR,ser,pages,refs,flows,live,hourly;
  try{
    [sumR,ser,pages,refs,flows,live,hourly]=await Promise.all([api('summary'),api('series'),api('breakdown',{dim:'path'}),
      api('breakdown',{dim:'referrer'}),api('flows'),liveNow().catch(()=>null),api('hourly',HOURS).catch(()=>null)]);
  }catch(e){if(gen===homeRender){done();release(grid);$('#story').innerHTML='';HOME=null;showError(grid,e,()=>renderHome(message));announce('Couldn’t load the stats')}return false}
  // The sentence ties a change to the owner's notes; they come with the goals, which load alongside.
  await goalsReady;
  // A newer render (another period or site) started while this one was loading.
  if(gen!==homeRender)return false;
  done();release(grid);
  // The card that says how to start is for a site that has never had a visit (ever, from the last 90 days; an
  // answer without it is read as never). A site gone quiet gets its home, which says so.
  if(sumR.cur.views===0&&sumR.prev.views===0&&!sumR.ever){HOME={empty:true};showOnboarding();return true}
  $('#period').hidden=false;
  const S=readStory({totals:sumR,ser,pages,refs,flows,notes:NOTES}),T=tellStory(S,ser,DAYS);
  if(!S.c.visitors&&!S.p.visitors)T.html+=' Check that Lede’s line is still on every page.';
  HOME={S,T,ser,hourly,pace:todayPace(hourly,Date.now()/1000)};
  renderStory(S,T,live);
  // At very high volume Analytics Engine keeps only some of the views; views are scaled back up, visitors aren't.
  for(const note of countNotes(sumR,DAYS))$('#story .say-col').insertAdjacentHTML('beforeend',`<p class="sampled">${note}</p>`);
  const pageRows=pages.rows.map(r=>({key:r.key,label:labelOf('path',r.key),value:r.visitors,prev:r.prev?.visitors}));
  const openDim=g=>t=>openView({v:g},t);
  // The day each page and source was first seen comes with the breakdowns.
  const firstsOf=rows=>rows.filter(r=>r.first!=null&&r.visitors>0).map(r=>({key:r.key,day:r.first,visitors:r.visitors}));
  const B=bounceSplit(S),events=findEvents(S,T,ser,{pages:firstsOf(pages.rows),sources:firstsOf(refs.rows)},pageRows);
  HOME.events=events;HOME.pageRows=pageRows;
  goalsReady.then(()=>{if(gen===homeRender)drawGoalLine()});

  // Four tiles, one question each: when, from where to where, did they stay, what they read.
  // A caption only where it adds a fact the chart doesn't show by itself.
  const days=tile('t-days',`Visitors per day${S.p.visitors?`, against the ${DAYS} days before`:''}`,null,openOverview);
  const marks=document.createElement('div');marks.className='marks';
  days.querySelector('.viz').after(marks);
  const flow=tile('t-flow','Where visitors came from, and the pages they landed on',flowCaption(S,T,flows.flows,DAYS),openDim('sources'));
  const stay=tile('t-stay','Did they stay',stayCaption(S,B),openBounce);
  const pg=tile('t-pages','Pages by visitors','',openDim('pages'));
  grid.replaceChildren(days,flow,stay,pg);

  drawDays(days.querySelector('.viz'),S,ser,{note:!SHARED});
  noteDays(days.querySelector('.viz'),ser,0);
  drawMarks(marks,events,ser);
  drawFlow(flow.querySelector('.viz'),S,T,flows.flows,flows.prev||[],pageRows);
  drawStay(stay.querySelector('.viz'),S,B);
  const found=pagesFinding(pageRows,T.page),shown=drawPages(pg.querySelector('.viz'),T,pageRows,found?.key);
  pg.querySelector('.cap').innerHTML=(found??pagesCaption(shown)).html;
  if(INSIGHT)drawInsight(gen);
  if(message)announce(message);
  return true;
}

// Asked for once home is drawn; with no line, nothing shows.
function drawInsight(gen){
  api('insight').then(b=>{
    const say=$('#story .sentence');
    if(gen===homeRender&&b.text&&say)say.insertAdjacentHTML('afterend',`<p class="goal-text"><b>Lede noticed</b><span class="sr">:</span> ${esc(b.text)}</p>`);
  },()=>{});
}

async function refreshOnline(){
  if(document.hidden||!HOME)return;
  // A sub-page hides home; of them only the Online view is live, and it redraws when it's the one showing.
  if(stack.length>1){const top=stack[stack.length-1];if(top.vw?.v==='online'&&!animating)redrawOnline(top.el.querySelector('.layer-body'));return}
  // Still waiting for the first visit: ask only whether one came, and leave the card (and its Copy button) alone till then.
  if(HOME.empty){
    try{const s=await api('summary',{},true);if(s.cur.views||s.prev.views||s.ever){memo.clear();renderHome()}}catch{}
    return;
  }
  try{
    listen();
    const [live,hourly]=await Promise.all([liveNow(),api('hourly',HOURS).catch(()=>null)]);
    HOME.hourly=hourly;HOME.pace=todayPace(hourly,Date.now()/1000);
    drawNow(live,HOME.T.told,HOME.pace);
  }catch{}
}

// Who is here now as it happens, when the Worker has its Durable Object (src/live.js): it pushes what
// /api/live answers whenever someone comes, goes or is still reading, and that's drawn as the minute's
// refresh draws it. The socket is closed while the tab is hidden, so a dashboard nobody looks at costs
// nothing, and opened again on the next refresh. Without the object (the sample data, a deploy without it)
// it never opens, isn't tried again, and the minute's refresh asks /api/live instead.
let socket=null,pushed=null,noSocket=false;
function listen(){
  if(DEMO||noSocket||document.hidden||(socket&&socket.site===SITE))return;
  if(socket)socket.close();
  const site=SITE,ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/live/ws?${new URLSearchParams({site})}`);
  socket=Object.assign(ws,{site});
  ws.onopen=()=>{ws.opened=true};
  ws.onmessage=e=>{if(ws!==socket)return;try{pushed={site,live:JSON.parse(e.data)}}catch{return}refreshOnline()};
  ws.onclose=()=>{if(!ws.opened)noSocket=true;if(ws===socket){socket=null;pushed=null}};
}
const liveNow=()=>pushed&&pushed.site===SITE&&socket?.readyState===1?Promise.resolve(pushed.live):api('live',{},true);

// The home's stats for the site seen last start loading with the site list instead of after it.
// renderHome asks for the same addresses, so it picks these up from the memo.
function prefetchHome(){
  for(const p of [api('summary'),api('series'),api('breakdown',{dim:'path'}),api('breakdown',{dim:'referrer'}),api('flows'),api('hourly',HOURS)])p.catch(()=>{});
}

async function boot(){
  // The address wins over what this browser remembers: a refresh or a shared link opens the same view.
  const route=urlToView(location.pathname,location.search),saved=store.get('lede_site');
  const sites=api('sites',{},true);
  if(route.site||saved){SITE=route.site||saved;DAYS=route.days||30;prefetchHome()}
  try{({sites:SITES,demo:DEMO,insight:INSIGHT,shared:SHARED=false,messages:MESSAGES=false,password:PASSWORD=false}=await sites)}catch(e){showError($('#grid'),e,boot);return}
  if(!SITES.length){askForSite();return}
  SITE=SITES.includes(route.site)?route.site:SITES.includes(saved)?saved:SITES[0];
  store.set('lede_site',SITE);
  // The period is in the address too (?days=7), so a shared link shows the same numbers to everyone.
  DAYS=route.days||30;
  document.title=`${displayHost(SITE)} · Lede`;setIcon();
  renderTopbar();
  loadGoals();
  const drawn=renderHome();
  history.replaceState({depth:0},'',urlFor(null));
  // A view in the address opens at once and fetches its own numbers alongside home's.
  if(route.view)openView(route.view,$('#home'),{instant:true});
  await drawn;
  // A site with no visits yet has only the card that says how to start.
  if(HOME?.empty&&stack.length>1){
    while(stack.length>1){const s=stack.pop();release(s.el);s.el.remove()}
    stack[0].el.style.visibility='';stack[0].el.inert=false;grow(false);
    history.replaceState({depth:0},'',urlFor(null));
  }
  startPolling();
}
// Signing in again runs boot again; the poller and the listener are set up only the first time.
let polling=false;
function startPolling(){
  if(polling)return;
  polling=true;
  setInterval(refreshOnline,60000);
  // Back on the tab: who is here now, without waiting for the next minute.
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOnline();else if(socket){socket.close();socket=null;pushed=null}});
}
// Hints: anything with a title shows it in the charts' tooltip, on hover and on keyboard focus, instead of the
// browser's own tooltip, which comes late and not at all in some browsers. The title moves to data-hint so the
// two don't show together; an element with no other name keeps it as its aria-label.
const hint=document.createElement('div');hint.className='tip hint';hint.hidden=true;document.body.append(hint);
let hintFor=null;
// A hint inside a chart sits at the pointer, since a ribbon's box can be far from where it was pointed at.
function showHint(el,at){
  const t=el.getAttribute('title');
  if(t){el.dataset.hint=t;el.removeAttribute('title');if(!el.getAttribute('aria-label')&&!el.textContent.trim())el.setAttribute('aria-label',t)}
  if(!el.dataset.hint)return;
  hintFor=el;hint.textContent=el.dataset.hint;hint.hidden=false;
  const r=at?{left:at.clientX,width:0,top:at.clientY-4,bottom:at.clientY+12}:el.getBoundingClientRect(),below=r.top<48;
  hint.classList.toggle('below',below);
  const w=hint.offsetWidth,x=Math.min(innerWidth-8-w/2,Math.max(8+w/2,r.left+r.width/2));
  hint.style.left=x+'px';hint.style.top=(below?r.bottom:r.top)+'px';
}
function hideHint(){hintFor=null;hint.hidden=true}
const hinted=e=>e.target.closest?.('[title]:not(svg *),[data-hint]');
const inChart=el=>el.ownerSVGElement?true:false;
document.addEventListener('pointerover',e=>{const el=hinted(e);if(el&&el!==hintFor)showHint(el,inChart(el)?e:null);else if(!el)hideHint()});
document.addEventListener('pointermove',e=>{if(hintFor&&inChart(hintFor)&&hinted(e)===hintFor)showHint(hintFor,e)});
document.addEventListener('focusin',e=>{const el=hinted(e);el?showHint(el):hideHint()});
document.addEventListener('focusout',hideHint);
document.addEventListener('pointerdown',hideHint);
addEventListener('scroll',hideHint,true);

boot();
</script>

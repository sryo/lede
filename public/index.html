<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lede</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/weepeople.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Layout: one rounded app window on a quiet canvas. The home screen tells the period's story in reading order:
   how much changed and why, then the charts that prove it. Each tile is a title, one graphic and one sentence.
   Every tile zooms to fill the window, and items inside zoom again into filtered views.
   Colour says what kind of thing a mark is, on every tile and sub-page: visitors over time are blue, sources amber,
   pages violet, bounce (people leaving) red, and people here now green. Colour is solid. Transparency means empty,
   before, those who left, or how much; and in crowded charts (Sankey ribbons, the spike day, the page treemap) the
   marks the sentence names stay solid while the rest fade, so the eye finds them. Small marks fade less so they show.
   Text stays ink; colour sits in marks, swatches and underlines. */
@font-face{font-family:"WeePeople";src:url("/weepeople.woff2") format("woff2");font-display:block}
:root{
  color-scheme:light;
  /* greys plus ink: canvas, window, tile, line (edges, tracks, hover, skeletons), before (--rule, below), muted text */
  --canvas:#FAF9F6; --win:#F3F1EC; --tile:#FFFFFF; --line:#E7E4DD;
  --ink:#1A1D2E; --muted:#5F6275;
  /* a page with no picture yet: light, as most pages are, so the shade over it shows in both themes */
  --paper:#EEEBE4;
  /* violet is a shade darker than it might be, so white names on a solid block read at AA */
  --time:#2F5BEA; --src:#FFAA00; --page:#8452F2; --bnc:#D7263D; --live:#12974A;
  /* text on a solid subject colour */
  --on-time:#FFFFFF; --on-src:#1A1D2E; --on-page:#FFFFFF; --on-bnc:#FFFFFF; --on-live:#FFFFFF;
  /* how opaque "the rest" and "empty" are; small marks (glyphs, thin bars, figures) get the stronger pair */
  --a-rest:50%; --a-pale:16%; --a-rest-s:75%; --a-pale-s:32%;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* six text sizes: fine print and axes, labels and rows, sentences, titles, hero numbers, the home total */
  --fs-xs:12px; --fs-s:14px; --fs-m:17px; --fs-l:20px; --fs-xl:44px; --fs-xxl:56px;
  /* concentric corners: the window's radius is a tile's plus the 16px between them */
  --r-win:36px; --r-tile:20px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --canvas:#0E0F13; --win:#15161C; --tile:#1D1F27; --line:#2C2F3A;
  --ink:#EDEEF3; --muted:#A3A6B6;
  --paper:#B4B7C2;
  --time:#6B8CFF; --src:#FFC14D; --page:#A585FF; --bnc:#FF5C6B; --live:#3DDC84;
  --on-time:#0E0F13; --on-src:#0E0F13; --on-page:#0E0F13; --on-bnc:#0E0F13; --on-live:#0E0F13;
  --a-rest:62%; --a-pale:24%; --a-rest-s:82%; --a-pale-s:40%;
}}
/* transparency, not white: a colour keeps its hue, and overlapping marks (crossing ribbons) show it */
:root{
  --time-t:color-mix(in srgb,var(--time) var(--a-rest),transparent); --time-p:color-mix(in srgb,var(--time) var(--a-pale),transparent);
  /* amber is light, so its faded versions need more opacity to show as much as the darker colours */
  --src-t:color-mix(in srgb,var(--src) calc(var(--a-rest) * 1.3),transparent); --src-p:color-mix(in srgb,var(--src) calc(var(--a-pale) * 1.7),transparent);
  --src-ts:color-mix(in srgb,var(--src) calc(var(--a-rest-s) * 1.2),transparent);
  --page-t:color-mix(in srgb,var(--page) var(--a-rest),transparent); --page-p:color-mix(in srgb,var(--page) var(--a-pale),transparent);
  --page-ts:color-mix(in srgb,var(--page) var(--a-rest-s),transparent);
  --bnc-t:color-mix(in srgb,var(--bnc) var(--a-rest),transparent); --bnc-p:color-mix(in srgb,var(--bnc) var(--a-pale),transparent);
  --live-t:color-mix(in srgb,var(--live) var(--a-rest),transparent); --live-p:color-mix(in srgb,var(--live) var(--a-pale),transparent);
  --live-ps:color-mix(in srgb,var(--live) var(--a-pale-s),transparent);
  --rule:color-mix(in srgb,var(--ink) 30%,var(--tile));
  /* a funnel's biggest drop */
  --lost:color-mix(in srgb,var(--ink) 20%,var(--tile));
  --lost-p:color-mix(in srgb,var(--ink) 12%,var(--tile));
  --focus:var(--page);
  /* what floats over the page: an outline, and a shadow below */
  --pop:0 0 0 1px var(--line),0 10px 28px -8px rgba(0,0,0,.3);
}

html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:14px/1.4 var(--font);box-sizing:border-box;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible,.note-edit .del:focus-visible,.event:focus-visible,.add input:focus-visible,.retry:focus-visible,.circle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
h1,h2,h3{margin:0;font:inherit}
.muted{color:var(--muted)}
/* under the window: what this is and where it lives */
.foot{max-width:1080px;margin:16px auto 0;text-align:center;font-size:var(--fs-xs);color:var(--muted);text-wrap:balance}
.foot a{color:inherit;text-decoration:none}.foot a b{color:var(--ink);font-weight:600}
.foot a:hover{text-decoration:underline;text-underline-offset:3px}

.win{display:flex;flex-direction:column;position:relative;max-width:1080px;margin:0 auto;min-height:clamp(860px,100%,940px);
  background:var(--win);border-radius:var(--r-win);overflow:hidden;box-shadow:0 0 0 1px var(--line)}

/* Home fills the window and grows past it when its tiles need the room; the page scrolls instead of tiles squeezing. */
.home{position:relative;flex:1 0 auto;display:flex;flex-direction:column;gap:16px;padding:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.site{position:relative;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;min-width:0}
.site b,.site select{font-size:var(--fs-l);font-weight:700;letter-spacing:-.02em}
.hint,.card-title{font-size:var(--fs-s);color:var(--muted)}
/* Share: a quiet button beside the site's name, opening a small card of read-only links */
.share-b{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:var(--fs-s);cursor:pointer}
.share-b[aria-expanded="true"]{color:var(--ink)}
.card.share-panel{position:absolute;top:calc(100% + 8px);left:0;z-index:5;width:min(380px,calc(100vw - 32px));font-size:var(--fs-s);box-shadow:var(--pop)}
.share-panel p{margin:0} .share-panel b{font-size:inherit;font-weight:650;letter-spacing:normal;color:var(--ink)}
.share-panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.share-panel li{display:flex;align-items:center;justify-content:space-between;gap:8px}
.share-panel code{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.share-panel .retry{align-self:flex-start}
.share-panel li .share-b{flex:none;height:28px}
.share-panel .msg:empty{display:none}
.share-b[aria-expanded="true"]{background:var(--tile);border-color:var(--rule)}
.card.setup-panel{gap:0;padding:4px 20px;width:min(400px,calc(100vw - 32px))}
.setup-panel>div{display:flex;flex-direction:column;gap:8px;padding:16px 0}
.setup-panel>div+div{border-top:1px solid var(--line)}
.setup-panel .sh{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.setup-panel .onoff{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);line-height:16px;color:var(--muted)}
.setup-panel .onoff:not(.on)::before{background:var(--rule)}
.setup-panel .onoff.on{color:var(--ink);font-weight:600}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{all:unset;cursor:pointer;border-radius:10px;padding:3px;line-height:0}
.icons button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.icons button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.setup-panel .code{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--win);box-shadow:inset 0 0 0 1px var(--line)}
.setup-panel .code code{flex:1;min-width:0;font:12px/1.5 var(--mono);color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.setup-panel .code .share-b{flex:none;height:28px;background:var(--tile);color:var(--ink)}
.setup-panel .add{margin:0;max-width:none}
.setup-panel>.out{flex-direction:row;justify-content:space-between;align-items:center}
.setup-panel .msg:empty{display:none}.setup-panel>.msg{padding-bottom:12px}
.pick{position:relative;display:inline-flex;align-items:center}
.pick select{appearance:none;border:0;background:transparent;cursor:pointer;padding:0 20px 0 0}
.pick svg{position:absolute;right:0;pointer-events:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);line-height:16px;color:var(--muted);white-space:nowrap}
/* a state, not a button: a dot in the colour of what it's about, then the word */
.chip::before,.setup-panel .onoff::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}
.period{display:inline-flex;gap:4px} .period[hidden]{display:none}
.period button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:var(--fs-s);cursor:pointer}
.period button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--win);font-weight:700}


/* story row: the number, the sentence, who is here now */
.story{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center}
.headline{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.headline:focus-visible,.now:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:6px}
.headline>b{font-size:var(--fs-xxl);line-height:1;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.headline span{font-size:var(--fs-s)}
.sentence{margin:0;font-size:var(--fs-m);line-height:1.45}
.say-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.goal-line{margin:0;min-height:32px;font-size:var(--fs-s);color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal-line b,.goal-text b{color:var(--ink)}
.sampled,.goal-text{margin:0;font-size:var(--fs-s);color:var(--muted)}
.flag{display:block;flex:none;color:var(--rule)} .flag.on{color:var(--page)}
.seg button:has(.flag){display:inline-flex;align-items:center;gap:4px} .seg button[aria-pressed="true"] .flag{color:inherit}
.lwrap{display:grid;grid-template-columns:minmax(0,1fr) 24px;align-items:center}
/* lists without flags keep the flag column empty, so numbers line up from one list to the next */
.list>.lrow{width:calc(100% - 24px)}
.lwrap>.goal-t,.lwrap>span:first-child{order:2}
/* faint until pointed at, so the list reads first but the flag can still be found */
.goal-t{all:unset;cursor:pointer;width:24px;height:28px;display:grid;place-items:center;border-radius:6px;opacity:.3}
.lwrap:hover .goal-t,.goal-t:focus-visible,.goal-t[aria-pressed="true"]{opacity:1}
.goal-t:hover{background:var(--line)}
.goal-t:focus-visible,.more-link:focus-visible,button.lrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.goal-line .goal-t{margin:0 -4px}
@media (hover:none){.goal-t{opacity:1}}

.link{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-decoration-thickness:2.5px;text-underline-offset:4px}
.link[data-f="referrer"],.link[data-f="channel"]{text-decoration-color:var(--src)} .link[data-f="path"]{text-decoration-color:var(--page)}
.link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.now{all:unset;cursor:pointer;display:flex}
.now-body{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.now-body>span:last-child,.now .pace{font-size:var(--fs-s);white-space:nowrap}
.now-body .chev{margin-left:4px;vertical-align:-1px}
/* the figures fill the width the block's lines of text give it, and never widen it */
.now .crowd{width:0;min-width:100%}
/* Wee People: one letter is one person; tight spacing makes a small crowd */
.ppl{font-family:WeePeople;font-size:26px;line-height:.86;letter-spacing:-.29em;white-space:nowrap;color:var(--live);font-weight:400}
.ppl .named{color:var(--src)}
/* someone who left fades to a light tint of the same colour */
.ppl .gone,.crowd .gone{color:var(--live-ps)}
.ppl.small{font-size:30px}
/* the crowd as a line of people in the order they arrived, ten to a row like text */
.crowd{display:grid;grid-template-columns:repeat(10,.31em);font-family:WeePeople;font-size:26px;font-weight:400;line-height:.86;color:var(--live);padding-right:4px}
.crowd span{white-space:nowrap}
.crowd .named{color:var(--src)}
/* Online's crowd: one row across the width (two on a phone), ending in how many more there were */
.crowd.wide{display:flex;flex-wrap:wrap;row-gap:6px;padding-right:0}
.crowd.wide>span:not(.crowd-more){flex:none;width:.31em}
.crowd-more{flex:none;align-self:flex-end;margin-left:8px;font:600 var(--fs-s)/1 var(--font);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.crowd-key{margin:10px 0 0;font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px}
.crowd-key b{color:var(--ink);font-size:var(--fs-s)}
.lrow.online .earlier{grid-column:3/5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.online>.chevc{grid-column:-2;align-self:center}

.grid{flex:1 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(250px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:20px;min-width:0;min-height:0;overflow:hidden;cursor:pointer;
  border-radius:var(--r-tile);background:var(--tile);box-shadow:0 0 0 1px var(--line)}
.t-days{grid-column:1/3;grid-row:1}
.t-flow{grid-column:3/5;grid-row:1/3}
.t-stay{grid-column:1;grid-row:2}
.stay-time{margin:0;font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:baseline;gap:8px}
.wr-v .wr-rate{margin-left:6px;font-size:var(--fs-xs);font-weight:400;color:var(--muted)}
.stay-time b{font-size:var(--fs-l);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.t-stay .cap{margin-top:auto}
.t-stay .viz{margin-top:auto}
.stay-card .sq-box{height:104px;flex:none}
.stay-card .stay-time{margin-top:8px;flex-wrap:wrap}
.stay-card .more-link{margin-top:auto}
.t-pages{grid-column:2;grid-row:2}
.tile-title{all:unset;font-size:var(--fs-s);line-height:1.35;color:var(--muted);cursor:pointer;min-width:0;display:block}
button.tile-title:hover{color:var(--ink)}
.tile-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile-key,.mark .tag{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.tile-key .sw{border-radius:2px}
.sw.here,.sw.gone{border-radius:50%;width:8px;height:8px;margin-right:4px} .sw.here{background:var(--live)} .sw.gone{background:var(--live-ps)}
.tile-title:focus-visible,.node:focus-visible,.landed .lbl:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.cap{margin:0;font-size:var(--fs-m);line-height:1.3}
.t-pages .cap{font-size:var(--fs-s)}
.viz{flex:1;min-height:0;position:relative}
/* the chart fills the tile without adding to its height, so redraws can't grow it */
.viz>svg{position:absolute;left:0;top:0;display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-s);text-align:center}

/* daily bars, one label at the spike, the event markers under them */
.peak{position:absolute;top:0;font-size:var(--fs-xs);line-height:1.3;white-space:nowrap}
.peak b{font-weight:700}
.peak span{color:var(--muted)} .peak span.told{color:var(--ink)}
.peak .sw{width:8px;height:8px;margin-right:4px}
.marks{position:relative;height:28px;flex:none}
/* under a chart with a scale, the markers leave out the scale's 40px column (dayBars' padR), so each sits under its bar */
.chart+.marks{margin-right:40px}
.mark{all:unset;position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:4px;padding:0 4px}
.mark .g{display:flex;gap:4px}
.mark:hover .tag{color:var(--ink)}
.mark:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.m-date{position:absolute;bottom:0;font-size:var(--fs-xs);color:var(--muted)} .m-date.end{right:0}
.m-day{position:absolute;bottom:0;transform:translateX(-50%);font-size:var(--fs-xs);color:var(--muted)}
.glyph{flex:none;display:block}
/* the owner's notes: a day of home's or the overview's chart opens a small form for that day; arrows pick the day.
   --pad is the chart's scale on the right, which has no days */
.notable{cursor:pointer;border-radius:4px;position:relative}
.notable rect[data-hint]:hover,.notable rect[data-hint].on{fill:color-mix(in srgb,var(--ink) 10%,transparent)}
.notable:focus-visible{outline:none}
.notable:focus-visible::after{content:"";position:absolute;top:8px;bottom:2px;pointer-events:none;border-radius:4px;outline:2px solid var(--focus);
  width:calc((100% - var(--pad)) / var(--n));left:calc((100% - var(--pad)) * var(--i) / var(--n))}
.note-edit{position:fixed;z-index:11;width:min(320px,calc(100vw - 32px));box-sizing:border-box;margin:0;padding:12px;border-radius:14px;
  background:var(--tile);box-shadow:var(--pop);display:flex;flex-direction:column;gap:8px;font-size:var(--fs-s)}
.note-edit .add{margin:0;max-width:none}
.note-edit .err{color:var(--bnc);font-size:var(--fs-xs)} .note-edit .err:empty{display:none}
.note-edit .del{all:unset;cursor:pointer;color:var(--muted);font-size:var(--fs-xs);align-self:flex-start;border-radius:4px}
.note-edit .del:hover{color:var(--ink);text-decoration:underline}

/* what happened */
.event{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:start;
  font-size:var(--fs-xs);line-height:1.3;border-radius:6px}
.event .glyph{margin-top:4px}
.event:hover b,.node:hover>span:first-child,.landed .lbl:hover b,.landed .lbl:hover,button.lrow:hover .name{text-decoration:underline}
.event b,.node>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event>span>span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.events-list,.list{display:flex;flex-direction:column;margin:0 -8px}
.events-list .event{padding:8px;font-size:var(--fs-s);border-radius:8px}
.events-list .event b,.events-list .event>span>span{white-space:normal}
.events-list .event:hover{background:var(--line)}

/* sankey */
.flow{height:100%;display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:8px}
.flow svg{width:100%;height:100%;display:block;overflow:visible}
.nodes{position:relative}
.node{all:unset;position:absolute;transform:translateY(-50%);cursor:pointer;font-size:var(--fs-xs);line-height:1.3;max-width:120px}
.nodes.left .node{right:0;text-align:right}
.nodes.right .node{left:0}
.node.told>span:first-child{white-space:normal;overflow-wrap:normal}
.node b{font-weight:700}
.node .chg{color:var(--muted);font-variant-numeric:tabular-nums}
.node.told .chg{color:var(--ink);font-weight:700}

/* rows of ten squares: out of every 10 visits, how many left after one page */
.sqs{height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;padding-top:4px}
.sqrow{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;min-width:0;border-radius:6px}
.sqrow:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.sqrow:hover .sq-label{color:var(--ink)}
.sq-num{flex:0 1 auto;display:flex;align-items:baseline;gap:8px;min-width:0;max-width:100%}
.sq-num b,.num .v{font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums}

.sqrow.stack .sq-num{flex-direction:column;align-items:flex-start;gap:0}
.sqrow.under{flex-direction:column;align-items:flex-start;gap:4px}
.sq-label,.num .k,.credit{font-size:var(--fs-xs);color:var(--muted)}
/* a long name ends in an ellipsis, whole in its hint */
.sq-label{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sqrow svg{display:block;flex:none}

/* heatmap */
.heat{height:100%;display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:4px 8px}
.heat .days{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));font-size:var(--fs-xs);color:var(--muted);align-items:center}
.heat .cells{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:2px}
.heat .cells i{border-radius:2px}
/* amber ring with a thin tile-coloured gap inside, so it shows on any blue */
.heat .cells i.hit{outline:2px solid var(--src);outline-offset:-2px;box-shadow:inset 0 0 0 3px var(--tile)}
.heat .hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;font-size:var(--fs-xs);color:var(--muted);position:relative;padding-top:6px}
/* what the hours card's sentence names: the busiest hour outlined, the busiest three hours underlined */
.heat .cells i.best{outline:2px solid var(--ink);outline-offset:-1px}
.heat .hours .hw{position:absolute;top:0;height:3px;border-radius:2px;background:var(--time)}
.ring{display:inline-block;width:10px;height:10px;border:2px solid var(--src);vertical-align:-1px}

.state{display:flex;flex-direction:column;gap:4px;padding:28px 8px;color:var(--muted);font-size:var(--fs-s);grid-column:1/-1}
.state.error,.onboard{grid-column:1/-1;grid-row:1/-1;align-self:center;justify-self:center;max-width:460px;text-align:center;align-items:center;gap:8px;padding:40px 28px}
.state.error b,.onboard b{color:var(--ink);font-size:var(--fs-m);font-weight:650}
.onboard{color:var(--muted);font-size:var(--fs-s)}
.onboard .logo{width:56px;height:56px;margin-bottom:8px}
.onboard code{font:12px var(--mono);background:var(--line);color:var(--ink);padding:4px 8px;border-radius:8px;overflow-wrap:anywhere}
.add{display:flex;gap:8px;margin-top:8px;width:100%;max-width:340px}
.add input{flex:1;min-width:0;height:32px;box-sizing:border-box;border:0;border-radius:999px;padding:0 16px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:inherit;font-size:var(--fs-s)}
.add .retry{margin:0;height:32px;padding:0 16px}
.err{color:var(--bnc);font-size:var(--fs-s)} .err:empty{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(440px,calc(100% - 32px));z-index:20;background:var(--ink);color:var(--tile);border-radius:12px;padding:10px 14px;font-size:var(--fs-s)}
.retry{border:0;border-radius:999px;padding:8px 16px;background:var(--ink);color:var(--win);cursor:pointer;font-size:var(--fs-s);font-weight:600;margin-top:4px}
.sk{display:block;background:var(--line);border-radius:6px}
#home.busy .story,#home.busy .grid,.layer-body.busy{opacity:.5;transition:opacity .2s}
.state b,.legend .total{color:var(--ink);font-weight:600}

/* zoom layers */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--win)}
.inner{position:absolute;inset:0;display:flex;flex-direction:column}
/* An open sub-page is at least as tall as the window and grows with its content; the page scrolls. */
.win.grow{overflow:hidden}
.win.grow>.home{position:absolute;inset:0 0 auto 0}
.layer.grown,.layer.grown>.inner{position:relative;inset:auto}
.layer.grown .layer-body{overflow:visible;flex:none}
.ghost{position:absolute;margin:0;pointer-events:none;transform-origin:center}
.layer-head{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.circle{all:unset;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:var(--tile);box-shadow:inset 0 0 0 1px var(--line)}
.circle:hover{background:var(--line)}
.crumbs{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.crumbs span{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs h2{font-size:var(--fs-l);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-body{flex:1;min-height:0;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:16px}

/* sub-pages: sentence → numbers → the enlarged chart → the section that answers the question → rows */
.say{margin:0;font-size:var(--fs-l);line-height:1.4;max-width:860px}
.say b.told{text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:4px;text-decoration-color:var(--src)}
.say b.told.time{text-decoration-color:var(--time)}
.say-sub{margin:4px 0 0;font-size:var(--fs-s);color:var(--muted)}
.nums{display:flex;align-items:flex-end;gap:16px 40px;flex-wrap:wrap}
.hero{display:flex;flex-direction:column}
.hero-sq{margin-top:8px}
.hero-sq svg{display:block}
.hero .big{font-size:var(--fs-xl);font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero>span:last-child{font-size:var(--fs-s)}
.num{display:flex;flex-direction:column;gap:4px}

.card{background:var(--tile);border-radius:var(--r-tile);box-shadow:0 0 0 1px var(--line);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:stretch}
.io{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 16px;align-items:center;margin-top:8px}
.io .k{font-weight:600;font-size:var(--fs-s)}
.io .strip{height:20px;border-radius:6px}
.io p{grid-column:2;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:0 16px;font-size:var(--fs-s)}
.io-k{all:unset;cursor:pointer;white-space:nowrap;padding-block:4px}
.io-k:hover{text-decoration:underline}.io-k:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.io .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.io small{color:var(--muted);font-size:var(--fs-xs);margin-left:4px}.io .io-more{color:var(--muted)}
.more-link{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 10px;align-items:center;gap:12px;
  width:calc(100% - 8px);margin:0 -8px;padding:8px;border-radius:8px;font-size:var(--fs-s);color:var(--muted)}
.more-link:hover{background:var(--line);color:var(--ink)}
.now .chev{flex:none;transition:transform .15s}
.now:hover .chev{transform:translateX(2px);color:var(--ink)}

.delta{font-size:var(--fs-xs);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta .muted{font-weight:400}

.dim-body{display:flex;flex-direction:column;gap:12px}
.legend{font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}

.chart{position:relative;min-height:220px;height:24vh}
.chart svg{display:block}
.chart text{fill:var(--muted);font-size:var(--fs-xs);font-family:var(--font)}
.chart .grid-l{stroke:var(--line)}
.steps{position:relative;min-height:196px;height:20vh}
.steps .step{all:unset;position:absolute;cursor:pointer;border-radius:6px}
.steps .step:focus-visible{outline:2px solid var(--focus);outline-offset:0}
.reach-body{display:flex;align-items:center;gap:16px 48px;flex-wrap:wrap}
.reach-body>div:first-child{flex:0 1 480px}
.card-say{margin:0;font-size:var(--fs-m);line-height:1.4}
/* no word left alone on a last line: balanced where text is centred or short, pretty in paragraphs */
.say,.card-say,.sentence{text-wrap:pretty}
p,li,figcaption,.say-sub,.cap{text-wrap:pretty}
.state.error,.onboard,.empty,.tip,h1,h2,.card-title,.tile-title{text-wrap:balance}
/* A page's speed as a visit: hatched while readers wait for the main content (a tick marks the period
   before), then solid while they read. Waiting gets 16px a second (up to 10 s), far more than reading, so a few
   seconds still show next to minutes. */
.wr{display:grid;grid-template-columns:var(--wait) 1fr;gap:6px 4px;margin-top:14px}
.wr-k{font-size:var(--fs-xs);white-space:nowrap}
.wr-k+.wr-k{padding-left:max(0px,calc(64px - var(--wait)))}
.wr-wait,.wr-read{height:28px;border-radius:6px}
.wr-wait{position:relative;overflow:visible;background:repeating-linear-gradient(45deg,var(--page-t) 0 2.5px,var(--page-p) 2.5px 6px)}
.wr-was{position:absolute;top:-4px;bottom:-4px;left:calc(var(--was) - 1px);border-left:2px solid var(--ink)}
.wr-read{background:var(--page)}
.wr-v{display:flex;flex-direction:column;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.wr-v b{font-size:var(--fs-s);color:var(--ink)}
.wr-v+.wr-v{align-items:flex-end}
/* the page itself, darker further down where fewer still read; a plain page-shaped column until its picture comes */
.reach-fig{margin:0;display:flex;flex-direction:column;gap:12px}
.shotwrap{position:relative;display:flex;gap:12px} .shotwrap[hidden]{display:none}
.reach-nums{display:flex;gap:16px 40px;flex-wrap:wrap}
.shot{position:relative;flex:none;width:150px;height:360px;border-radius:6px;background:var(--paper);box-shadow:0 0 0 1px var(--line);transition:width .3s,height .3s}
.shot img,.shot .shade{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
.shot img{opacity:0;transition:opacity .4s} .shot img.in{opacity:1}
.shot i{position:absolute;left:0;right:0;height:10%}
/* reaches across to its label */
.shot b{position:absolute;left:0;right:-6px;height:2px;margin-top:-1px;background:var(--page);pointer-events:none}
.ticks{position:relative;min-width:120px;font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ticks span{position:absolute;left:0;transform:translateY(-50%)}
.ticks .t-top{transform:none} .ticks .t-end{transform:translateY(-100%)}
.t-drop{color:var(--page);font-weight:700}
.reach-fig figcaption{max-width:320px}
.fun-head{margin-top:12px}
/* a funnel: one row per step against the first step's visits */
.funnels-card .steps{height:auto;min-height:0}
.fsteps{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;gap:10px 16px;align-items:center;margin-top:4px}
.step-n{all:unset;cursor:pointer;font-size:var(--fs-s);border-radius:4px}
.step-n:hover{text-decoration:underline}.step-n:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fsteps .tr{height:28px;border-radius:6px;overflow:hidden;background:var(--line);display:flex}
.fsteps .tr i{flex:none;font-style:normal}
.fsteps .kept{background:var(--page);min-width:4px}
.fsteps .gone{background:var(--page-p);box-shadow:inset 0 0 0 1px var(--page-t)}
.fsteps .gone.hot{background:var(--page-t);box-shadow:none}
.fsteps .gone span,.fsteps .lbl{display:block;padding-left:10px;line-height:28px;font-size:var(--fs-xs);white-space:nowrap}
.fsteps .gone.hot span{font-weight:700;font-size:var(--fs-s)}
.fsteps .lbl{color:var(--muted)}
.fsteps .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-size:var(--fs-s)}
.fsteps .v small{font-weight:400;color:var(--muted);margin-left:6px;font-size:var(--fs-xs)}
.landed{position:relative;min-height:276px;height:28vh}
.landed .lbl{all:unset;position:absolute;transform:translateY(-50%);font-size:var(--fs-xs);line-height:1.3;cursor:pointer;white-space:nowrap;max-width:calc(40% - 18px);overflow:hidden;text-overflow:ellipsis}
.landed .lbl span{color:var(--muted)}
.cross .lbl{max-width:calc(32% - 14px)}
.cross.narrow .lbl{max-width:calc(40% - 14px)}
.cross .lbl.l{transform:translate(-100%,-50%);text-align:right}
.cross-say{margin:0 0 12px;font-size:var(--fs-s)}
.cross-k{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin-bottom:4px}
.cross-say:empty{display:none}
/* three columns, in visits: sources, the pages they landed on, then read on or left */
.landed.outcome{height:340px}
.outcome .lbl{max-width:30%}.outcome span.lbl{cursor:auto;text-decoration:none}
.outcome .lbl.l{transform:translate(-100%,-50%);text-align:right}
.outcome .lbl.m{text-shadow:0 0 3px var(--tile),0 0 3px var(--tile),0 0 3px var(--tile)}
.svgc [tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.node .left{color:var(--ink)}
.rmap{position:relative;height:380px}
.svgc svg{display:block;overflow:visible}
.rmap text.corner{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted);opacity:.8}
.svgc [tabindex]{cursor:pointer;outline:none}
.svgc text{fill:var(--muted);font-size:var(--fs-xs);font-family:var(--font)}
.svgc text.ink{fill:var(--ink);font-weight:600}
.svgc .halo{paint-order:stroke;stroke:var(--tile);stroke-width:4px;stroke-linejoin:round}
.lanes text.fig{font-family:WeePeople;font-size:30px}
.lanes .lane-name:hover{text-decoration:underline}
.tip{position:absolute;pointer-events:none;background:var(--tile);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:var(--fs-xs);line-height:1.35;
  white-space:nowrap;transform:translate(-50%,calc(-100% - 8px));box-shadow:0 0 0 1px var(--line),0 6px 18px -6px rgba(0,0,0,.25);z-index:2}
.tip b{font-variant-numeric:tabular-nums}
.tip.hint{position:fixed;white-space:pre-line;max-width:340px;width:max-content;z-index:10}
.tip.hint.below{transform:translate(-50%,8px)}

.blk{all:unset;box-sizing:border-box;position:absolute;padding:8px;border-radius:4px;overflow:hidden;font-size:var(--fs-xs);line-height:1.3}
button.blk{cursor:pointer;transition:filter .15s;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left}
button.blk:hover{filter:brightness(1.08)}
button.blk:focus-visible{outline:2px solid var(--tile);outline-offset:-2px;box-shadow:inset 0 0 0 4px var(--ink)}
.blk b{display:block;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;line-height:1.25}
.blk span{font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.blk.ring-blk{box-shadow:inset 0 0 0 2px var(--ink)}
.blk.tall b{white-space:nowrap}
.blk .hy{font-style:normal;opacity:.5}
.blk.tall{writing-mode:vertical-rl;transform:rotate(180deg)}

.seg{display:inline-flex;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px;gap:0}
.seg button{all:unset;padding:4px 12px;line-height:16px;border-radius:999px;font-size:var(--fs-s);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--win)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* lists: one row style everywhere, with a thin bar after the name. Counts scale to the largest row and have
   no track; rates (0–100%) sit on a track, which is the whole. */
.lrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(48px,1fr) 64px 40px 64px 10px;gap:12px;
  align-items:center;width:100%;padding:8px;border-radius:8px;font-size:var(--fs-s)}
.lrow.rate{grid-template-columns:minmax(0,1.2fr) minmax(48px,1fr) 44px 64px 10px}
button.lrow{cursor:pointer}
button.lrow:hover{background:var(--line)}
.lrow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* a tag beside a name (a site's channel, a page's read time) ends the name's cell, so the tags make a column */
.lrow .name:has(>.lbl){display:flex;justify-content:space-between;align-items:baseline;column-gap:12px;min-width:0;line-height:20px}
.lrow .name>.lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .name small{flex:none;color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.lrow .bar{height:8px;border-radius:4px;overflow:hidden}
.lrow .bar i{display:block;height:100%;border-radius:4px}
.lrow.rate>.bar{height:auto;overflow:visible;border-radius:0}
.lrow.rate>.bar svg{display:block}
.lrow .num{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lrow .pct,.lrow .was{color:var(--muted);font-size:var(--fs-xs);text-align:right;font-variant-numeric:tabular-nums}
.lrow .delta{text-align:right}
.lrow.lhead{padding-block:0 4px;font-size:var(--fs-xs);color:var(--muted)}
.lrow.lhead>span:nth-child(n+3){text-align:right}
.chev{width:7px;height:12px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* who is here, by page */
.lrow.online{grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr) minmax(0,120px) 88px 10px;row-gap:4px;align-items:baseline}
.lrow.online>.name,.lrow.online>.ppl{align-self:center}
.lrow.online .ppl{font-size:24px;line-height:1;letter-spacing:-.3em}
.lrow.online .num{font-weight:600}
.lrow.online .cty{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.online .num.muted{font-weight:400}
.lrow.online>.muted{color:var(--muted)}
.lrow.lhead.online{align-items:center}
.lrow.lhead.online>span{text-align:left}
.lrow.lhead.online>span:nth-child(5){text-align:right}
.lrow.online .src{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.told-page{text-decoration:underline;text-decoration-color:var(--page);text-decoration-thickness:2.5px;text-underline-offset:4px}
.mix{display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px 16px;align-items:center;margin-top:8px}
.mix .k{color:var(--muted)}
.strip{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.strip i{min-width:2px}
.mix p{grid-column:2;margin:0;display:flex;flex-wrap:wrap;gap:2px 16px}
.mix span{white-space:nowrap}

@media (max-width:1000px){
  .story{grid-template-columns:auto auto;gap:16px 28px}
  .story .say-col{grid-column:1/-1;grid-row:2}
  .story .now{justify-self:end}
}
@media (max-width:760px){
  body{padding-block:12px}
  .win{height:auto;min-height:0;max-height:none;overflow:visible;background:transparent;box-shadow:none;border-radius:0}
  .home{position:relative;inset:auto;height:auto;overflow:visible;padding:4px 0}
  .hint,.layer-head .chip{display:none}
  .story{grid-template-columns:1fr;gap:12px}
  .story .now{justify-self:stretch}.now-body{width:100%}
  .now-body>span:last-child{white-space:normal}
  .grid{flex:none;grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(240px,auto)}
  .t-days,.t-flow,.t-stay,.t-pages{grid-column:1;grid-row:auto}
  .t-flow{min-height:440px}
  .rmap{height:340px}
  .flow{grid-template-columns:minmax(0,1fr) minmax(80px,1fr) minmax(0,1fr)}
  .node{font-size:var(--fs-xs);max-width:none}
  .node>span:first-child,.kw .name{white-space:normal;overflow-wrap:anywhere}
  .sq-num{flex-direction:column;gap:0}
  .sqrow.under .sq-num{flex-direction:row;gap:8px}
  .stay-card .sq-box{height:124px}
    .two{grid-template-columns:1fr}
  .io{grid-template-columns:1fr}.io p{grid-column:1}
  .fsteps{grid-template-columns:minmax(0,1fr) max-content;row-gap:6px}
  .fsteps .tr{grid-column:1/-1;margin-bottom:8px}
  /* phones: the name gets the row's width and its bar goes under it, so names aren't cut to a few letters */
  .lrow{grid-template-columns:minmax(0,1fr) 56px 56px 10px;column-gap:8px;row-gap:4px}
  .lrow:not(.online)>.name{grid-column:1;grid-row:1}
  .lrow:not(.online)>.bar{grid-column:1;grid-row:2;height:4px}
  .lrow .name:has(>.lbl){flex-direction:column;align-items:flex-start}
  .lrow .name small{line-height:16px}
  .lrow:not(.online)>:not(.name):not(.bar){grid-row:1/3}
  .lrow.lhead:not(.online)>span:nth-child(2){display:none}
  .lrow .pct,.lrow.lhead:not(.rate):not(.online)>span:nth-child(4){display:none}
  /* keywords are short and are the point: no bar, and whole words */
  .kw>.lrow{grid-template-columns:minmax(0,1fr) 56px 56px 10px}
  .kw .bar,.kw>.lhead>span:nth-child(2){display:none}
  /* phones: the crowd above already shows the figures, so the table keeps page, source and time */
  .lrow.online{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 60px 10px;column-gap:8px}
  .lrow.online .earlier{grid-column:2/4}
  .lrow.online .cty,.lrow.online>.ppl,.lrow.lhead.online>span:nth-child(2){display:none}
  .lrow.lhead.online>span{white-space:nowrap}
  .lrow.rate{grid-template-columns:minmax(0,1fr) 40px 56px 10px}
  .shot{height:300px} .reach-nums{column-gap:24px}
  .say{font-size:var(--fs-m)}
  .mix{grid-template-columns:1fr}.mix p{grid-column:1}
}
@media (prefers-reduced-motion:reduce){.blk,.shot,.shot img,.now .chev{transition:none}}
</style>

<body>
<main class="win" id="win">
  <div class="home" id="home">
    <div class="topbar">
      <div class="site"><h1 id="site"></h1><button type="button" class="share-b" id="share" aria-expanded="false" aria-controls="share-panel" hidden>Share</button><button type="button" class="share-b" id="setup" aria-expanded="false" aria-controls="setup-panel" hidden>Setup</button><span class="hint" id="hint"></span>
        <section class="card share-panel" id="share-panel" aria-label="Share" hidden></section><section class="card share-panel setup-panel" id="setup-panel" aria-label="Setup" hidden></section></div>
      <div class="period" role="group" aria-label="Show the last" id="period">

</main>
<footer class="foot"><a href="https://github.com/sryo/lede" target="_blank" rel="noopener"><b>Lede</b></a> · open-source analytics that counts people, not bots</footer>
<div class="sr" id="status" role="status"></div>

<script type="module">
import { labelOf, fmtN, fmtInt, count, fmtSigned, fmtPct, fmtDur, fmtDay, fmtWeekday, fmtDate, dayDate, esc, maxOf, sum, median,
  findSpike, readStory, tellStory, findings, spikeSegment, waterfallCaption, bounceSplit, bounceCaption,
  flowCaption, crowd, crowdCaption, crowdLine, onlineStory, pagesCaption, pagesFinding, todayPace, sourceStory, audienceStory, audienceNote, readers, pageStory, scrollStory, scrollPicture, scrollNumbers, pictureCaption, eventsSentence, channelShare, pathHTML, pageName, goalStory, suggestGoal, fmtRate, nextStory, nextItems, funnelStory, funnelName, parseSteps, stepHint, funnelBars, funnelOffer, FUNNEL_EMPTY,
  dayHint, ribbonHint, sourceHint, pageHint, dayKey, keywordsCard, unitOf, rowLabel, countNotes, quietRuns, vitalsLine, vitalsFinding, speedStory, VITALS_HINT, fmtShare, linksStory, noneYet, hoursStory, bounceStandout, bounceHeld, onlinePace, waterfallMovers, readsMore, DIRECT_MEANS, goalFromPage, pageVerdict, busyWindow, fitLabel,
  ICONS, iconFor, iconSVG, leftWord, pairStay, outcomeStory, readingMap, lanes, laneX } from '/story.js';
import { viewToUrl, urlToView } from '/routes.js';

const $=(s,r=document)=>r.querySelector(s);
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const TZ=new Date().getTimezoneOffset(),TZNAME=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
// INSIGHT: home may get Workers AI's line under its sentence. SHARED: opened from a read-only link, so nothing
// can be changed and sharing is left out.
let SITE='',SITES=[],DEMO=false,INSIGHT=false,SHARED=false,MESSAGES=false,PASSWORD=false,DAYS=30;
// What the home screen worked out, for the views that open from it. homeDrawn settles when the latest home
// draw has: views fetch their own data first and wait for it only to read HOME.
let HOME=null,homeDrawn=Promise.resolve(false);
const home=()=>HOME&&!HOME.empty?HOME:null;

/* ---------- API ---------- */
// Answers are reused for five minutes, so a tab left open still moves on to new data.
const memo=new Map(),MEMO_MS=5*60e3;
function api(route,params={},fresh=false){
  const qs=new URLSearchParams({site:SITE,days:DAYS,tz:TZ,tzName:TZNAME});
  for(const [k,v] of Object.entries(params))if(Array.isArray(v))v.forEach(x=>qs.append(k,x));else if(v!=null)qs.set(k,v);
  const url=`/api/${route}?${qs}`;
  const hit=memo.get(url);
  if(fresh||!hit||Date.now()-hit.at>MEMO_MS){
    for(const [k,v] of memo)if(Date.now()-v.at>MEMO_MS)memo.delete(k);
    // fresh skips the browser's copy too, which the server lets it keep for 15 to 60 seconds.
    memo.set(url,{at:Date.now(),p:fetch(url,fresh?{cache:'no-store'}:undefined).catch(()=>{throw new Error('Lede didn’t answer. Check your internet connection, then try again.')}).then(async r=>{
      const body=await r.json().catch(()=>({}));
      if(r.status===401&&body.signIn){showSignIn();throw Object.assign(new Error(body.error),{signIn:true})}
      if(!r.ok)throw new Error(body.error||'Something went wrong reading the stats. Try again in a minute.');
      return body;
    }).catch(e=>{memo.delete(url);throw e})});
  }
